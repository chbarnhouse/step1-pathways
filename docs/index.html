  { id: 'b-cofactors', name: 'Cofactor drill', blurb: 'Every cofactor hidden; everything else shown.',
    mode: 'single', el: { met: 'show', enz: 'show', cof: 'quiz' } },
  { id: 'b-direction', name: 'Which way?', blurb: 'Reversible or one-way, and in which direction.',
    mode: 'step', given: 'mets', el: { enz: 'show', cof: 'show', dir: 'quiz' } },

const QUIZ_DEFAULTS = { mode: 'single', given: 'mets', start: 'random', ahead: 'hide', cofCount: true, weak: false, answer: null, view: null,
  el: { met: 'quiz', enz: 'quiz', trn: 'quiz', cof: 'show', loc: 'show', dir: 'quiz', path: 'quiz' } };

/* ---------- combined pathways ----------

const composeCache = new Map();

<script>
/* Automatic backups for the static copy (the server copy saves on the server and needs none).
   1. Linked file (Chrome, Edge): you pick a file once; every change is written to it a moment later.
      The browser remembers the file but asks for permission again after a restart, so the dashboard
      shows a one-click Reconnect when that happens. Firefox and Safari have no way for a page to write
      to a file you chose, so this option doesn't appear there.

'use strict';

const AutoBackup = {
  supported: typeof window.showSaveFilePicker === 'function',
  handle: null,
  status: 'off', // off | linked | needs-permission | error
  savedAt: 0,
  t: null,
  db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('step1-pathways', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('handles');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async idb(op, value) {
    const db = await this.db();
    return new Promise((res, rej) => {
      const tx = db.transaction('handles', op === 'get' ? 'readonly' : 'readwrite'), st = tx.objectStore('handles');
      const r = op === 'get' ? st.get('backup') : op === 'put' ? st.put(value, 'backup') : st.delete('backup');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async init() {
    if (!this.supported || Store.mode !== 'local') return;
    try {
      this.handle = await this.idb('get') || null;
      if (!this.handle) return;
      this.status = (await this.handle.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'linked' : 'needs-permission';
      this.savedAt = local.get('pathways.autoFileAt') || 0;
    } catch { this.status = 'off'; }
  },
  async link() {
    try {
      this.handle = await window.showSaveFilePicker({ suggestedName: 'step1-pathways-backup.json', types: [{ description: 'Step 1 Pathways backup', accept: { 'application/json': ['.json'] } }] });
    } catch { return false; } // cancelled
    await this.idb('put', this.handle).catch(() => {});

    return this.write();
  },
  async reconnect() {
    if (!this.handle) return false;
    try { this.status = (await this.handle.requestPermission({ mode: 'readwrite' })) === 'granted' ? 'linked' : 'needs-permission'; } catch { this.status = 'needs-permission'; }

  async unlink() { this.handle = null; this.status = 'off'; await this.idb('delete').catch(() => {}); },
  schedule() { if (this.status === 'linked') { clearTimeout(this.t); this.t = setTimeout(() => this.write(), 1500); } },

</script>
<script>
/* Pathway JSON → study model.
   reactions[] in pathway order. A reaction is on the spine unless branch:true.
     from / to          main substrate → main product
     also_to[]          side products (e.g. aldolase → DHAP)
     also_from[]        side inputs drawn as metabolites (e.g. gluconeogenic aldolase ← DHAP)
     branch:true        a side reaction between a spine metabolite and a side one, either direction
     cofactors {in,out} ids from the shared cofactor list or the pathway's own `cofactors`
       reversible, multiplier, requires[], tags[]
     loc        compartment (cytosol, mitochondrial matrix, ER lumen…); tissue: organ/cell type when it differs within a pathway
     transport  the step moves a metabolite between compartments; its "enzyme" is the transporter
   circular:true → the last spine reaction returns to the first metabolite. pathway.tissue = where the pathway runs. */
'use strict';

function buildModel(p, sharedCof = Library.sharedCof()) {
  const cof = Object.assign({}, sharedCof, p.cofactors || {});
  const mets = p.metabolites || {}, enzs = p.enzymes || {}, rx = p.reactions || [];
  const errs = [];
  rx.forEach((r, i) => {
    const n = `Step ${i + 1}`;
    if (!enzs[r.enzyme]) errs.push(`${n}: no enzyme chosen`);
    for (const k of ['from', 'to']) if (!mets[r[k]]) errs.push(`${n}: "${k}" metabolite missing`);
    for (const k of ['also_to', 'also_from']) for (const s of r[k] || []) if (!mets[s]) errs.push(`${n}: unknown metabolite "${s}" in ${k}`);
  });
  const spine = rx.filter(r => !r.branch);
  if (!spine.length) errs.push('Add at least one step that is not a branch.');
  if (errs.length) throw new Error(errs.join('\n'));

  const items = {};
  for (const [id, m] of Object.entries(mets))
    items['m:' + id] = { key: 'm:' + id, kind: 'met', id, name: m.name, short: m.short, aliases: m.aliases || [], nicknames: m.nicknames, notes: m.notes };
  const m0 = { cof };
  for (const r of rx) {
    const e = enzs[r.enzyme];
    items['e:' + r.id] = { key: 'e:' + r.id, kind: r.transport ? 'trn' : 'enz', id: r.enzyme, rxn: r, name: e.name, short: e.short, aliases: e.aliases || [], nicknames: e.nicknames, notes: e.notes };
    // A step's cofactors are quizzable, one blank per side: 'c:<step>' is what goes in (or the only side there is),
    // 'o:<step>' what comes out when both sides exist. (Before 3.9 'c:' was the whole set; its history stays with the inputs.)
    const c = r.cofactors || {}, ci = c.in || [], co = c.out || [];
    const cofItem = (key, cofs) => ({ key, kind: 'cof', side: cofs.in ? 'in' : 'out', rxn: r, cofs, name: cofText(m0, cofs), aliases: [], notes: null });
    if (ci.length || co.length) items['c:' + r.id] = cofItem('c:' + r.id, ci.length ? { in: ci } : { out: co });
    if (ci.length && co.length) items['o:' + r.id] = cofItem('o:' + r.id, { out: co });
  }

  const spineMets = p.circular ? spine.map(r => r.from) : [spine[0].from, ...spine.map(r => r.to)];
  const onSpine = new Set(spineMets);
  const branches = rx.filter(r => r.branch);

  // Reading order for Full recall and the List view: metabolite, enzyme, metabolite…
  // Side products follow the enzyme that makes them; side inputs come just before the enzyme that uses them;
  // dead-end branches follow the metabolite they leave from.
  const seq = [], seen = new Set();
  const push = k => { if (!seen.has(k)) { seen.add(k); seq.push(k); } };
  const pushRx = r => { push('e:' + r.id); for (const k of ['c:', 'o:']) if (items[k + r.id]) push(k + r.id); };
  const pushMet = id => {
    if (seen.has('m:' + id)) return;
    // Side metabolites that only feed into this one (glucose from the blood via GLUT) come just before it.
    for (const b of branches) if (b.to === id && !onSpine.has(b.from) && !seen.has('m:' + b.from) && !rx.some(r => (r.also_to || []).includes(b.from) || (r !== b && r.to === b.from))) { push('m:' + b.from); pushRx(b); }
    push('m:' + id);
    for (const b of branches) {
      if (b.from !== id || seen.has('e:' + b.id)) continue;
      if (onSpine.has(b.to)) { if (!onSpine.has(id)) pushRx(b); }
      else { pushRx(b); pushMet(b.to); }
    }
  };
  pushMet(spineMets[0]);
  for (const r of spine) {
    for (const s of r.also_from || []) {
      for (const b of branches) if (b.to === s && seen.has('m:' + b.from)) pushRx(b);
      pushMet(s);
    }
    pushRx(r);
    for (const s of r.also_to || []) pushMet(s);
    if (!(p.circular && r.to === spineMets[0])) pushMet(r.to);
    // Bypasses between two metabolites already read (a combined pathway's reverse steps) follow right away.
    for (const b of branches) if (onSpine.has(b.from) && onSpine.has(b.to) && seen.has('m:' + b.from) && seen.has('m:' + b.to)) pushRx(b);
  }

    bg += `<rect class="zone t-${zoneTone(k)}" x="${-BLEED}" y="${-BLEED}" width="${W + 2 * BLEED}" height="${H + 2 * BLEED}"/>` + zoneLabel(m, statusOf, k, 16, 18, 'start');

  }
  // A region's name sits on its top border, on a small tab at the right end, so the dashed line never runs through it.
  const legend = (c, k) => {
    const name = m.items['z:' + k]?.name || '', tw = name.length * 8.1 + 16;
    const x0 = c.x + c.w - 14 - tw; // right end: arrows and enzyme names crowd the left

  };
  if (zones) {

      cs.forEach(c => { bg += `<rect class="region t-${zoneTone(k)}" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="14"/>`; fg += legend(c, k); });
      drawn.add(k);
    }

    spine.forEach(r => {
      const k = zoneOfR(r), a = pos[r.from], b = pos[r.to];
      if (!r.transport || !k || drawn.has(k) || !m.items['z:' + k] || !a || !b || a.x === b.x) return;
      // Same endpoints as the slanted arrow; the name goes just under the arrow, left of the wall.
      const i = Math.max(L.laneOf[r.from] || 0, L.laneOf[r.to] || 0), xm = laneLeft(i), dir = Math.sign(b.x - a.x);
      const p1 = [a.x + dir * 40, a.y + BH + 4], p2 = [b.x - dir * 40, b.y - 4], t = (xm - p1[0]) / (p2[0] - p1[0] || 1);
      bg += zoneLabel(m, statusOf, k, xm - 10 * dir, p1[1] + t * (p2[1] - p1[1]) + 24, dir > 0 ? 'end' : 'start');
      drawn.add(k);
    });
    membranes.forEach(mb => {
      // Crosses the transport arrow next to the outside box; named above that box, clear of the transporter's name.
      bg += `<line class="membrane" x1="${mb.x}" x2="${mb.x}" y1="${mb.top - 16}" y2="${mb.cy + 14}"/>` + zoneLabel(m, statusOf, mb.k, mb.x + 8, mb.top - 6, 'start');
      drawn.add(mb.k);
    });
    // Anything left (a compartment with nothing of its own to draw around) is listed in the top-right corner.
    Object.values(items).filter(it => it.kind === 'loc' && !drawn.has(it.id)).forEach((it, i) => { bg += zoneLabel(m, statusOf, it.id, W - 8, 18 + i * 30, 'end'); });
  }
  const mult = spine.map((r, i) => (r.multiplier > 1 ? i : -1)).filter(i => i >= 0);
  if (mult.length) {
    const y1 = pos[spine[mult[0]].from].y, y2 = pos[spine[mult[mult.length - 1]].to].y + BH;
    const label = `×${spine[mult[0]].multiplier}${p.multiplier_label ? ' ' + p.multiplier_label : ''}`;
    s += `<path class="mult" d="M30,${y1}H22V${y2}H30"/><text class="multt" transform="translate(16,${(y1 + y2) / 2}) rotate(-90)" text-anchor="middle">${esc(label)}</text>`;
  }
  spine.forEach(r => {
    const y1 = pos[r.from].y + BH, y2 = pos[r.to].y, xa = pos[r.from].x, xb = pos[r.to].x;
    if (xa === xb) {
      const X = xa;
      s += arrow(X, y1 + 4, X, y2 - 4, r.reversible, rxCls(r));
      s += enzLabel(X - 34, (y1 + y2) / 2, items['e:' + r.id], statusOf('e:' + r.id), 'end', 24, 'center', stepLoc[r.id] || []);
      DRAW_LABELS.push(labelRect(X - 34, (y1 + y2) / 2, 'end', items['e:' + r.id]?.name || '', 24));
      const cs = cofSt(m, statusOf, r), ym = (y1 + y2) / 2;
      if (hidden(cs) || cofVisible(cs)) s += cofArcParts(X, y1, y2, cofParts(m, statusOf, r));
    } else {
      // Crosses a membrane: down, across into the other lane, down (a right angle, not a slant).
      const ym = (y1 + y2) / 2, pts = [[xa, y1 + 4], [xa, ym], [xb, ym], [xb, y2 - 4]];
      s += elbow(pts, r.reversible, rxCls(r)) + elbowLabels(m, statusOf, r, [pts[1], pts[2]], null);
    }
    // Extra products/reactants leave from the box's lower-right corner, clear of the cofactor text beside the arrow.
    // Extra products leave the box's side and turn down into theirs (glycogen → limit dextrin).
    for (const sd of r.also_to || []) {
      const t = ctr(sd), a = ctr(r.from), dir = Math.sign(t.cx - a.cx) || 1;
      if (Math.abs(t.cy - a.cy) < 4) s += arrow(a.cx + dir * (BW / 2 + 4), a.cy, t.cx - dir * (BW / 2 + 4), t.cy, r.reversible);
      else s += elbow([[a.cx + dir * (BW / 2 + 4), a.cy], [t.cx, a.cy], [t.cx, t.cy - Math.sign(t.cy - a.cy) * (BH / 2 + 4)]], r.reversible);
    }
    const many = (r.also_from || []).length >= 3;
    if (many) {
      // A stacked column of inputs joins one line that runs up beside them and enters the target from the side.
      const t = ctr(r.to), xr = xb + BW / 2 + 6, srcs = r.also_from.map(ctr), xl = Math.min(...srcs.map(c => c.cx)) - BW / 2 - 6, bus = (xr + xl) / 2;
      const ys = srcs.map(c => c.cy), top = Math.min(t.cy, ...ys), bot = Math.max(t.cy, ...ys);
      srcs.forEach(c => { s += `<path class="ln" d="M${xl},${c.cy}H${bus}"/>`; });
      s += `<path class="ln" d="M${bus},${top}V${bot}"/>` + arrow(bus, t.cy, xr, t.cy, r.reversible);
    } else for (const sd of r.also_from || []) {
      // An extra input drops from its box and turns into the target's side (DMAPP joining IPP → GPP).
      const c = ctr(sd), t = ctr(r.to), dir = Math.sign(c.cx - t.cx) || 1, xe = t.cx + dir * (BW / 2 + 4);
      if (Math.abs(c.cy - t.cy) < 4) s += arrow(c.cx - dir * (BW / 2 + 4), c.cy, xe, t.cy, r.reversible);
      else s += elbow([[c.cx, c.cy + Math.sign(t.cy - c.cy) * (BH / 2 + 4)], [c.cx, t.cy], [xe, t.cy]], r.reversible);
    }
  });
  bypass.forEach((r, k) => {
    const a = ctr(r.from), b = ctr(r.to), x0 = Math.max(a.cx, b.cx) + BW / 2 + 6, xc = x0 + 120 + (k % 2) * 10;
    const curve = (dx, y0, y1) => `M${x0},${y0} C${xc + dx},${y0} ${xc + dx},${y1} ${x0 + 6},${y1}`;
    s += `<path class="${rxCls(r)}" d="${curve(0, a.cy - 6, b.cy + (b.cy > a.cy ? -6 : 6))}"/>` + head(x0, b.cy + (b.cy > a.cy ? -6 : 6), Math.PI);
    if (r.reversible) s += `<path class="${rxCls(r)}" d="${curve(10, a.cy + 6, b.cy)}"/>` + head(x0, a.cy + 6, Math.PI, 8);
    const my = (a.cy + b.cy) / 2, cs = cofSt(m, statusOf, r), ct = cofVisible(cs) ? cofText(m, r.cofactors) : '';
    s += enzLabel(xc + 12, my, items['e:' + r.id], statusOf('e:' + r.id), 'start', 20, 'center', ct ? [ct] : []);
    if (hidden(cs)) s += cofRow(xc + 12, my + 36, 'start', cofParts(m, statusOf, r));
  });
  branches.filter(b => !bypass.includes(b)).forEach(r => { if (pos[r.from] && pos[r.to]) s += drawEdge(m, statusOf, r, ctr(r.from), ctr(r.to)); });
  for (const [id, pt] of Object.entries(pos)) s += metBox(pt.x, pt.y, items['m:' + id], statusOf('m:' + id));
  const lk = linkTags(m, statusOf, Object.fromEntries(Object.entries(pos).map(([id, q]) => [id, { x: q.x - BW / 2, y: q.y, w: BW, h: BH }])), undefined, Object.values(clusters).flat());
  DRAW_BOXES = [];
  s += lk.s; W = Math.max(W, lk.maxX + 12);
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} flow diagram">${bg}${s}${fg}</svg>`;
}

// Cycles: metabolites on an ellipse (clockwise from the top; wider than tall, like the boxes) joined by curved arrows.
// Enzymes sit outside with their cofactors beneath; the main compartment is written in the middle, exceptions per step.
function cycleSVG(m, statusOf, { zones = true } = {}) {
  const { p, items, spine, spineMets, branches } = m;
  const n = spineMets.length, w = 176;
  const RY = Math.max(170, n * 30), RX = Math.round(RY * 1.5);
  const cx = RX + w / 2 + 300, cy = RY + 190;
  const pt = (t, d = 0) => [cx + (RX + d) * Math.cos(t), cy + (RY + d) * Math.sin(t)];
  const pos = {};
  spineMets.forEach((id, i) => { const t = -Math.PI / 2 + 2 * Math.PI * i / n; const [x, y] = pt(t); pos[id] = { cx: x, cy: y, t }; });
  branches.forEach(b => {
    const [sp, sd] = pos[b.from] ? [b.from, b.to] : [b.to, b.from];
    if (pos[sp] && !pos[sd]) { const t = pos[sp].t; const [x, y] = pt(t, 170); pos[sd] = { cx: x, cy: y, t }; }
  });
  DRAW_BOXES = Object.values(pos).map(q => ({ x: q.cx - w / 2, y: q.cy - BH / 2, w, h: BH })); DRAW_LABELS = [];
  const counts = {};
  spine.forEach(r => { const l = locLabel(m, r); if (l) counts[l] = (counts[l] || 0) + 1; });
  const main = Object.entries(counts).sort((a, b) => b[1] - a[1])[0]?.[0];
  let s = '';
  const keyOfR = r => zoneKey(m, r.loc, r.tissue);
  const keyCount = {};
  spine.forEach(r => { if (r.loc) keyCount[keyOfR(r)] = (keyCount[keyOfR(r)] || 0) + 1; });
  const mainKey = Object.entries(keyCount).sort((a, b) => b[1] - a[1])[0]?.[0];
  if (zones && mainKey) s += `<rect class="zone t-${zoneTone(mainKey)}" x="${-BLEED}" y="${-BLEED}" width="${2 * BLEED}" height="${2 * BLEED}"/>` + zoneLabel(m, statusOf, mainKey, cx, cy + 4, 'middle', main);
  // Steps in another compartment get a shaded wedge of the ring, dashed membranes at its edges, and its own label.
  const inRegion = new Set();
  if (zones && mainKey) {
    const runs = [];
    spine.forEach((r, i) => { const k = r.loc ? keyOfR(r) : mainKey; if (k === mainKey) return; const last = runs[runs.length - 1]; if (last && last.k === k && last.end === i - 1) { last.end = i; last.rs.push(r); } else runs.push({ k, start: i, end: i, rs: [r] }); });
    const wedgePt = (t, f, d = 0) => [cx + (RX * f + d) * Math.cos(t), cy + (RY * f + d) * Math.sin(t)];
    runs.forEach(run => {
      run.rs.forEach(r => inRegion.add(r));
      let t1 = pos[run.rs[0].from].t, t2 = pos[run.rs[run.rs.length - 1].to].t; if (t2 <= t1) t2 += 2 * Math.PI;
      const OUT = 150, f = 0.42, large = t2 - t1 > Math.PI ? 1 : 0;
      const [ax, ay] = wedgePt(t1, 1, OUT), [bx, by] = wedgePt(t2, 1, OUT), [cx2, cy2] = wedgePt(t2, f), [dx, dy] = wedgePt(t1, f);
      s += `<path class="zone t-${zoneTone(run.k)}" d="M${ax},${ay} A${RX + OUT},${RY + OUT} 0 ${large} 1 ${bx},${by} L${cx2},${cy2} A${RX * f},${RY * f} 0 ${large} 0 ${dx},${dy} Z"/>`;
      s += `<line class="membrane" x1="${dx}" y1="${dy}" x2="${ax}" y2="${ay}"/><line class="membrane" x1="${cx2}" y1="${cy2}" x2="${bx}" y2="${by}"/>`;
      const tm = (t1 + t2) / 2, co = Math.cos(tm), [lx, ly] = wedgePt(tm, 1, OUT + 18);
      s += zoneLabel(m, statusOf, run.k, lx, ly + 4, co > 0.3 ? 'start' : co < -0.3 ? 'end' : 'middle');
    });
  }
  // Parameter-space half-width of a box along the ellipse, so arcs start and stop at the box edge.
  const speed = t => Math.hypot(RX * Math.sin(t), RY * Math.cos(t));
  const ext = t => { const L = speed(t), ux = -RX * Math.sin(t) / L, uy = RY * Math.cos(t) / L; return (Math.abs(w / 2 * ux) + Math.abs(BH / 2 * uy) + 10) / L; };
  const tangent = t => Math.atan2(RY * Math.cos(t), -RX * Math.sin(t));
  const arc = (d, t1, t2, cls) => { const [x1, y1] = pt(t1, d), [x2, y2] = pt(t2, d); return `<path class="${cls}" d="M${x1},${y1} A${RX + d},${RY + d} 0 ${t2 - t1 > Math.PI ? 1 : 0} 1 ${x2},${y2}"/>`; };
  spine.forEach(r => {
    const a = pos[r.from], b = pos[r.to];
    let t1 = a.t, t2 = b.t; if (t2 <= t1) t2 += 2 * Math.PI;
    const s1 = t1 + ext(t1), s2 = t2 - ext(t2), h2 = 7 / speed(s2), h1 = 7 / speed(s1);
    if (!r.reversible) {
      s += arc(0, s1, s2 - h2, rxCls(r)) + head(...pt(s2), tangent(s2));
    } else {
      s += arc(-4, s1, s2 - h2, rxCls(r)) + head(...pt(s2, -4), tangent(s2), 8);
      s += arc(4, s1 + h1, s2, rxCls(r)) + head(...pt(s1, 4), tangent(s1) + Math.PI, 8);
    }
    const tm = (s1 + s2) / 2, co = Math.cos(tm);
    const anchor = co > 0.3 ? 'start' : co < -0.3 ? 'end' : 'middle';
    const [lx, ly0] = pt(tm, 28 + (anchor === 'middle' ? 16 : 0));
    const here = locLabel(m, r), zst = m.items['z:' + keyOfR(r)] ? statusOf('z:' + keyOfR(r)) : 'shown';
    const loc = zones && here && here !== main && zst !== 'hide' && !inRegion.has(r) ? [hidden(zst) ? '(compartment?)' : here] : [];
    const es = statusOf('e:' + r.id), it = items['e:' + r.id];
    s += enzLabel(lx, ly0, it, es, anchor, 20, 'center', loc);
    const cs = cofSt(m, statusOf, r);
    if (cs !== 'none' && cs !== 'hide') {
      const lines = es === 'hide' ? 0 : hidden(es) ? 1.8 : wrap(it.name, 20).length + (r.tags || []).filter(t => t !== 'irreversible').length + loc.length;
      const ly = ly0 + Math.max(lines * 7.5, 0) + 14;
      if (hidden(cs)) s += cofRow(lx, ly + 6, anchor, cofParts(m, statusOf, r));
      else {
        const ct = cofText(m, r.cofactors);
        s += `<text class="coft" x="${lx}" y="${ly + 4}" text-anchor="${anchor}">${esc(ct)}</text>`;
        s += cofMark(anchor === 'end' ? lx + 12 : anchor === 'start' ? lx - 12 : lx - ct.length * 3.3 - 12, ly, cs);
      }
    }
  });
  branches.forEach(r => { if (pos[r.from] && pos[r.to]) s += drawEdge(m, statusOf, r, pos[r.from], pos[r.to], w, w); });
  for (const [id, q] of Object.entries(pos)) s += metBox(q.cx, q.cy - BH / 2, items['m:' + id], statusOf('m:' + id), w);
  const xs = Object.values(pos).map(q => q.cx), ys = Object.values(pos).map(q => q.cy);
  const lk = linkTags(m, statusOf, Object.fromEntries(Object.entries(pos).map(([id, q]) => [id, { x: q.cx - w / 2, y: q.cy - BH / 2, w, h: BH }])), id => (Math.abs(Math.sin(pos[id].t)) > 0.9 ? (Math.sin(pos[id].t) < 0 ? 'up' : 'down') : pos[id].cx < cx ? 'left' : 'right'));
  s += lk.s; DRAW_BOXES = [];
  const W = Math.max(cx * 2, Math.max(...xs) + w / 2 + 20, lk.maxX + 12), H = Math.max(...ys) + BH / 2 + 180;
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} cycle diagram">${s}</svg>`;
}

// Grids (steroidogenesis): every metabolite sets pos: [column, row]; optional grid_columns headers.
function gridSVG(m, statusOf, opts = {}) {
  const { p, items } = m, COLW = BW + 320, ROWH = BH + 96, X0 = 24 + BW / 2 + 130, Y0 = TOP + (p.grid_columns ? 34 : 0);
  const pos = {};
  for (const [id, x] of Object.entries(p.metabolites)) { const [c, r] = x.pos || [0, 0]; pos[id] = { cx: X0 + c * COLW, cy: Y0 + r * ROWH + BH / 2 }; }
  DRAW_BOXES = Object.values(pos).map(q => ({ x: q.cx - BW / 2, y: q.cy - BH / 2, w: BW, h: BH })); DRAW_LABELS = [];
  let s = '';
  (p.grid_columns || []).forEach((label, c) => { s += `<text class="zonet" x="${X0 + c * COLW}" y="${TOP + 8}" text-anchor="middle">${esc(label)}</text>`; });
  p.reactions.forEach(r => { s += drawEdge(m, statusOf, r, pos[r.from], pos[r.to]); });
  for (const [id, q] of Object.entries(pos)) s += metBox(q.cx, q.cy - BH / 2, items['m:' + id], statusOf('m:' + id));
  const lk = linkTags(m, statusOf, Object.fromEntries(Object.entries(pos).map(([id, q]) => [id, { x: q.cx - BW / 2, y: q.cy - BH / 2, w: BW, h: BH }])));
  s += lk.s; DRAW_BOXES = [];
  let H = Math.max(...Object.values(pos).map(q => q.cy)) + BH / 2 + 24;
  const W = Math.max(Math.max(...Object.values(pos).map(q => q.cx)) + BW / 2 + 24, lk.maxX + 12);
  if (opts.zones !== false) {
    // Grids don't split into lanes, so the compartments are listed underneath (and quizzable there).
    const zs = Object.values(items).filter(it => it.kind === 'loc');
    // In columns wide enough for the longest name, one per line, so long tissue names never run into each other.
    if (zs.length) {
      const colW = Math.max(...zs.map(z => z.name.length)) * 8.6 + 48, ncol = Math.max(1, Math.floor((W - 150) / colW)), rows = Math.ceil(zs.length / ncol);
      s += `<text class="zonet" x="24" y="${H + 6}">Compartments:</text>`;
      zs.forEach((z, i) => { s += zoneLabel(m, statusOf, z.id, 150 + Math.floor(i / rows) * colW, H + 6 + (i % rows) * 28, 'start'); });
      H += rows * 28 + 4;
    }
  }
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} diagram">${s}</svg>`;
}

/* ---------- list view ---------- */
function chip(item, st) {
  const cls = st === 'peek' ? 'shown' : st;
  const ic = st === 'right' ? icon('ok') : st === 'missed' ? icon('no') : '';
  const badge = st === 'start' ? '<span class="badge">START</span>' : '';
  if (st === 'target' && INLINE) return `<form class="chip target inl" data-q="0">${inlineInput()}</form>`;
  return `<div class="chip ${cls}">${badge}${hidden(st) ? `<span class="bk">${blankWord(item)}</span>` : esc(item.name)}${ic}</div>`;
}
function conn(m, item, st, horiz, statusOf) {
  const r = item.rxn;
  const arr = horiz ? (r.reversible ? '⇌' : '→') : (r.reversible ? '⇅' : '↓');
  const cls = st === 'peek' ? 'shown' : st;
  const ic = st === 'right' ? icon('ok') : st === 'missed' ? icon('no') : '';
  const badge = st === 'start' ? '<span class="badge">START</span> ' : '';
  const name = st === 'target' && INLINE ? `<form class="inl" data-q="0">${inlineInput()}</form>` : hidden(st) ? `<span class="bk">${blankWord(item)}</span>` : esc(item.name);
  const tags = hidden(st) ? [] : (r.tags || []).filter(t => t !== 'irreversible');
  const cs = cofSt(m, statusOf, r), parts = cofParts(m, statusOf, r).filter(p => p.st !== 'hide');
  const mk = st => (st === 'right' ? icon('ok') : st === 'missed' ? icon('no') : '');
  const ct = cofVisible(cs) ? esc(cofText(m, r.cofactors)) + mk(cs)
    : hidden(cs) ? parts.map(p => isLive(p) ? `<form class="inl" data-q="0">${inlineInput()}</form>` : hidden(p.st) ? `<span class="ename ${p.st}"><span class="bk">${cofWord(p, parts.length > 1)}</span></span>` : esc(p.text) + mk(p.st)).join(' → ') : '';
  const extra = [ct, (r.also_to || []).length ? 'splits in two' : '', (r.also_from || []).length ? 'joins two' : '', r.branch ? 'side step' : '', r.transport ? 'transport' : '', ...tags].filter(Boolean).join(' · ');
  return `<div class="conn"><span class="arr" aria-label="${r.reversible ? 'reversible' : 'one-way'}">${arr}</span><div class="meta"><span class="ename ${cls}">${badge}${name} ${ic}</span>${extra ? `<span class="cofs">${extra}</span>` : ''}</div></div>`;
}
function listHTML(m, statusOf, { horiz = false, zones = true } = {}) {
  let lastLoc = null;
  const parts = m.seq.map(k => {
    const it = m.items[k], st = statusOf(k);
    if (it.kind === 'cof') return '';
    let row = '';
    if (it.kind === 'loc') {
      const st = statusOf(k);
      if (!zones || st === 'hide') return '';
      if (st === 'target' && INLINE) return `<form class="locrow inl" data-q="0">${inlineInput()}</form>`;
      const ic = st === 'right' ? icon('ok') : st === 'missed' ? icon('no') : '';
      return `<div class="locrow${hidden(st) ? ' blank' : ''}" data-key="${k}">${hidden(st) ? '<span class="bk">compartment</span>' : esc(it.name)} ${ic}</div>`;
    }
    return row + listPart(m, it, st, horiz, statusOf);
  });
  if (m.p.circular) parts.push(`<div class="conn"><span class="arr">↺</span><div class="meta"><span class="cofs">back to the start</span></div></div>`);
  return `<div class="list ${horiz ? 'h' : 'v'}">${parts.join('')}</div>`;
}
function listPart(m, it, st, horiz, statusOf) {
  {
    if (it.kind !== 'met' && st === 'hide') return conn(m, { ...it, name: '' }, 'shown', horiz, statusOf);
    return it.kind === 'met' ? chip(it, st) : conn(m, it, st, horiz, statusOf);
  }
}
</script>
<script>
/* The diagram canvas: flow diagrams sit on a surface you drag to pan and pinch (or Ctrl/⌘-scroll) to zoom.
   The SVG and the quiz's answer field live together in one "world" layer moved by a single CSS transform,
   so the field can never drift off its box (Safari misplaced it when the two were positioned separately).
   Zoom settings stay the same: 'width' (fit the width), 'fit' (whole diagram) or a number (the scale).
   List view isn't a canvas; it scrolls as before. */
'use strict';

const CANVAS = { min: 0.2, max: 3, pad: 16 };
let CANVAS_VIEW = null; // the last view, kept across re-renders of the same diagram: { key, mode, k, x, y }

const canvasStage = (scope = document) => scope.querySelector('.stage.canvas');
const worldOf = st => st && st.querySelector('.world');
const svgOf = st => st && st.querySelector('.world > svg.flow');

// Wraps a flow SVG (and anything that must move with it, like the answer field) for a canvas stage.
const canvasHTML = (svg, extra = '') => `<div class="world">${svg}${extra}</div>`;

function contentSize(st) { const vb = svgOf(st).viewBox.baseVal; return { w: vb.width, h: vb.height }; }
function fitK(st, mode) {
  const { w, h } = contentSize(st), W = st.clientWidth - 2 * CANVAS.pad, H = st.clientHeight - 2 * CANVAS.pad;
  if (mode === 'fit') return Math.max(CANVAS.min, Math.min(W / w, H / h, 1.6));
  if (mode === 'height') return Math.max(CANVAS.min, Math.min(H / h, 1.6));
  return Math.max(CANVAS.min, Math.min(1, W / w));
}
// Keep some of the diagram on screen however far it is dragged.
function clampView(st, v) {
  const { w, h } = contentSize(st), keep = 80, W = st.clientWidth, H = st.clientHeight;
  v.k = Math.min(CANVAS.max, Math.max(CANVAS.min, v.k));
  v.x = Math.min(W - keep, Math.max(keep - w * v.k, v.x));
  v.y = Math.min(H - keep, Math.max(keep - h * v.k, v.y));
  return v;
}
function setView(st, v, animate = false) {
  const world = worldOf(st);
  if (!world) return;
  v = clampView(st, { ...v });
  st._v = v;
  world.classList.toggle('glide', !!animate && !matchMedia('(prefers-reduced-motion: reduce)').matches);
  world.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.k})`;
  CANVAS_VIEW = { key: st.dataset.view || '', mode: Store.settings.zoom, k: v.k, x: v.x, y: v.y };
  const zp = document.querySelector('#zoomPct'); if (zp) zp.textContent = Math.round(v.k * 100) + '%';
}
// Zoom about a point of the stage (cursor, pinch center, or the middle for the buttons).
function zoomAt(st, k, px, py, animate = false) {
  const v = st._v;
  const nk = Math.min(CANVAS.max, Math.max(CANVAS.min, k));
  setView(st, { k: nk, x: px - (px - v.x) * nk / v.k, y: py - (py - v.y) * nk / v.k }, animate);
}

function applyZoom(scope = document) {
  const st = canvasStage(scope), list = scope.querySelector('.stage .list'), z = Store.settings.zoom;
  scope.querySelectorAll('[data-zoom]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.zoom === String(z))));
  scope.querySelectorAll('[data-flag="follow"]').forEach(b => b.setAttribute('aria-pressed', String(!!Store.settings.follow)));
  scope.querySelectorAll('.peekbtn').forEach(b => { b.hidden = !Store.settings.follow; });
  if (!st || !svgOf(st)) {
    if (list) { const k = typeof z === 'number' ? z : 1; list.style.zoom = k; const zp = scope.querySelector('#zoomPct'); if (zp) zp.textContent = Math.round(k * 100) + '%'; }
    return;
  }
  wireCanvas(st);
  // Natural size: one diagram unit = one pixel; zoom is the world layer's scale.
  const svg = svgOf(st), vb0 = svg.viewBox.baseVal; svg.style.width = vb0.width + 'px'; svg.style.height = vb0.height + 'px';
  placeInline();
  // Same diagram, same zoom mode as a moment ago (e.g. the next question): keep the view where it was.
  if (CANVAS_VIEW && CANVAS_VIEW.key && CANVAS_VIEW.key === st.dataset.view && CANVAS_VIEW.mode === z) return setView(st, CANVAS_VIEW);
  const { w, h } = contentSize(st);
  const k = typeof z === 'number' ? z : fitK(st, z);
  const x = Math.max(CANVAS.pad, (st.clientWidth - w * k) / 2);
  const y = z === 'fit' || z === 'height' ? Math.max(CANVAS.pad, (st.clientHeight - h * k) / 2) : CANVAS.pad;
  setView(st, { k, x, y });
}
function zoomBy(d) {
  const st = canvasStage();
  if (!st || !st._v) {
    const z = Store.settings.zoom; Store.settings.zoom = Math.round(Math.min(2.5, Math.max(0.3, (typeof z === 'number' ? z : 1) + d)) * 10) / 10;
    Store.save(); return applyZoom();
  }
  const k = Math.round(Math.min(CANVAS.max, Math.max(CANVAS.min, st._v.k + d)) * 10) / 10;
  Store.settings.zoom = k; Store.save();
  zoomAt(st, k, st.clientWidth / 2, st.clientHeight / 2, true);
  applyZoomButtons();
}
// Clicking the percentage: back to 100%, about the middle of the view.
function zoomTo(k) {
  const st = canvasStage();
  Store.settings.zoom = k; Store.save();
  if (!st || !st._v) return applyZoom();
  zoomAt(st, k, st.clientWidth / 2, st.clientHeight / 2, true);
  applyZoomButtons();
}
const applyZoomButtons = () => document.querySelectorAll('[data-zoom]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.zoom === String(Store.settings.zoom))));
// Bring an element into the middle of the view (Follow, and stepping through facts).
function centerOn(el, animate = true) {
  const st = canvasStage();
  if (!st || !el || !st._v) return el?.scrollIntoView?.({ block: 'nearest', inline: 'nearest' });
  const s = st.getBoundingClientRect(), r = el.getBoundingClientRect();
  setView(st, { ...st._v, x: st._v.x + (s.left + s.width / 2) - (r.left + r.width / 2), y: st._v.y + (s.top + s.height / 2) - (r.top + r.height / 2) }, animate);
}
function followTarget() {
  if (!Store.settings.follow) return;
  const st = canvasStage(), t = st ? st.querySelector('.inl-float, .target, .chip.target, .ename.target') : document.querySelector('.stage .chip.target, .stage form.inl');
  if (!t) return;
  if (st) return centerOn(t);
  t.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
}
// The answer field sits in the world layer in diagram units, so it moves and scales with the diagram by itself.
function placeInline() {
  const st = canvasStage(), slot = st?.querySelector('.inl-slot'), f = st?.querySelector('.inl-float');
  if (!slot || !f) return;
  Object.assign(f.style, { left: slot.x.baseVal.value + 'px', top: slot.y.baseVal.value + 'px', width: slot.width.baseVal.value + 'px', height: slot.height.baseVal.value + 'px', transform: '' });
}

/* ---------- peek: hold to see the whole pathway ----------
   While Follow is on, pressing and holding the button above it shows the whole diagram; letting go goes back to the
   exact view you had. The zoom setting itself never changes. */
let PEEK = null;
function peekStart() {
  const st = canvasStage();
  if (!st || !st._v || PEEK) return;
  PEEK = { st, v: { ...st._v } };
  const { w, h } = contentSize(st), k = fitK(st, 'fit');
  setView(st, { k, x: Math.max(CANVAS.pad, (st.clientWidth - w * k) / 2), y: Math.max(CANVAS.pad, (st.clientHeight - h * k) / 2) }, true);
  document.querySelectorAll('.peekbtn').forEach(b => b.setAttribute('aria-pressed', 'true'));
}
function peekEnd() {
  if (!PEEK) return;
  const { st, v } = PEEK; PEEK = null;
  if (st.isConnected) setView(st, v, true);
  document.querySelectorAll('.peekbtn').forEach(b => b.setAttribute('aria-pressed', 'false'));
}
document.addEventListener('pointerdown', e => { if (e.button === 0 && e.target.closest?.('[data-peek]')) { e.preventDefault(); peekStart(); } });
for (const ev of ['pointerup', 'pointercancel', 'blur']) window.addEventListener(ev, peekEnd);
document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.closest?.('[data-peek]')) { e.preventDefault(); if (!e.repeat) peekStart(); } });
document.addEventListener('keyup', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.closest?.('[data-peek]')) peekEnd(); });
document.addEventListener('contextmenu', e => { if (e.target.closest?.('[data-peek]')) e.preventDefault(); }); // a long press on a phone isn't a menu

/* ---------- dragging, scrolling, pinching ---------- */
function wireCanvas(st) {
  if (st._wired) return;
  st._wired = true;
  const pts = new Map(); let start = null, moved = false, pinch = null;
  const rel = e => { const r = st.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const interactive = t => t.closest('input, textarea, select, button, a, form, label');
  st.addEventListener('pointerdown', e => {
    if (e.button !== 0 || interactive(e.target)) return;
    pts.set(e.pointerId, rel(e));
    if (pts.size === 1) { start = { p: rel(e), v: { ...st._v } }; moved = false; }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k: st._v.k }; }
  });
  st.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, rel(e));
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt(st, pinch.k * d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); moved = true; return;
    }
    if (!start) return;
    const [x, y] = rel(e), dx = x - start.p[0], dy = y - start.p[1];
    if (!moved && Math.hypot(dx, dy) < 4) return; // still a click
    if (!moved) { moved = true; st.setPointerCapture?.(e.pointerId); st.classList.add('dragging'); }
    setView(st, { ...start.v, x: start.v.x + dx, y: start.v.y + dy });
  });
  const end = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (!pts.size) {
      st.classList.remove('dragging');
      if (moved) { st._dragged = Date.now(); keepManualZoom(st); }
      start = null;
    }
  };
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  // A drag ends with a click on whatever was under the pointer: swallow it so dragging never opens facts.
  st.addEventListener('click', e => { if (st._dragged && Date.now() - st._dragged < 300) { e.stopPropagation(); e.preventDefault(); } }, true);
  st.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) { const [x, y] = rel(e); zoomAt(st, st._v.k * Math.exp(-e.deltaY * 0.01), x, y); keepManualZoom(st); }
    else setView(st, { ...st._v, x: st._v.x - e.deltaX, y: st._v.y - e.deltaY });
  }, { passive: false });
}
// After pinching or Ctrl-scrolling, the chosen scale becomes the zoom setting (saved a moment later).
function keepManualZoom(st) {
  if (Store.settings.zoom === Math.round(st._v.k * 100) / 100) return;
  Store.settings.zoom = Math.round(st._v.k * 100) / 100;
  CANVAS_VIEW && (CANVAS_VIEW.mode = Store.settings.zoom);
  applyZoomButtons();
  clearTimeout(st._zt); st._zt = setTimeout(() => Store.save(), 500);
}
window.addEventListener('resize', () => {
  const st = canvasStage();
  if (!st) return;
  if (typeof Store.settings.zoom !== 'number') { CANVAS_VIEW = null; applyZoom(); } else if (st._v) setView(st, st._v);
});
</script>
<script>
/* Per-item answer history, keyed per pathway:
   m:<met>  e:<reaction> (enzyme)  c:<reaction> (cofactors)  d:<reaction> (direction)
   r:/p:<reaction> (reactants / products, enzyme-given)  w:<reaction> (which pathway)
   b:<reaction> (a membrane just before that step, Compartments mode)  z:<zone> (a compartment) */
'use strict';

const Stats = {
  of(pid) { return (Store.data.stats[pid] = Store.data.stats[pid] || {}); },
  record(pid, key, ok) {
    const s = this.of(pid), e = (s[key] = s[key] || { n: 0, miss: 0 });
    e.n++; if (!ok) e.miss++; e.last = Date.now();
    Store.save();
  },
  // Smoothed miss rate: unseen items sit at 0.5 so new material still comes up.
  rate(pid, key) { const e = Store.data.stats[pid]?.[key]; return e ? (e.miss + 0.5) / (e.n + 1) : 0.5; },
  reset(pid) { if (pid) delete Store.data.stats[pid]; else Store.data.stats = {}; Store.save(); },
  // First-try accuracy over everything answered in a pathway, or null if nothing yet.
  accuracy(pid) {
    const s = Store.data.stats[pid];
    if (!s) return null;
    let n = 0, miss = 0;
    for (const e of Object.values(s)) { n += e.n; miss += e.miss; }
    return n ? { n, pct: Math.round(100 * (n - miss) / n) } : null;
  },
  rows(p) {
    const s = Store.data.stats[p.id] || {}, out = [];
    const mn = id => p.metabolites[id]?.short || p.metabolites[id]?.name || id;
    for (const [key, e] of Object.entries(s)) {
      const [t, id] = key.split(':');
      let label, kind;
      if (t === 'm') { if (!p.metabolites[id]) continue; label = p.metabolites[id].name; kind = 'Metabolite'; }
      else if (t === 'z') { label = id.split('|').reverse().join(' · '); kind = 'Compartment'; }
      else {
        const r = p.reactions.find(x => x.id === id); if (!r) continue;
        const en = p.enzymes[r.enzyme]?.name || r.enzyme, pair = `${mn(r.from)} → ${mn(r.to)}`;
        ({ e: () => { label = en; kind = 'Enzyme'; },
          c: () => { const c = r.cofactors || {}; label = `${en}: ${(c.in || []).length && (c.out || []).length ? 'cofactors in' : 'cofactors'}`; kind = 'Cofactors'; },
          o: () => { label = `${en}: cofactors out`; kind = 'Cofactors'; },
          d: () => { label = `${pair}: direction`; kind = 'Direction'; },
          r: () => { label = `${en}: reactants`; kind = 'Reactants'; },
          p: () => { label = `${en}: products`; kind = 'Products'; },
          w: () => { label = `${en}: pathway`; kind = 'Pathway'; },
          l: () => { label = `${en}: location`; kind = 'Location'; },
          b: () => { label = `Membrane before ${en}`; kind = 'Membrane'; } })[t]?.();
        if (!label) continue;
      }
      out.push({ pid: p.id, pname: p.name, key, label, kind, n: e.n, miss: e.miss, rate: e.miss / e.n, last: e.last || 0 });
    }
    return out.sort((a, b) => b.rate - a.rate || b.miss - a.miss || a.label.localeCompare(b.label));
  },
  worst(limit = 8) {
    return Object.values(Library.all()).flatMap(p => this.rows(p)).filter(r => r.miss > 0)
      .sort((a, b) => b.rate - a.rate || b.miss - a.miss || b.last - a.last).slice(0, limit);
  },
};

function statsTableHTML(rows, { showPathway = false } = {}) {
  if (!rows.length) return '<p class="muted">Nothing missed yet. Answers you miss or reveal show up here.</p>';
  return `<div class="tablewrap"><table class="stats"><thead><tr><th>Item</th>${showPathway ? '<th>Pathway</th>' : ''}<th>Type</th><th class="num">Missed</th><th>Miss rate</th></tr></thead><tbody>${rows.map(r => `
    <tr><td>${esc(r.label)}</td>${showPathway ? `<td class="muted">${esc(r.pname)}</td>` : ''}<td class="muted">${r.kind}</td><td class="num">${r.miss} / ${r.n}</td>
    <td><span class="bar" role="img" aria-label="${Math.round(r.rate * 100)} percent missed"><span style="width:${Math.round(r.rate * 100)}%"></span></span><span class="pct">${Math.round(r.rate * 100)}%</span></td></tr>`).join('')}</tbody></table></div>`;
}
</script>
<script>
/* Pathway editor: build or change a pathway with a live diagram preview.
   Built-in pathways are never overwritten — saving one stores an edited copy under the same id ("Reset" removes it).
   Export / Import move a pathway between people as a .json file.
   Three views of the same draft: Visual (canvas-editor.js), Form and JSON. Every change can be undone,
   and on an edited built-in each field that differs from the original is marked with its own Revert. */
'use strict';

// Icons offered for pathways (all in icons.js).
const PATHWAY_ICONS = ['route', 'call_split', 'no_meals', 'cycle', 'wc', 'shield', 'bloodtype', 'monitor_heart', 'breastfeeding', 'nutrition', 'visibility', 'psychology',
  'inventory_2', 'fitness_center', 'opacity', 'local_fire_department', 'egg', 'stress_management', 'genetics', 'sync_alt', 'lightbulb', 'flag', 'bookmark_add'];
const LOCS = ['cytosol', 'mitochondria', 'mitochondrial matrix', 'ER', 'peroxisome', 'lysosome', 'nucleus'];
const E = { draft: null, origId: null, mode: 'visual', err: '', sel: null, undo: [], redo: [], view: null, snap: true };

function blankPathway() {
  return { id: '', name: 'New pathway', group: 'Mine', summary: '', circular: false, multiplier_label: '',
    metabolites: {}, enzymes: {}, reactions: [], cofactors: {}, distractors: { metabolites: [], enzymes: [] } };
}
// focusKey (deep links #/pathways/<id>/edit/<key>): a quiz item key — m:<metabolite>, e:<reaction>, c:<reaction> —
// opens the visual editor with that item selected.
function openEditor(id, draft, focusKey) {
  if (id && !Library.get(id)) { location.replace('#/pathways'); return; }
  const raw = id && Library.raw(id);
  if (focusKey && raw?.compose) {
    // Combined pathways only name their parts: edit the part the item came from (ids from later parts are "<part>.<id>").
    const [, ref = ''] = focusKey.split(':'), part = raw.compose.find(x => ref.startsWith(x + '.')) || raw.compose[0];
    const key = focusKey.replace(':' + part + '.', ':');
    location.replace(`#/pathways/${encodeURIComponent(part)}/edit/${encodeURIComponent(key)}`);
    return;
  }
  E.draft = draft || (id ? clone(Library.get(id)) : blankPathway());
  E.draft.cofactors = E.draft.cofactors || {};
  E.draft.distractors = Object.assign({ metabolites: [], enzymes: [] }, E.draft.distractors);
  E.origId = draft ? null : id;
  E.mode = (typeof local !== 'undefined' && local.get('pathways.edMode')) || 'visual';
  E.pending = null;
  E.undo = []; E.redo = []; E.view = null; E.viewSet = false; E.sel = null; E.pre = null;
  if (focusKey) {
    const [k, ref] = [focusKey[0], focusKey.slice(2)];
    if (k === 'm' && E.draft.metabolites[ref]) E.sel = { kind: 'met', id: ref, focus: true };
    if ((k === 'e' || k === 'c') && E.draft.reactions.some(r => r.id === ref)) E.sel = { kind: 'rxn', id: ref, focus: k === 'c' ? 'cof' : 'enz' };
    if (E.sel) E.mode = 'visual';
  }
  $('#view').innerHTML = '<section id="editor" class="editor page"></section>';
  renderEditor();
}
// Leave the editor for a page: the pathway itself, or the library when there is none.
function closeEditor(id = E.origId) {
  E.draft = null;
  location.hash = id && Library.get(id) ? `#/pathways/${encodeURIComponent(id)}` : '#/pathways';
}
function exportPathway(p) {
  // Downloads are blocked inside shared artifacts, so Export shows the JSON to copy, with a file download as the extra.
  const name = (p.id || slug(p.name)) + '.json', text = JSON.stringify(p, null, 2), canSave = !window.PATHWAYS_ARTIFACT;
  ask({ title: `Export ${p.name}`, text: `Copy this and send it${canSave ? ` (or save it as ${name})` : ''}. To add it, open Library → Import, or New pathway → JSON and paste.`, input: 'area', value: text, ok: canSave ? 'Download file' : 'Done', cancel: canSave ? 'Close' : null, copy: true })
    .then(v => v && canSave && download(name, text));
}

/* ---------- helpers ---------- */
const edCof = () => Object.assign({}, Library.sharedCof(), E.draft.cofactors);
const metOpts = (sel, blank = '— choose —') => `<option value="">${blank}</option>` + Object.entries(E.draft.metabolites).map(([id, m]) =>
  `<option value="${esc(id)}"${id === sel ? ' selected' : ''}>${esc(m.name || id)}</option>`).join('') + '<option value="__new">+ New metabolite…</option>';
const enzOpts = sel => '<option value="">— choose —</option>' + Object.entries(E.draft.enzymes).map(([id, e]) =>
  `<option value="${esc(id)}"${id === sel ? ' selected' : ''}>${esc(e.name || id)}</option>`).join('') + '<option value="__new">+ New enzyme…</option>';
const listStr = a => (a || []).join(', ');
const LAYOUTS = [['line', 'Line'], ['cycle', 'Cycle (last step returns to the start)'], ['grid', 'Grid (place each metabolite)']];
const layoutOf = p => (p.layout === 'grid' ? 'grid' : p.circular ? 'cycle' : 'line');
const parseList = v => v.split(',').map(x => x.trim()).filter(Boolean);
function cofStr(ids) { const c = edCof(); return (ids || []).map(id => c[id]?.name || id).join(', '); }
function parseCof(v) {
  const { map } = cofLookup(edCof()), out = [];
  for (const t of parseList(v)) {
    let id = map[norm(t)];
    if (!id) { id = uniqueId(slug(t), new Set(Object.keys(edCof()))); E.draft.cofactors[id] = { name: t, aliases: [] }; }
    out.push(id);
  }
  return out;
}
function pruneCof(p) {
  const used = new Set(p.reactions.flatMap(r => [...(r.cofactors?.in || []), ...(r.cofactors?.out || [])]));
  for (const id of Object.keys(p.cofactors || {})) if (!used.has(id)) delete p.cofactors[id];
}
function newItem(kind, name) {
  const coll = kind === 'met' ? E.draft.metabolites : E.draft.enzymes;
  const id = uniqueId(slug(name).slice(0, 24), new Set(Object.keys(coll)));
  coll[id] = { name, short: '', aliases: [], notes: '' };
  return id;
}
// A step the diagram can draw: its enzyme and every metabolite it names exist.
const edOk = r => { const d = E.draft; return d.enzymes[r.enzyme] && d.metabolites[r.from] && d.metabolites[r.to] && [...(r.also_to || []), ...(r.also_from || [])].every(x => d.metabolites[x]); };
function newReactionId() { return uniqueId('r' + (E.draft.reactions.length + 1), new Set(E.draft.reactions.map(r => r.id))); }

/* ---------- render ---------- */
function itemRows(kind) {
  const coll = kind === 'met' ? E.draft.metabolites : E.draft.enzymes, base = kind === 'met' ? 'metabolites' : 'enzymes';
  const rows = Object.entries(coll).map(([id, it]) => `
    <div class="ed-item">
      <label>Name<input data-path="${base}.${esc(id)}.name" value="${esc(it.name)}"></label>
      <label>Abbreviation<input data-path="${base}.${esc(id)}.short" value="${esc(it.short)}"></label>
      <label class="wide" title="Spelled-out names. Always accepted.">Also called (full names, comma-separated)<input data-path="${base}.${esc(id)}.aliases" data-list value="${esc(listStr(it.aliases))}" placeholder="e.g. δ-aminolevulinate synthase"></label>
      <label class="wide" title="Abbreviations and short forms. Not accepted when Require full names is on.">Sometimes written as (nicknames, comma-separated)<input data-path="${base}.${esc(id)}.nicknames" data-list value="${esc(listStr(it.nicknames))}" placeholder="e.g. ALAS, ALA synthase"></label>
      ${kind === 'met' && E.draft.layout === 'grid' ? `<label>Column<input type="number" min="0" step="any" data-gridpos="${esc(id)}" data-axis="0" value="${esc(it.pos?.[0] ?? 0)}"></label><label>Row<input type="number" min="0" step="any" data-gridpos="${esc(id)}" data-axis="1" value="${esc(it.pos?.[1] ?? 0)}"></label>` : ''}
      <label class="full">Facts shown after answering<textarea rows="2" data-path="${base}.${esc(id)}.notes">${esc(it.notes)}</textarea></label>

  for (const [kind, id] of gone) rows.push(`<li><span><span class="ed-mark removed">${mi('delete', 'sm')}Removed</span> ${{ met: 'Metabolite', enz: 'Enzyme', rxn: 'Step' }[kind]} · ${esc(itemName(kind, id, b))}</span><button type="button" class="btn ghost small ed-revert" data-revert-item="${kind}" data-id="${esc(id)}">${mi('undo', 'sm')}Restore</button></li>`);
  return rows.length ? `<ul class="ed-changes">${rows.join('')}</ul>` : '<p class="muted">Same as the built-in.</p>';
}
// Marks every field on the page that differs from the built-in: "Edited" plus a Revert that restores just that field.
function decorateEdits(root) {
  $$('.ed-chg', root).forEach(x => x.remove());
  $$('.edited', root).forEach(x => x.classList.remove('edited'));
  if (!root || !edBase()) return;
  const done = new Set();
  for (const el of $$('[data-path], [data-cof], [data-gridpos], [data-layout], [data-rev]', root)) {
    const path = el.dataset.rev || (el.dataset.cof ? `reactions.${el.dataset.i}.cofactors.${el.dataset.cof}` : el.dataset.gridpos ? `metabolites.${el.dataset.gridpos}.pos` : el.hasAttribute('data-layout') ? '__layout' : el.dataset.path);
    if (!path || done.has(path) || el.closest('.ed-changes') || !fieldChanged(path)) continue;
    done.add(path);
    const host = el.dataset.rev ? el : el.closest('[data-revwrap]') || el.closest('label') || el.parentElement;
    host.classList.add('edited');
    const mark = document.createElement('span');
    mark.className = 'ed-chg';
    mark.innerHTML = `${changeBadge('edited')}<button type="button" class="ed-revert" data-revert="${esc(path)}" title="Built-in: ${esc(origShown(path))}" aria-label="Revert to the built-in: ${esc(origShown(path))}">${mi('undo', 'sm')}Revert</button>`;
    el.dataset.rev || host.hasAttribute('data-revwrap') ? host.prepend(mark) : el.before(mark);
  }
}

/* ---------- edits ---------- */
function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) { const k = /^\d+$/.test(ks[i]) ? +ks[i] : ks[i]; o = o[k] = o[k] ?? {}; }
  const last = ks[ks.length - 1];
  if (val === '' || val === false || (Array.isArray(val) && !val.length)) { if (['loc', 'tissue', 'multiplier_label', 'branch', 'transport', 'reversible', 'tags', 'requires', 'grid_columns'].includes(last)) { delete o[last]; return; } }
  o[last] = val;
}
function valueOf(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number') return Math.max(1, +el.value || 1);
  if (el.hasAttribute('data-list')) return parseList(el.value);
  return el.value;
}
function onEdit(e, structural) {
  const el = e.target;
  if (!E.draft || !$('#editor') || !$('#editor').contains(el)) return;
  if (el.dataset.gridpos) {
    const mt = E.draft.metabolites[el.dataset.gridpos];
    mt.pos = mt.pos || [0, 0]; mt.pos[+el.dataset.axis] = Math.max(0, +el.value || 0);
    return renderPreview();
  }
  if (el.hasAttribute('data-layout')) {
    if (!structural) return;
    // Switching to Grid keeps the picture: each box starts where the line or cycle drew it.
    const at = el.value === 'grid' && E.draft.layout !== 'grid' ? gridFromPicture() : {};
    delete E.draft.circular; delete E.draft.layout;
    if (el.value === 'cycle') E.draft.circular = true;
    if (el.value === 'grid') { E.draft.layout = 'grid'; Object.entries(E.draft.metabolites).forEach(([id, mt], k) => { mt.pos = mt.pos || at[id] || [0, k]; }); }
    return renderEditor();
  }
  if (el.dataset.compose && structural) {
    const id = el.dataset.compose, c = E.draft.compose;
    E.draft.compose = el.checked ? uniq([...c, id]) : c.filter(x => x !== id);
    return renderEditor();
  }
  if (el.dataset.cof) {
    const r = E.draft.reactions[+el.dataset.i];
    r.cofactors = r.cofactors || { in: [], out: [] };
    r.cofactors[el.dataset.cof] = parseCof(el.value);
    pruneCof(E.draft);
    return renderPreview();
  }
  if (el.dataset.edAdd && structural) {
    const r = E.draft.reactions[+el.dataset.i];
    let id = el.value;
    const add = v => { if (v) r[el.dataset.edAdd] = uniq([...(r[el.dataset.edAdd] || []), v]); renderEditor(); };
    if (id === '__new') return ask({ title: 'New metabolite', input: true, ok: 'Add' }).then(nm => add(nm && newItem('met', nm)));
    return add(id);
  }
  if (!el.dataset.path) return;
  if (el.tagName === 'SELECT' && el.value === '__new') {
    if (!structural) return;
    const isEnz = el.dataset.path.endsWith('.enzyme');
    const path = el.dataset.path;
    return ask({ title: `New ${isEnz ? 'enzyme' : 'metabolite'}`, input: true, ok: 'Add' }).then(nm => {
      if (nm) setPath(E.draft, path, newItem(isEnz ? 'enz' : 'met', nm));
      renderEditor();
    });
  }
  setPath(E.draft, el.dataset.path, valueOf(el));
  // Names appear in other menus; checkboxes change card layout — redraw the form on commit.
  if (structural && (el.tagName === 'SELECT' || el.type === 'checkbox' || /\.name$|^name$/.test(el.dataset.path))) renderEditor();
  else renderPreview();
}
document.addEventListener('input', e => onEdit(e, false));
document.addEventListener('change', e => {
  if (e.target.id === 'edFile') return importFile(e.target.files[0]);
  if (!E.draft || !e.target.closest?.('#editor')) return;
  const before = E.pre;
  onEdit(e, true);
  const now = JSON.stringify(E.draft);
  if (before && before !== now) pushUndo(before);
  E.pre = now;
  decorateEdits($('#editor'));
  if (E.mode === 'visual') vxTools();
});

function importFile(f) {
  if (!f) return;
  f.text().then(async t => {
    let p;
    try { p = JSON.parse(t); buildModel(p); }
    catch (err) { return say('Can’t import that file', 'It isn’t a pathway this app can read:\n' + err.message); }
    if (!p.name) p.name = 'Imported pathway';
    if (p.id && Library.get(p.id) && !(await ask({ title: 'Replace your copy?', text: `You already have “${Library.get(p.id).name}”. Saving the import will replace it.`, ok: 'Replace on save', cancel: 'Keep both' }))) p.id = '';
    E.pending = p;
    location.hash = '#/pathways/import';
  });
}

function savePathway() {
  const p = clone(E.draft);
  pruneCof(p);
  if (p.compose && p.compose.length < 2) return say('Pick at least two pathways', 'A combined pathway merges two or more pathways.');
  try { buildModel(p.compose ? composePathway({ ...p, id: p.id || '__draft' }) : p); } catch (err) { return say('Fix these before saving', err.message); }
  if (!p.id) p.id = uniqueId(slug(p.name), new Set(Object.keys(Library.all())));
  Store.data.custom[p.id] = p;
  Store.save();
  modelCache.delete(p.id);
  closeEditor(p.id);
}

document.addEventListener('click', e => {
  const rv = e.target.closest('#editor [data-revert], #editor [data-revert-item]');
  if (rv) { e.preventDefault(); return rv.dataset.revert ? revertPath(rv.dataset.revert) : revertItem(rv.dataset.revertItem, rv.dataset.id); }
  const b = e.target.closest('#editor [data-ed]');
  if (!b) return;
  const p = E.draft, i = +b.dataset.i, act = b.dataset.ed;
  const R = p.reactions;
  switch (act) {
    case 'save': return savePathway();
    case 'cancel': ask({ title: 'Discard changes?', ok: 'Discard', cancel: 'Keep editing' }).then(y => y && closeEditor()); return;
    case 'export': return exportPathway(p);
    case 'import': return $('#edFile').click();
    case 'mode':
      E.mode = b.dataset.mode;
      try { local.set('pathways.edMode', E.mode); } catch {}
      return renderEditor();
    case 'apply-json':
      try { const next = JSON.parse($('#edJson').value); pushUndo(); E.draft = next; E.draft.cofactors = E.draft.cofactors || {}; E.draft.distractors = Object.assign({ metabolites: [], enzymes: [] }, E.draft.distractors); renderEditor(); }
      catch (err) { say('That JSON has an error', err.message); }
      return;
    case 'reset':
      ask({ title: 'Restore the built-in version?', text: 'Your edits to this pathway will be thrown away.', ok: 'Restore' }).then(y => {
        if (!y) return;
        delete Store.data.custom[E.origId]; Store.save(); modelCache.delete(E.origId); closeEditor(E.origId);
      });
      return;
    case 'delete':
      ask({ title: `Delete ${p.name}?`, text: 'This can’t be undone. Export it first if you might want it back.', ok: 'Delete' }).then(y => {
        if (!y) return;
        delete Store.data.custom[E.origId]; Store.save(); modelCache.delete(E.origId); closeEditor(null);
      });
      return;
    case 'add-step': {
      pushUndo();
      const last = R.filter(r => !r.branch).slice(-1)[0];
      R.push({ id: newReactionId(), enzyme: '', from: last ? last.to : '', to: '', reversible: false, cofactors: { in: [], out: [] } });
      return renderEditor();
    }
    case 'add-met': case 'add-enz':
      ask({ title: act === 'add-met' ? 'New metabolite' : 'New enzyme', input: true, ok: 'Add' }).then(nm => { if (nm) { pushUndo(); newItem(act === 'add-met' ? 'met' : 'enz', nm); renderEditor(); } });
      return;
    case 'del-met': case 'del-enz': {
      const id = b.dataset.id, isMet = act === 'del-met';
      const users = R.map((r, k) => (isMet ? [r.from, r.to, ...(r.also_to || []), ...(r.also_from || [])].includes(id) : r.enzyme === id) ? k + 1 : 0).filter(Boolean);
      if (users.length) return say('Still in use', `Step ${users.join(', ')} uses it. Change those steps first.`);
      pushUndo();
      delete (isMet ? p.metabolites : p.enzymes)[id];
      return renderEditor();
    }
    case 'up': pushUndo(); if (i > 0) [R[i - 1], R[i]] = [R[i], R[i - 1]]; return renderEditor();
    case 'down': pushUndo(); if (i < R.length - 1) [R[i + 1], R[i]] = [R[i], R[i + 1]]; return renderEditor();
    case 'del-step': ask({ title: `Remove step ${i + 1}?`, ok: 'Remove' }).then(y => { if (y) { pushUndo(); R.splice(i, 1); pruneCof(p); renderEditor(); } }); return;
    case 'unside': { pushUndo(); const r = R[i]; r[b.dataset.key] = (r[b.dataset.key] || []).filter(x => x !== b.dataset.id); if (!r[b.dataset.key].length) delete r[b.dataset.key]; return renderEditor(); }
  }
});
</script>
<script>
/* Visual pathway editor: metabolites are boxes you drag, steps are arrows between them.
   Drawn at the same scale as the Grid diagram (draw.js gridSVG), so a box's place on the canvas is its `pos`.
   Line and cycle pathways arrange themselves: the canvas shows them as drawn, and moving a box offers to switch to Grid.
   Select a box or an arrow to edit it in the side panel; every change goes through pushUndo (editor.js). */
'use strict';

const VX = { COLW: BW + 200, ROWH: BH + 96, X0: 24 + BW / 2 + 130 };
const vxY0 = () => TOP + (E.draft.grid_columns ? 34 : 0);
const gridPx = ([c, r]) => ({ cx: VX.X0 + c * VX.COLW, cy: vxY0() + r * VX.ROWH + BH / 2 });
const pxGrid = (cx, cy) => [(cx - VX.X0) / VX.COLW, (cy - BH / 2 - vxY0()) / VX.ROWH];
const r2 = v => Math.round(v * 100) / 100;
const isGrid = () => E.draft.layout === 'grid';

/* ---------- positions ---------- */
// Where the quiz diagram draws each box for a line or cycle pathway (read back out of flowSVG's own output).
function flowPositions() {
  let svg = '';
  try { svg = flowSVG(buildModel({ ...E.draft, reactions: E.draft.reactions.filter(edOk) }), () => 'shown'); } catch { return {}; }
  const doc = new DOMParser().parseFromString(svg, 'image/svg+xml'), P = {};
  for (const g of doc.querySelectorAll('g.mbox[data-key]')) {
    const r = g.querySelector('rect'), id = g.getAttribute('data-key').slice(2);
    if (r) P[id] = { cx: +r.getAttribute('x') + +r.getAttribute('width') / 2, cy: +r.getAttribute('y') + BH / 2 };
  }
  return P;
}
// Every metabolite gets a spot; ones the diagram doesn't draw yet (unconnected, or no pos) wait in a row underneath.
function vxPositions() {
  const P = {};
  if (isGrid()) { for (const [id, m] of Object.entries(E.draft.metabolites)) if (m.pos) P[id] = gridPx(m.pos); }
  else Object.assign(P, flowPositions());
  const ys = Object.values(P).map(q => q.cy);
  const y0 = (ys.length ? Math.max(...ys) + VX.ROWH : vxY0() + BH / 2);
  let k = 0;
  for (const id of Object.keys(E.draft.metabolites)) if (!P[id]) { P[id] = { cx: VX.X0 + (k % 3) * VX.COLW, cy: y0 + Math.floor(k / 3) * VX.ROWH * 0.7, parked: true }; k++; }
  return P;
}
// Grid positions that reproduce the current picture exactly (used when a line or cycle becomes a grid).
function gridFromPicture() {
  const P = vxPositions(), out = {};
  for (const [id, q] of Object.entries(P)) out[id] = pxGrid(q.cx, q.cy);
  const minC = Math.min(0, ...Object.values(out).map(v => v[0])), minR = Math.min(0, ...Object.values(out).map(v => v[1]));
  for (const id of Object.keys(out)) out[id] = [r2(out[id][0] - minC), r2(out[id][1] - minR)];
  return out;
}
function vxToGrid() {
  pushUndo();
  const at = gridFromPicture();
  delete E.draft.circular; E.draft.layout = 'grid';
  for (const [id, m] of Object.entries(E.draft.metabolites)) m.pos = at[id] || m.pos || [0, 0];
  renderEditor();
}
function askToGrid() {
  ask({ title: 'Place the boxes yourself?', ok: 'Switch to Grid', cancel: 'Keep it automatic',
    text: `This pathway uses the ${layoutOf(E.draft)} layout, which arranges the boxes by itself. Moving a box switches it to the Grid layout: the diagram is then drawn exactly as you place things.\n\nGrid diagrams don’t draw compartment lanes or a cycle ring, and quizzes read the steps in the order they’re listed. Undo or the Layout menu switches back.` })
    .then(y => y && vxToGrid());
}

/* ---------- markup ---------- */
const tb = (act, ic, label, extra = '') => `<button type="button" class="btn small ghost" data-vx="${act}" ${extra}>${mi(ic, 'sm')}<span>${label}</span></button>`;
function vxHTML() {
  return `<div class="vx">
    <div class="vx-main card">
      <div class="vx-tools" role="toolbar" aria-label="Canvas">
        ${tb('add-met', 'add', 'Metabolite')}
        ${tb('delete', 'delete', 'Delete', E.sel ? '' : 'disabled')}
        <span class="vx-sep"></span>
        ${tb('undo', 'undo', 'Undo', E.undo.length ? '' : 'disabled')}
        ${tb('redo', 'redo', 'Redo', E.redo.length ? '' : 'disabled')}
        <span class="vx-sep"></span>
        <button type="button" class="btn small ghost iconbtn" data-vx="zoom-out" aria-label="Zoom out" title="Zoom out">${mi('zoom_out', 'sm')}</button>
        <button type="button" class="btn small ghost iconbtn" data-vx="zoom-in" aria-label="Zoom in" title="Zoom in">${mi('zoom_in', 'sm')}</button>
        ${tb('fit', 'fit_screen', 'Fit')}
        ${isGrid() ? tb('snap', 'grid_on', 'Snap', `aria-pressed="${E.snap}" title="Line boxes up on quarter columns and half rows"`) : ''}
      </div>
      ${isGrid() ? '' : `<div class="vx-note">${mi('route', 'sm')}<span>${layoutOf(E.draft) === 'cycle' ? 'Cycle' : 'Line'} layout: the boxes are placed automatically, as quizzes draw them.</span><button type="button" class="btn small" data-vx="to-grid">Place them myself</button></div>`}
      <div class="vx-stage"><svg id="vxSvg" class="flow vx-svg" role="application" aria-label="Pathway canvas. Drag boxes to move them; drag a selected box’s arrow handle to another box to add a step."></svg></div>
      <p class="vx-help muted">Drag a box to move it, or empty space to pan. Select a box, then drag its ${mi('arrow_forward', 'sm')} handle onto another box to add a step (drop on empty space for a new metabolite). Double-click empty space to add a metabolite. ⌘Z undoes.</p>
    </div>
    <aside class="vx-insp card" id="vxInsp" aria-label="Selected item"></aside>
  </div>`;
}

/* ---------- drawing ---------- */
const vxBadge = (x, y, c) => (!c ? '' : `<g class="vx-badge ${c}" transform="translate(${x - 10},${y - 10})"><title>${c === 'added' ? 'Added — not in the built-in' : 'Edited — differs from the built-in'}</title><circle cx="10" cy="10" r="10"/><svg x="3" y="3" width="14" height="14" viewBox="0 -960 960 960"><path d="${MI[c === 'added' ? 'add' : 'edit_note']}"/></svg></g>`);
function vxHead(x, y, ang, size = 9) {
  const a1 = ang + Math.PI * 0.84, a2 = ang - Math.PI * 0.84;
  return `<path class="vx-ah" d="M${x},${y}L${x + size * Math.cos(a1)},${y + size * Math.sin(a1)}L${x + size * Math.cos(a2)},${y + size * Math.sin(a2)}Z"/>`;
}
// One step: a straight arrow, bowed when two steps join the same pair of boxes. Returns markup + where its label sits.
function vxStep(r, P, off, selId, cofM) {
  const a = P[r.from], b = P[r.to];
  if (!a || !b || r.from === r.to) return '';
  const dx = b.cx - a.cx, dy = b.cy - a.cy, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const ctl = { cx: (a.cx + b.cx) / 2 + nx * off * 2, cy: (a.cy + b.cy) / 2 + ny * off * 2 };
  const p1 = edgePt(a, ctl.cx, ctl.cy), p2 = edgePt(b, ctl.cx, ctl.cy);
  const d = off ? `M${p1[0]},${p1[1]} Q${ctl.cx},${ctl.cy} ${p2[0]},${p2[1]}` : `M${p1[0]},${p1[1]} L${p2[0]},${p2[1]}`;
  const mid = off ? [0.25 * p1[0] + 0.5 * ctl.cx + 0.25 * p2[0], 0.25 * p1[1] + 0.5 * ctl.cy + 0.25 * p2[1]] : [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
  const angEnd = Math.atan2(p2[1] - (off ? ctl.cy : p1[1]), p2[0] - (off ? ctl.cx : p1[0]));
  const angStart = Math.atan2(p1[1] - (off ? ctl.cy : p2[1]), p1[0] - (off ? ctl.cx : p2[0]));
  const sel = selId === r.id, enz = E.draft.enzymes[r.enzyme];
  let s = `<g class="vx-step${sel ? ' sel' : ''}${r.transport ? ' trn' : ''}" data-rxn="${esc(r.id)}">`;
  if (sel) s += `<path class="vx-glow" d="${d}"/>`;
  s += `<path class="vx-hit" d="${d}"/><path class="vx-ln" d="${d}"/>` + vxHead(p2[0], p2[1], angEnd) + (r.reversible ? vxHead(p1[0], p1[1], angStart) : '');
  // Label beside the line, never on it: above a shallow arrow, left of a steep one (as the diagram does).
  const steep = Math.abs(dy) > Math.abs(dx);
  let lx = nx, ly = ny;
  if (steep ? lx > 0 : ly > 0) { lx = -lx; ly = -ly; }
  const x = mid[0] + lx * 14, y = mid[1] + ly * 14, anchor = steep ? 'end' : 'middle';
  const lines = enz ? wrap(enz.name || r.enzyme, 22).slice(0, 3) : [];
  const ct = (r.cofactors?.in || []).length || (r.cofactors?.out || []).length ? cofText(cofM, r.cofactors) : '';
  const all = [...lines.map(t => ['vx-enz', t]), ...(ct ? [['vx-cof', ct]] : [])];
  if (!enz) {
    const w = 128, rx = anchor === 'end' ? x - w : x - w / 2, ry = steep ? y - 13 : y - 26;
    s += `<g class="vx-pick"><rect x="${rx}" y="${ry}" width="${w}" height="26" rx="13"/><text x="${rx + w / 2}" y="${ry + 13}">Choose enzyme</text></g>`;
  } else {
    const lh = 15, y0 = steep ? y - (all.length - 1) * lh / 2 : y - (all.length - 1) * lh - 6;
    all.forEach(([c, t], i) => { s += `<text class="${c}" x="${x}" y="${y0 + i * lh}" text-anchor="${anchor}">${esc(t)}</text>`; });
  }
  s += vxBadge(anchor === 'end' ? x + 14 : x - 8 - Math.max(...all.map(l => l[1].length), 8) * 3.6, steep ? y : y - 6 - (all.length - 1) * 15, itemChange('rxn', r.id));
  // Side products leave from the middle of the arrow; side inputs join it there.
  for (const [ids, out] of [[r.also_to || [], true], [r.also_from || [], false]]) for (const sid of ids) {
    const q = P[sid];
    if (!q) continue;
    const e = edgePt(q, mid[0], mid[1]);
    const [fx, fy, tx, ty] = out ? [mid[0], mid[1], e[0], e[1]] : [e[0], e[1], mid[0], mid[1]];
    s += `<path class="vx-hit" d="M${fx},${fy}L${tx},${ty}"/><path class="vx-side" d="M${fx},${fy}L${tx},${ty}"/>` + vxHead(tx, ty, Math.atan2(ty - fy, tx - fx), 7);
  }
  return s + '</g>';
}
function vxNode(id, q, sel) {
  const m = E.draft.metabolites[id], label = m.name || id, w = BW;
  const fs = label.length * 7.6 > w - 14 ? ` style="font-size:${Math.max(10.5, (w - 14) / label.length / 0.56).toFixed(1)}px"` : '';
  const x = q.cx - w / 2, y = q.cy - BH / 2;
  let s = `<g class="vx-node${sel ? ' sel' : ''}${q.parked ? ' parked' : ''}" data-node="${esc(id)}">`;
  if (sel) s += `<rect class="vx-ring" x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${BH + 12}" rx="13"/>`;
  s += `<rect x="${x}" y="${y}" width="${w}" height="${BH}" rx="9"/><text x="${q.cx}" y="${q.cy}"${fs}>${esc(label)}</text></g>`;
  s += vxBadge(x + w - 4, y + 2, itemChange('met', id));
  if (sel) s += `<g class="vx-handle" data-handle="${esc(id)}"><title>Drag onto another box to add a step</title><circle class="vx-hit-c" cx="${x + w + 24}" cy="${q.cy}" r="20"/><circle cx="${x + w + 24}" cy="${q.cy}" r="12"/><svg x="${x + w + 16}" y="${q.cy - 8}" width="16" height="16" viewBox="0 -960 960 960"><path d="${MI.arrow_forward}"/></svg></g>`;
  return s;
}
function renderCanvas() {
  const svg = $('#vxSvg');
  if (!svg || !E.draft) return;
  const P = E.vxPos = vxPositions(), d = E.draft, selM = E.sel?.kind === 'met' ? E.sel.id : null, selR = E.sel?.kind === 'rxn' ? E.sel.id : null;
  let s = '';
  if (isGrid()) {
    // Faint guides through column and row centers: where boxes line up.

<script>

    occ: [['met', 'Metabolites', ['show', 'quiz']], ['enz', 'Enzymes', ['show', 'quiz', 'hide']], ['trn', 'Transporters', ['show', 'quiz', 'hide']], ['cof', 'Cofactors', ['show', 'quiz', 'hide']], ['loc', 'Compartments', ['show', 'quiz', 'place', 'hide']]],
    stepM: [['enz', 'Enzyme or transporter', ['show', 'quiz', 'hide']], ['cof', 'Cofactors', ['show', 'quiz', 'hide']], ['dir', 'Direction', ['show', 'quiz']], ['loc', 'Location', ['show', 'quiz', 'hide']]],
    stepE: [['met', 'Reactants & products', ['show', 'quiz']], ['cof', 'Cofactors', ['show', 'quiz', 'hide']], ['loc', 'Location', ['show', 'quiz', 'hide']], ['path', 'Pathway', ['show', 'quiz', 'hide']]],

function elOf(cfg, k) {

}
const el = k => elOf(Q.cfg, k);
/* Compartments set to Place: no lanes, tints or names until you've placed them yourself in a round of their own
   (mark the membranes, then name each part; see Compartments below). It runs while the whole pathway is showing:
   first in Fill the blanks, after the rest in Full recall and Building blocks. Q.placed = that round is behind you. */
const placing = () => el('loc') === 'place' && !Q.placed;
// Enzyme slots ('e:<reaction>') are transporters when the step moves something across a membrane.
const kindOf = (key, m = Q.m) => (key[0] === 'e' ? m?.items[key]?.kind || 'enz' : { m: 'met', c: 'cof', o: 'cof', z: 'loc' }[key[0]]);

const answerStyle = () => { const a = Q.cfg.answer || Store.settings.answer; return Q.cfg.mode === 'build' && !['type', 'along'].includes(a) ? 'type' : a; };

function quizSummary(cfg) {
  const by = { quiz: [], show: [], hide: [], place: [] };
  elSpecFor(cfg).forEach(([k, label]) => by[elOf(cfg, k)].push(label.toLowerCase()));
  const mode = cfg.mode === 'build' ? 'Building blocks' : cfg.mode === 'single' ? 'Fill the blanks' : cfg.mode === 'total' ? (cfg.start === 'begin' ? 'Full recall from the top' : 'Full recall') : cfg.given === 'enz' ? 'Single step, given the enzyme' : 'Single step, given two metabolites';
  return [mode, by.quiz.length && 'quiz ' + by.quiz.join(', '), by.place.length && 'place ' + by.place.join(', '), by.hide.length && 'hide ' + by.hide.join(', ')].filter(Boolean).join(' · ');
}

/* ---------- questions ---------- */
function mcOptions(item, m) {
  const p = m.p;
  const trnIds = new Set(p.reactions.filter(r => r.transport).map(r => r.enzyme));
  const inPath = item.kind === 'met' ? Object.values(p.metabolites).map(x => x.name)
    : Object.entries(p.enzymes).filter(([id]) => trnIds.has(id) === (item.kind === 'trn')).map(([, e]) => e.name);
  const extra = item.kind === 'met' ? (p.distractors?.metabolites || []) : item.kind === 'trn' ? TRANSPORTER_DISTRACTORS : (p.distractors?.enzymes || []);
  const inside = shuffle(uniq(inPath).filter(n => n !== item.name));
  const outside = shuffle(uniq(extra).filter(n => n !== item.name && !inside.includes(n)));
  const picks = [...inside.slice(0, 2), ...outside.slice(0, 1)];
  for (const n of [...inside, ...outside]) if (picks.length < 3 && !picks.includes(n)) picks.push(n);
  return shuffle([item.name, ...picks]);
}
function pickOthers(right, pool, n = 3) { return shuffle([right, ...shuffle(uniq(pool).filter(x => x && x !== right)).slice(0, n)]); }
function cofOptions(m, right) {
  const pool = m.p.reactions.flatMap(x => [cofSideText(m, { in: x.cofactors?.in }), cofSideText(m, { out: x.cofactors?.out })]).filter(Boolean);
  return pickOthers(right, right === 'None' ? [...pool, 'None'] : pool);
}
// What a tier of name does right now: the quiz's setting when typing, otherwise (choice, self-check, typing along) it just counts.
const tierMode = t => (answerStyle() === 'type' ? nameModesCfg(Q.cfg)[TIER_KEYS[t]] : 'auto');
const MODE_RANK = { auto: 0, enter: 1, off: 2 };
// A question either knows the tier of an answer (tierOf: 0 full, 1 common, 2 any, null = not a name of it), and then
// counts it unless that tier is off, or it has its own check and every right answer counts as full.
function baseQ(extra) {
  const q = Object.assign({ status: 'open', tries: 0, wrong: [], draft: '' }, extra);
  if (q.tierOf && !q.check) q.check = v => { const t = q.tierOf(v); return t !== null && tierMode(t) !== 'off'; };
  if (!q.tierOf) q.tierOf = v => (q.check(v) ? 0 : null);
  return q;
}

/* ---------- Type along: the answer is shown faintly and fills in solid as you type it ----------
   Punctuation and spaces in the answer are skipped for you; Greek letters take their Latin initial (α ← a).
   A wrong character shows as a mistake until you backspace over it; any mistake means it wasn't right first try. */
const ALONG_SEP = /[\s\-,()\/.'’+:;]/;

    if (i >= target.length) { extra++; continue; }

  }

function alongTextFor(q, m, r) {

  if (q.kind === 'mets') return metNames(m, q.side === 'r' ? reactantsOf(r) : productsOf(r));
  if (q.kind === 'path') return m.p.name;

}

    const all = uniq(Library.atomic().flatMap(p => p.reactions.map(r => r.loc)).filter(Boolean)).filter(l => canonLoc(l) !== item.canon);
    return baseQ({ kind: 'loc', label: 'Compartment', item, statKey: item.key, pid: m.p.id, answerText: item.name, correct: item.name, placeholder: 'e.g. mitochondria',
      options: answerStyle() === 'choice' ? pickOthers(item.name, uniq(all.map(l => l[0].toUpperCase() + l.slice(1)))) : null,
      // "mitochondria" full, "mito" a common abbreviation, "ER" any abbreviation
      tierOf: v => (v === item.name || canonLoc(v) === item.canon || item.aliases.some(a => norm(a) === norm(v)) ? (/^[A-Z]{2,4}$/.test(String(v).trim()) ? 2 : shortenedLoc(v, item) ? 1 : 0) : null) });
  }

    kind: item.kind, label: { met: 'Metabolite', enz: 'Enzyme', trn: 'Transporter' }[item.kind], item, statKey: item.key, pid: m.p.id,
    answerText: item.name, correct: item.name,

// With "Require full names", a compartment can't be a clipped word ("mito", "cyto") or an acronym ("ER", "RER");
// whole words still count, including other proper names for it ("mitochondrion", "matrix").
function shortenedLoc(v, item) {
  const t = String(v).trim(), n = norm(t);

  const full = uniq([item.name, item.canon, ...(item.aliases || [])].filter(Boolean).map(norm)).filter(f => f.length > n.length);

// One question per side of a step's cofactors ("Cofactors in", "Cofactors out"), each in any order.

function cofQ(r, m, item = null) {

    kind: 'cof', side, label: !item ? 'Cofactors' : side === 'in' ? 'Cofactors in' : 'Cofactors out', item, factItem: m.items['e:' + r.id], answerText: t, correct: t,
    statKey: item ? item.key : 'c:' + r.id, pid: m.p.id, cofs, model: m,
    placeholder: !item ? 'e.g. ATP — or "none"' : side === 'in' ? 'what goes in, e.g. ATP' : 'what comes out, e.g. ADP',

// Cofactors lock in one at a time as you type them (Type answers): q.locked holds the ids already in.
const cofWant = q => [...(q.cofs.in || []), ...(q.cofs.out || [])];

const lockedHTML = q => (q.locked?.length ? `<span class="cof-locked" aria-label="Entered: ${esc(lockedText(q))}">${q.locked.map(id => `<span class="lk">${esc(cofName(q.model, id))}</span>`).join('')}</span>` : '');

const cofQs = (r, m) => { const its = cofItemsOf(m, r); return its.length ? its.map(it => cofQ(r, m, it)) : [cofQ(r, m)]; };

    { v: 'down', label: `${A} → ${B}`, sub: 'one-way, top to bottom' },
    { v: 'up', label: `${B} → ${A}`, sub: 'one-way, bottom to top' },
    { v: 'rev', label: `${A} ⇌ ${B}`, sub: 'reversible' },

}

  const t = metNames(m, want);

    statKey: (side === 'r' ? 'r:' : 'p:') + r.id, pid: m.p.id, placeholder: 'e.g. G3P, DHAP',

    placeholder: 'e.g. mitochondria',

    ? list.map(x => ({ x, r: Math.pow(Math.random(), 1 / (0.15 + 4 * rateOf(x))) })).sort((a, b) => a.r - b.r).map(o => o.x)
