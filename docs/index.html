ad (↑ ALA → neuro symptoms, basophilic stippling with ferrochelatase block)."}, "pbgd": {"name": "Porphobilinogen deaminase", "short": "PBGD", "aliases": ["PBG deaminase", "hydroxymethylbilane synthase", "HMB synthase", "uroporphyrinogen I synthase"], "notes": "Deficiency → acute intermittent porphyria (AD): painful abdomen, port-wine urine, polyneuropathy, psychological symptoms, precipitated by drugs/alcohol/starvation. No photosensitivity. Treat with glucose and hemin."}, "uros": {"name": "Uroporphyrinogen III synthase", "short": "UROS", "aliases": ["uroporphyrinogen III cosynthase", "uroporphyrinogen synthase", "uroporphyrinogen 3 synthase"], "notes": "Deficiency → congenital erythropoietic porphyria (Günther): severe photosensitivity, red urine and teeth."}, "urod": {"name": "Uroporphyrinogen decarboxylase", "short": "UROD", "aliases": [], "notes": "Deficiency → porphyria cutanea tarda, the most common porphyria: blistering photosensitivity, hyperpigmentation, hypertrichosis, tea-colored urine; triggered by alcohol, hepatitis C, iron overload, estrogens."}, "cpox": {"name": "Coproporphyrinogen oxidase", "short": "CPOX", "aliases": ["coproporphyrinogen III oxidase"], "notes": "Mitochondrial. Deficiency → hereditary coproporphyria."}, "ppox": {"name": "Protoporphyrinogen oxidase", "short": "PPOX", "aliases": ["protoporphyrinogen IX oxidase"], "notes": "Deficiency → variegate porphyria (acute attacks + photosensitivity)."}, "fech": {"name": "Ferrochelatase", "short": "FECH", "aliases": ["heme synthase"], "notes": "Inserts Fe²⁺. Inhibited by lead (→ ↑ zinc protoporphyrin). Deficiency → erythropoietic protoporphyria (painful, non-blistering photosensitivity)."}}, "reactions": [{"id": "r1", "enzyme": "alas", "from": "glycine", "to": "ala", "reversible": false, "cofactors": {"in": ["succoa"], "out": ["coa", "co2"]}, "loc": "mitochondria", "tags": ["rate-limiting", "irreversible"], "requires": ["B6 (pyridoxal phosphate)"]}, {"id": "r2", "enzyme": "alad", "from": "ala", : "Acetyl-CoA", "short": "AcCoA", "aliases": ["acetyl CoA"], "notes": "From β-oxidation of fatty acids. Two molecules condense in the first step."}, "aacoa": {"name": "Acetoacetyl-CoA", "short": "AcAc-CoA", "aliases": ["acetoacetyl CoA"]}, "hmgcoa": {"name": "HMG-CoA", "short": "HMG-CoA", "aliases": ["3-hydroxy-3-methylglutaryl-CoA", "β-hydroxy-β-methylglutaryl-CoA", "beta-hydroxy-beta-methylglutaryl-CoA", "hydroxymethylglutaryl-CoA"], "notes": "Branch point: in the cytosol, HMG-CoA reductase turns it toward cholesterol."}, "acac": {"name": "Acetoacetate", "short": "AcAc", "aliases": ["acetoacetic acid"], "notes": "Detected by the nitroprusside urine test."}, "bhb": {"name": "β-Hydroxybutyrate", "short": "β-HB", "aliases": ["beta-hydroxybutyrate", "3-hydroxybutyrate", "BHB", "beta hydroxybutyrate", "β-hydroxybutyric acid"], "notes": "The main ketone in DKA (high NADH:NAD⁺ favors it) — missed by the nitroprusside test."}, "acetone": {"name": "Acetone", "short": "", "aliases": [], "notes": "Not used for fuel; exhaled → fruity breath."}}, "enzymes": {"thiolase": {"name": "Thiolase", "short": "", "aliases": ["acetoacetyl-CoA thiolase", "β-ketothiolase", "beta-ketothiolase", "acetyl-CoA acetyltransferase"], "notes": "Reversible; the last step of β-oxidation runs the other way."}, "hmgcs": {"name": "HMG-CoA synthase", "short": "HMGCS", "aliases": ["HMG CoA synthase", "3-hydroxy-3-methylglutaryl-CoA synthase"], "notes": "Rate-limiting for ketogenesis (mitochondrial isoform; a cytosolic isoform feeds cholesterol synthesis)."}, "hmgcl": {"name": "HMG-CoA lyase", "short": "HMGCL", "aliases": ["HMG CoA lyase"], "notes": "Releases acetoacetate and an acetyl-CoA."}, "bdh": {"name": "β-Hydroxybutyrate dehydrogenase", "short": "BDH", "aliases": ["beta-hydroxybutyrate dehydrogenase", "3-hydroxybutyrate dehydrogenase", "β-hydroxybutyrate DH"], "notes": "Reversible; in extrahepatic tissues it runs back to acetoacetate for use."}, "spont": {"name": "Spontaneous decarboxylation", "shor short": "6-PG", "aliases": ["6-phosphogluconic acid", "phosphogluconate"]}, "ru5p": {"name": "Ribulose-5-phosphate", "short": "Ru5P", "aliases": [], "notes": "End of the oxidative phase; feeds the non-oxidative sugar shuffle."}, "r5p": {"name": "Ribose-5-phosphate", "short": "R5P", "aliases": [], "notes": "→ PRPP → nucleotide synthesis."}, "xu5p": {"name": "Xylulose-5-phosphate", "short": "Xu5P", "aliases": [], "notes": "Transketolase (needs thiamine/B1) moves two carbons from Xu5P to R5P → G3P + sedoheptulose-7-P; transaldolase continues to F6P. RBC transketolase activity tests for thiamine deficiency."}}, "enzymes": {"g6pd": {"name": "Glucose-6-phosphate dehydrogenase", "short": "G6PD", "aliases": ["glucose 6-phosphate dehydrogenase"], "notes": "Rate-limiting. Activated by NADP⁺ (and induced by insulin); inhibited by NADPH. G6PD deficiency (X-linked): RBCs can't regenerate reduced glutathione → hemolysis after oxidant stress (fava beans, sulfonamides, primaquine, dapsone, infection); Heinz bodies and bite cells; protects against malaria."}, "pgls": {"name": "6-Phosphogluconolactonase", "short": "6PGL", "aliases": ["lactonase", "phosphogluconolactonase", "6-phosphogluconolactonase"], "notes": "Hydrolyzes the lactone ring."}, "pgd": {"name": "6-Phosphogluconate dehydrogenase", "short": "6PGD", "aliases": ["phosphogluconate dehydrogenase", "6-phosphogluconate DH"], "notes": "Oxidative decarboxylation: the second NADPH and the CO₂."}, "rpi": {"name": "Ribose-5-phosphate isomerase", "short": "RPI", "aliases": ["phosphopentose isomerase", "ribose 5-phosphate isomerase"], "notes": "Non-oxidative, reversible."}, "rpe": {"name": "Ribulose-5-phosphate 3-epimerase", "short": "RPE", "aliases": ["ribulose 5-phosphate epimerase", "phosphopentose epimerase", "epimerase"], "notes": "Non-oxidative, reversible."}}, "reactions": [{"id": "r1", "enzyme": "g6pd", "from": "g6p", "to": "pgl", "reversible": false, "cofactors": {"in": ["nadp"], "out": ["nadph"]}, "loc": "cytosol", "tags": : "Adenylosuccinate", "short": "S-AMP", "aliases": ["succinyl-AMP", "adenylosuccinic acid"]}, "ampm": {"name": "Adenosine monophosphate", "short": "AMP", "aliases": ["adenylate", "adenylic acid"], "notes": "Feeds back on PRPP amidotransferase and adenylosuccinate synthetase. Degraded via adenosine deaminase (ADA deficiency → SCID) to inosine → hypoxanthine → uric acid."}, "xmp": {"name": "Xanthosine monophosphate", "short": "XMP", "aliases": ["xanthylate", "xanthylic acid"]}, "gmp": {"name": "Guanosine monophosphate", "short": "GMP", "aliases": ["guanylate", "guanylic acid"], "notes": "Feeds back on PRPP amidotransferase and IMP dehydrogenase. Degraded to guanine → xanthine → uric acid (xanthine oxidase; allopurinol, febuxostat)."}}, "enzymes": {"prps": {"name": "PRPP synthetase", "short": "PRPS", "aliases": ["ribose-phosphate pyrophosphokinase", "phosphoribosyl pyrophosphate synthetase", "ribose-phosphate diphosphokinase"], "notes": "Transfers pyrophosphate from ATP (ATP → AMP). Overactive PRPP synthetase (X-linked) causes uric acid overproduction and gout."}, "ppat": {"name": "Glutamine-PRPP amidotransferase", "short": "GPAT", "aliases": ["amidophosphoribosyltransferase", "PRPP amidotransferase", "glutamine phosphoribosylpyrophosphate amidotransferase", "glutamine PRPP amidotransferase"], "notes": "Rate-limiting, committed step. Inhibited by AMP, GMP and IMP; activated by PRPP. 6-Mercaptopurine (and azathioprine, its prodrug) inhibits it — 6-MP is activated by HGPRT and degraded by xanthine oxidase and TPMT, so allopurinol raises 6-MP toxicity."}, "gars": {"name": "GAR synthetase", "short": "GARS", "aliases": ["glycinamide ribonucleotide synthetase", "phosphoribosylamine-glycine ligase"], "notes": "Adds the whole glycine molecule (C4, C5, N7)."}, "gart": {"name": "GAR transformylase", "short": "GART", "aliases": ["glycinamide ribonucleotide transformylase", "phosphoribosylglycinamide formyltransferase"], "notes": "First of two folate-dependent steps (C8 from N¹⁰-formyl-THF). Pemetrexed inhibits it (and thymidylate synthase, DHFR)."}, "fgams": {"name": "FGAM synthetase", "short": "FGAMS", "aliases": ["formylglycinamidine ribonucleotide synthetase", "phosphoribosylformylglycinamidine synthase"], "notes": "Second glutamine nitrogen (N3)."}, "airs": {"name": "AIR synthetase", "short": "AIRS", "aliases": ["aminoimidazole ribonucleotide synthetase", "phosphoribosylformylglycinamidine cyclo-ligase"], "notes": "Closes the imidazole ring."}, "airc": {"name": "AIR carboxylase", "short": "AIRC", "aliases": ["aminoimidazole ribonucleotide carboxylase", "phosphoribosylaminoimidazole carboxylase"], "notes": "Adds C6 from CO₂ (no biotin, unlike most carboxylases)."}, "saicars": {"name": "SAICAR synthetase", "short": "SAICARS", "aliases": ["phosphoribosylaminoimidazole-succinocarboxamide synthase"], "notes": "Aspartate donates N1."}, "adsl": {"name": "Adenylosuccinate lyase", "short": "ADSL", "aliases": ["adenylosuccinase"], "notes": "Acts twice in purine synthesis (SAICAR → AICAR and adenylosuccinate → AMP), each time releasing fumarate — aspartate's nitrogen stays, its carbons leave."}, "aicart": {"name": "AICAR transformylase", "short": "AICART", "aliases": ["aminoimidazole carboxamide ribonucleotide transformylase", "phosphoribosylaminoimidazolecarboxamide formyltransferase"], "notes": "Second folate-dependent step (C2 from N¹⁰-formyl-THF). Methotrexate polyglutamates inhibit it."}, "impch": {"name": "IMP cyclohydrolase", "short": "", "aliases": ["inosine monophosphate cyclohydrolase"], "notes": "Closes the six-membered ring to give IMP; bifunctional with AICAR transformylase (ATIC)."}, "adss": {"name": "Adenylosuccinate synthetase", "short": "ADSS", "aliases": ["adenylosuccinate synthase"], "notes": "Uses GTP — so GMP supply promotes AMP synthesis. Inhibited by AMP."}, "impdh": {"name": "IMP dehydrogenase", "short": "IMPDH", "aliases": ["inosine monophosphate dehydrogenase", "inosine-5′-monophosphate dehydrogenase"], "notes": "Rate-limiting for GMP. Inhibited by mycophenolate (lymphocytes depend on de novo synthesis) and ribavirin; inhibited by GMP."}, "gmps": {"name": "GMP synthetase", "short": "GMPS", "aliases": ["GMP synthase", "guanosine monophosphate synthetase"], "notes": "Uses ATP — so AMP supply promotes GMP synthesis. Glutamine donates the amino group."}}, "reactions": [{"id": "r1", "enzyme": "prps", "from": "r5p", "to": "prpp", "reversible": false, "cofactors": {"in": ["atp"], "out": ["amp"]}, "loc": "cytosol"}, {"id": "r2", "enzyme": "ppat", "from": "prpp", "to": "pra", "reversible": false, "cofactors": {"in": ["gln", "h2o"], "out": ["glu", "ppi"]}, "loc": "cytosol", "tags": ["rate-limiting", "irreversible"]}, {"id": "r3", "enzyme": "gars", "from": "pra", "to": "gar", "reversible": false, "cofactors": {"in": ["gly", "atp"], "out": ["adp", "pi"]}, "loc": "cytosol"}, {"id": "r4", "enzyme": "gart", "from": "gar", "to": "fgar", "reversible": false, "cofactors": {"in": ["fthf"], "out": ["thf"]}, "loc": "cytosol", "requires": ["Folate (B9)"]}, {"id": "r5", "enzyme": "fgams", "from": "fgar", "to": "fgam", "reversible": false, "cofactors": {"in": ["gln", "atp", "h2o"], "out": ["glu", "adp", "pi"]}, "loc": "cytosol"}, {"id": "r6", "enzyme": "airs", "from": "fgam", "to": "air", "reversible": false, "cofactors": {"in": ["atp"], "out": ["adp", "pi"]}, "loc": "cytosol"}, {"id": "r7", "enzyme": "airc", "from": "air", "to": "cair", "reversible": true, "cofactors": {"in": ["co2"], "out": []}, "loc": "cytosol"}, {"id": "r8", "enzyme": "saicars", "from": "cair", "to": "saicar", "reversible": false, "cofactors": {"in": ["asp", "atp"], "out": ["adp", "pi"]}, "loc": "cytosol"}, {"id": "r9", "enzyme": "adsl", "from": "saicar", "to": "aicar", "reversible": true, "cofactors": {"in": [], "out": ["fum"]}, "loc": "cytosol"}, {"id": "r10", "enzyme": "aicart", "from": "aicar", "to": "faicar", "reversible": true, "cofactors": {"in": ["fthf"], "out": ["thf"]}, "loc": "cytosol", "requires": ["Folate (B9)"]}, {"id": " ": ["uridylate kinase", "nucleoside monophosphate kinase", "UMP kinase", "cytidylate kinase"]}, "ndk": {"name": "Nucleoside diphosphate kinase", "short": "NDK", "aliases": ["NDP kinase", "nucleoside-diphosphate kinase"], "notes": "Swaps a phosphate from ATP onto any NDP or dNDP."}, "ctps": {"name": "CTP synthetase", "short": "CTPS", "aliases": ["CTP synthase", "cytidine triphosphate synthetase"], "notes": "Aminates UTP using glutamine and ATP. Inhibited by CTP."}, "rnr": {"name": "Ribonucleotide reductase", "short": "RNR", "aliases": ["ribonucleoside diphosphate reductase", "ribonucleotide diphosphate reductase"], "notes": "Makes all deoxyribonucleotides from NDPs, using thioredoxin (NADPH). Inhibited by hydroxyurea (sickle cell, myeloproliferative disorders); gemcitabine also inhibits it. dATP is the master inhibitor (why ADA deficiency kills lymphocytes)."}, "dutpase": {"name": "dUTPase", "short": "", "aliases": ["deoxyuridine triphosphatase", "dUTP diphosphatase", "dUTP pyrophosphatase"], "notes": "Hydrolyzes dUTP to dUMP + PPi."}, "ts": {"name": "Thymidylate synthase", "short": "TS", "aliases": ["thymidylate synthetase"], "notes": "Methylates dUMP with N⁵,N¹⁰-methylene-THF, which becomes DHF. Inhibited by 5-fluorouracil (as 5-FdUMP, a suicide inhibitor; capecitabine is its prodrug; leucovorin enhances it) and pemetrexed. DHF is recycled to THF by dihydrofolate reductase — inhibited by methotrexate (human), trimethoprim (bacterial) and pyrimethamine (protozoal); leucovorin (folinic acid) rescues methotrexate toxicity."}}, "reactions": [{"id": "r1", "enzyme": "cps2", "from": "glutamine", "to": "carbp", "reversible": false, "cofactors": {"in": ["hco3", "atp", "h2o"], "out": ["glu", "adp", "pi"]}, "loc": "cytosol", "tags": ["rate-limiting", "irreversible"]}, {"id": "r2", "enzyme": "atcase", "from": "carbp", "to": "carbasp", "reversible": false, "cofactors": {"in": ["asp"], "out": ["pi"]}, "loc": "cytosol"}, {"id": "r3", "enzyme": "dhoase", "from": "carbasp", "to": " <script>
/* Shared helpers. Plain scripts sharing one global scope, concatenated in order by build.py:
   util → store → model → draw → stats → editor → study. */
'use strict';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uniq = a => [...new Set(a)];
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
const uniqueId = (base, taken) => { let id = base, n = 2; while (taken.has(id)) id = `${base}-${n++}`; return id; };

const ICON = {
  ok: '<path d="M3.5 8.5l3 3 6-7"/>',
  no: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
};
const icon = k => `<svg class="ic ${k}" viewBox="0 0 16 16" aria-hidden="true">${ICON[k]}</svg>`;

// Greek letters fold to their Latin initial, whether typed as α, "alpha" or just "a": a-ketoglutarate ≡ α-ketoglutarate.
// Applied to both the answer and what was typed, so any word that happens to start "beta…" folds the same on both sides.
const GREEK = { α: 'a', β: 'b', γ: 'g', δ: 'd', ε: 'e', θ: 'th', κ: 'k', ω: 'o' };
const GREEK_WORDS = { alpha: 'a', beta: 'b', gamma: 'g', delta: 'd', epsilon: 'e', theta: 'th', kappa: 'k', omega: 'o' };
const foldGreek = s => String(s).replace(/[αβγδεθκω]/g, c => GREEK[c]);
// Case-, space- and punctuation-insensitive; "phosphate" ≡ "P", "bisphosphate"/"diphosphate" ≡ "BP"; Greek folded.
function norm(s) {
  return foldGreek(String(s).toLowerCase())
    .replace(/\b(alpha|beta|gamma|delta|epsilon|theta|kappa|omega)/g, w => GREEK_WORDS[w])
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/\b(bis|di)phosphate\b/g, 'bp').replace(/\bphosphate\b/g, 'p')
    .replace(/[\s\-_,.'’()\/]/g, '');
}

function download(name, text) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return true;
  } catch { return false; }
}

/* In-page stand-ins for alert / confirm / prompt — the native ones are disabled inside shared artifacts.
   ask() resolves to the typed text (input), true (confirmed) or null (cancelled). */
function ask({ title, text = '', input = false, value = '', ok = 'OK', cancel = 'Cancel', copy = false }) {
  const d = document.getElementById('askDialog');
  d.innerHTML = `<form method="dialog" class="dlg">
    <div class="dlg-h"><h2>${esc(title)}</h2></div>
    ${text ? `<p class="ask-text">${esc(text).replace(/\n/g, '<br>')}</p>` : ''}
    ${input === 'area' ? `<textarea id="askInput" rows="14" spellcheck="false">${esc(value)}</textarea>` : input ? `<input id="askInput" value="${esc(value)}" autocomplete="off">` : ''}
    <div class="actions">
      <button class="btn primary" value="ok">${esc(ok)}</button>
      ${copy ? '<button class="btn" type="button" id="askCopy">Copy</button>' : ''}
      ${cancel ? `<button class="btn ghost" value="cancel" formnovalidate>${esc(cancel)}</button>` : ''}
    </div></form>`;
  return new Promise(res => {
    const inp = d.querySelector('#askInput');
    d.querySelector('#askCopy')?.addEventListener('click', e => {
      navigator.clipboard?.writeText(inp.value).then(() => { e.target.textContent = 'Copied'; }, () => { inp.select(); e.target.textContent = 'Selected — press ⌘C'; });
    });
    d.addEventListener('close', () => {
      if (d.returnValue !== 'ok') return res(null);
      res(input ? (inp.value.trim() || null) : true);
    }, { once: true });
    d.returnValue = '';
    d.showModal();
    if (inp) { inp.focus(); inp.select(); }
  });
}
const say = (title, text) => ask({ title, text, cancel: null });
</script>

<script>
/* Where user data lives.
   Self-hosted (served by server.py): /api/state on the server, so every device sees the same edits, presets and stats.
   Standalone (dist/pathways.html, GitHub Pages, any static host): this browser's localStorage — export to back up or share.
   Built-in pathways always come from window.PATHWAYS_BUNDLE (server-generated bundle.js, or inlined by build.py). */
'use strict';

const DEFAULT_SETTINGS = {
  answer: 'type',      // type | choice | self
  view: 'flow',        // flow | list
  dir: 'v',            // list direction: v | h
  zoom: 'width',       // width | fit | number
  follow: true,        // keep the current blank centered
  facts: true,         // show the facts card after each answer
  autoAdvance: true,   // Full recall moves on by itself after a right answer
};

const Store = {
  mode: 'local',
  data: { custom: {}, stats: {}, presets: [], settings: {} },
  async init() {
    let raw = null;
    if (!window.PATHWAYS_STANDALONE) {
      try {
        const r = await fetch('api/state', { cache: 'no-store' });
        if (r.ok) { raw = await r.json(); this.mode = 'server'; }
      } catch {}
    }
    if (!raw) { try { raw = JSON.parse(localStorage.getItem('pathways.data') || '{}'); } catch { raw = {}; } }
    this.data = Object.assign({ custom: {}, stats: {}, presets: [] }, raw);
    this.data.settings = Object.assign({}, DEFAULT_SETTINGS, raw.settings);
  },
  save() { clearTimeout(this.t); this.t = setTimeout(() => this.flush(), 400); },
  async flush() {
    const body = JSON.stringify(this.data);
    if (this.mode === 'server') {
      try { await fetch('api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body }); return; } catch {}
    }
    try { localStorage.setItem('pathways.data', body); } catch {}
  },
  get settings() { return this.data.settings; },
};

const Library = {
  builtin: () => (window.PATHWAYS_BUNDLE && window.PATHWAYS_BUNDLE.pathways) || {},
  sharedCof: () => (window.PATHWAYS_BUNDLE && window.PATHWAYS_BUNDLE.cofactors) || {},
  raw(id) { return Store.data.custom[id] || this.builtin()[id]; },
  // Combined pathways ({compose: [ids]}) are merged on the fly, so edits to their parts flow through.
  all() {
    const out = {};
    for (const id of new Set([...Object.keys(this.builtin()), ...Object.keys(Store.data.custom)])) { const p = this.get(id); if (p) out[id] = p; }
    return out;
  },
  get(id) { const p = this.raw(id); return p && p.compose ? composePathway(p) : p; },
  atomic() { return Object.values(this.all()).filter(p => !p.compose); },
  status(id) { return Store.data.custom[id] ? (this.builtin()[id] ? 'edited' : 'custom') : 'builtin'; },
  list() {
    return Object.values(this.all()).map(p => ({ id: p.id, name: p.name, status: this.status(p.id), group: p.group || 'Other', steps: (p.reactions || []).length }))
      .sort((a, b) => a.group.localeCompare(b.group) || a.name.localeCompare(b.name));
  },
  groups() {
    const g = {};
    for (const p of this.list()) (g[p.group] = g[p.group] || []).push(p);
    return g;
  },
};

/* ---------- quizzes ----------
   A quiz = which pathways + how to study them. Presets are saved quizzes; built-ins can't be edited, only copied.
   pathways: [] means "whatever is picked when you start it". */
const BUILTIN_PRESETS = [
  { id: 'b-blanks', name: 'Fill the blanks', blurb: 'One metabolite or enzyme hidden at a time.',
    mode: 'single', el: { met: 'quiz', enz: 'quiz', cof: 'show' } },
  { id: 'b-top', name: 'Recall from the top', blurb: 'Nothing shown. Rebuild the whole pathway in order.',
    mode: 'total', start: 'begin', el: { met: 'quiz', enz: 'quiz', cof: 'show' } },
  { id: 'b-random', name: 'Recall from anywhere', blurb: 'Random starting point; forward, then backward.',
    mode: 'total', start: 'random', el: { met: 'quiz', enz: 'quiz', cof: 'show' } },
  { id: 'b-enzyme', name: 'Name the enzyme', blurb: 'Two metabolites; which enzyme, which cofactors, which way.',
    mode: 'step', given: 'mets', el: { enz: 'quiz', cof: 'quiz', dir: 'quiz' } },
  { id: 'b-reaction', name: 'What does it do?', blurb: 'Given an enzyme: reactants, products, cofactors and pathway.',
    mode: 'step', given: 'enz', el: { met: 'quiz', cof: 'quiz', path: 'quiz' }, allPathways: true },
  { id: 'b-cofactors', name: 'Cofactor drill', blurb: 'Every cofactor hidden; everything else shown.',
    mode: 'single', el: { met: 'show', enz: 'show', cof: 'quiz' } },
  { id: 'b-direction', name: 'Which way?', blurb: 'Reversible or one-way, and in which direction.',
    mode: 'step', given: 'mets', el: { enz: 'show', cof: 'show', dir: 'quiz' } },
];
const QUIZ_DEFAULTS = { mode: 'single', given: 'mets', start: 'random', weak: false, answer: null, view: null,
  el: { met: 'quiz', enz: 'quiz', trn: 'quiz', cof: 'show', loc: 'show', dir: 'quiz', path: 'quiz' } };
function normalizeQuiz(q) {
  const out = Object.assign(clone(QUIZ_DEFAULTS), clone(q || {}));
  out.el = Object.assign(clone(QUIZ_DEFAULTS.el), (q && q.el) || {});
  out.pathways = (out.pathways || []).filter(id => Library.get(id));
  return out;
}
/* ---------- combined pathways ----------
   The first part is the main line. Every other part's metabolites and enzymes are matched to it by name;
   a step that does the same thing (same enzyme, same metabolites, either direction) is shared and drawn once,
   anything else is added as a side step tagged with the pathway it belongs to ("only"). */
const composeCache = new Map();
function composePathway(def) {
  const parts = def.compose.map(id => Library.raw(id)).filter(p => p && !p.compose);
  const sig = JSON.stringify([def, parts]);
  const hit = composeCache.get(def.id);
  if (hit && hit.sig === sig) return hit.p;
  if (!parts.length) return { ...def, metabolites: {}, enzymes: {}, reactions: [] };
  const base = clone(parts[0]);
  const out = { ...base, ...def, compose: def.compose, metabolites: base.metabolites, enzymes: base.enzymes, reactions: base.reactions,
    cofactors: { ...(base.cofactors || {}) }, distractors: { metabolites: [...(base.distractors?.metabolites || [])], enzymes: [...(base.distractors?.enzymes || [])] } };
  delete out.circular; delete out.layout;
  const nameKey = x => norm(x.name);
  const metByName = new Map(Object.entries(out.metabolites).map(([id, m]) => [nameKey(m), id]));
  const enzByName = new Map(Object.entries(out.enzymes).map(([id, e]) => [nameKey(e), id]));
  const sameStep = (a, b) => a.enzyme === b.enzyme && sameSet([...reactantsOf(a), ...productsOf(a)], [...reactantsOf(b), ...productsOf(b)]);
  const matched = new Set();
  for (const q of parts.slice(1)) {
    const mid = {}, eid = {};
    for (const [id, m] of Object.entries(q.metabolites)) {
      const hitId = metByName.get(nameKey(m));
      if (hitId) mid[id] = hitId; else { const nid = `${q.id}.${id}`; out.metabolites[nid] = clone(m); metByName.set(nameKey(m), nid); mid[id] = nid; }
    }
    for (const [id, e] of Object.entries(q.enzymes)) {
      const hitId = enzByName.get(nameKey(e));
      if (hitId) eid[id] = hitId; else { const nid = `${q.id}.${id}`; out.enzymes[nid] = clone(e); enzByName.set(nameKey(e), nid); eid[id] = nid; }
    }
    Object.assign(out.cofactors, q.cofactors || {});
    out.distractors.metabolites.push(...(q.distractors?.metabolites || []));
    out.distractors.enzymes.push(...(q.distractors?.enzymes || []));
    for (const r of q.reactions) {
      const mr = { ...clone(r), id: `${q.id}.${r.id}`, enzyme: eid[r.enzyme], from: mid[r.from], to: mid[r.to] };
      if (r.also_to) mr.also_to = r.also_to.map(x => mid[x]);
      if (r.also_from) mr.also_from = r.also_from.map(x => mid[x]);
      const twin = out.reactions.find(b => sameStep(b, mr));
      if (twin) { matched.add(twin.id); continue; }
      mr.branch = true; mr.only = q.name;
      out.reactions.push(mr);
    }
  }
  for (const r of out.reactions) if (!r.only && !matched.has(r.id) && parts.length > 1) r.only = parts[0].name;
  out.distractors.metabolites = uniq(out.distractors.metabolites);
  out.distractors.enzymes = uniq(out.distractors.enzymes);
  composeCache.set(def.id, { sig, p: out });
  return out;
}

const Presets = {
  all() { return [...BUILTIN_PRESETS.map(p => ({ ...p, builtin: true })), ...Store.data.presets]; },
  get(id) { return this.all().find(p => p.id === id); },
  save(p) {
    const i = Store.data.presets.findIndex(x => x.id === p.id);
    if (i >= 0) Store.data.presets[i] = p; else Store.data.presets.push(p);
    Store.save();
  },
  remove(id) { Store.data.presets = Store.data.presets.filter(p => p.id !== id); Store.save(); },
};
</script>
<script>
/* Pathway JSON → study model.
   reactions[] in pathway order. A reaction is on the spine unless branch:true.
     from / to          main substrate → main product
     also_to[]          side products (e.g. aldolase → DHAP)
     also_from[]        side inputs drawn as metabolites (e.g. gluconeogenic aldolase ← DHAP)
     branch:true        a side reaction between a spine metabolite and a side one, either direction
     cofactors {in,out} ids from the shared cofactor list or the pathway's own `cofactors`
       reversible, multiplier, requires[], tags[]
     loc        compartment (cytosol, mitochondrial matrix, ER lumen…); tissue: organ/cell type when it differs within a pathway
     transport  the step moves a metabolite between compartments; its "enzyme" is the transporter
   circular:true → the last spine reaction returns to the first metabolite. pathway.tissue = where the pathway runs. */
'use strict';

function buildModel(p, sharedCof = Library.sharedCof()) {
  const cof = Object.assign({}, sharedCof, p.cofactors || {});
  const mets = p.metabolites || {}, enzs = p.enzymes || {}, rx = p.reactions || [];
  const errs = [];
  rx.forEach((r, i) => {
    const n = `Step ${i + 1}`;
    if (!enzs[r.enzyme]) errs.push(`${n}: no enzyme chosen`);
    for (const k of ['from', 'to']) if (!mets[r[k]]) errs.push(`${n}: "${k}" metabolite missing`);
    for (const k of ['also_to', 'also_from']) for (const s of r[k] || []) if (!mets[s]) errs.push(`${n}: unknown metabolite "${s}" in ${k}`);
  });
  const spine = rx.filter(r => !r.branch);
  if (!spine.length) errs.push('Add at least one step that is not a branch.');
  if (errs.length) throw new Error(errs.join('\n'));

  const items = {};
  for (const [id, m] of Object.entries(mets))
    items['m:' + id] = { key: 'm:' + id, kind: 'met', id, name: m.name, short: m.short, aliases: m.aliases || [], notes: m.notes };
  const m0 = { cof };
  for (const r of rx) {
    const e = enzs[r.enzyme];
    items['e:' + r.id] = { key: 'e:' + r.id, kind: r.transport ? 'trn' : 'enz', id: r.enzyme, rxn: r, name: e.name, short: e.short, aliases: e.aliases || [], notes: e.notes };
    // A reaction's cofactor set is its own quizzable item (only when it has one).
    const c = r.cofactors || {};
    if ((c.in || []).length || (c.out || []).length)
      items['c:' + r.id] = { key: 'c:' + r.id, kind: 'cof', rxn: r, name: cofText(m0, c), aliases: [], notes: null };
  }

  const spineMets = p.circular ? spine.map(r => r.from) : [spine[0].from, ...spine.map(r => r.to)];
  const onSpine = new Set(spineMets);
  const branches = rx.filter(r => r.branch);

  // Reading order for Full recall and the List view: metabolite, enzyme, metabolite…
  // Side products follow the enzyme that makes them; side inputs come just before the enzyme that uses them;
  // dead-end branches follow the metabolite they leave from.
  const seq = [], seen = new Set();
  const push = k => { if (!seen.has(k)) { seen.add(k); seq.push(k); } };
  const pushRx = r => { push('e:' + r.id); if (items['c:' + r.id]) push('c:' + r.id); };
  const pushMet = id => {
    if (seen.has('m:' + id)) return;
    // Side metabolites that only feed into this one (glucose from the blood via GLUT) come just before it.
    for (const b of branches) if (b.to === id && !onSpine.has(b.from) && !seen.has('m:' + b.from) && !rx.some(r => (r.also_to || []).includes(b.from) || (r !== b && r.to === b.from))) { push('m:' + b.from); pushRx(b); }
    push('m:' + id);
    for (const b of branches) {
      if (b.from !== id || seen.has('e:' + b.id)) continue;
      if (onSpine.has(b.to)) { if (!onSpine.has(id)) pushRx(b); }
      else { pushRx(b); pushMet(b.to); }
    }
  };
  pushMet(spineMets[0]);
  for (const r of spine) {
    for (const s of r.also_from || []) {
      for (const b of branches) if (b.to === s && seen.has('m:' + b.from)) pushRx(b);
      pushMet(s);
    }
    pushRx(r);
    for (const s of r.also_to || []) pushMet(s);
    if (!(p.circular && r.to === spineMets[0])) pushMet(r.to);
    // Bypasses between two metabolites already read (a combined pathway's reverse steps) follow right away.
    for (const b of branches) if (onSpine.has(b.from) && onSpine.has(b.to) && seen.has('m:' + b.from) && seen.has('m:' + b.to)) pushRx(b);
  }
  for (const k of Object.keys(items)) push(k); // anything unreachable still gets studied

  // Grids (steroidogenesis) have no single main line: read them in the order the steps are written.
  if (p.layout === 'grid') {
    seq.length = 0; seen.clear();
    for (const r of rx) { pushMet(r.from); pushRx(r); pushMet(r.to); }
    for (const k of Object.keys(items)) push(k);
  }
  const pairs = [];
  for (const r of rx) {
    pairs.push({ r, a: r.from, b: r.to });
    for (const s of r.also_to || []) pairs.push({ r, a: r.from, b: s });
    for (const s of r.also_from || []) pairs.push({ r, a: s, b: r.to });
  }
  return { p, cof, items, spine, spineMets, onSpine, branches, seq, pairs };
}

/* ---------- cofactors ---------- */
const cofName = (m, id) => (m.cof[id] && m.cof[id].name) || id;
function cofText(m, c) {
  const i = (c.in || []).map(id => cofName(m, id)), o = (c.out || []).map(id => cofName(m, id));
  if (!i.length && !o.length) return 'None';
  if (!i.length) return 'releases ' + o.join(' + ');
  if (!o.length) return 'uses ' + i.join(' + ');
  return i.join(' + ') + ' → ' + o.join(' + ');
}
function cofLookup(cofs) {
  const map = {}, phrases = [];
  for (const [id, c] of Object.entries(cofs)) for (const a of [id, c.name, ...(c.aliases || [])]) {
    map[norm(a)] = id;
    if (/\s/.test(a.trim())) phrases.push([a.toLowerCase(), id]);
  }
  phrases.sort((a, b) => b[0].length - a[0].length);
  return { map, phrases };
}
const IGNORE = new Set(['', '+', 'h+', 'h', 'mg2+', 'mg', 'and']);
// Unordered set match: "NAD+, Pi, NADH" ≡ "nad+ + inorganic phosphate -> nadh".
function gradeCof(m, raw, c) {
  const want = new Set([...(c.in || []), ...(c.out || [])]);
  let s = String(raw).toLowerCase().trim();
  if (!want.size) return /^(none|nothing|no|n\/?a|-|—)?$/.test(s.replace(/\s/g, ''));
  const { map, phrases } = cofLookup(m.cof);
  for (const [ph, id] of phrases) s = s.split(ph).join(' ' + id + ' ');
  const toks = s.split(/[,;\/\s]+|→|->|=>|⇌/).map(norm).filter(t => !IGNORE.has(t));
  const got = new Set();
  for (const t of toks) { if (!map[t]) return false; got.add(map[t]); }
  return got.size === want.size && [...want].every(x => got.has(x));
}

const acceptedFor = item => uniq([item.name, item.short, ...(item.aliases || [])].filter(Boolean).map(norm));

/* ---------- across pathways ---------- */
const modelCache = new Map();
function modelFor(p) {
  const hit = modelCache.get(p.id);
  if (hit && hit.src === p) return hit.m;

<script>

      s += arc(4, s1 + h1, s2, rxCls(r)) + head(...pt(s1, 4), tangent(s1) + Math.PI, 8);
    }
    const tm = (s1 + s2) / 2, co = Math.cos(tm);
    const anchor = co > 0.3 ? 'start' : co < -0.3 ? 'end' : 'middle';
    const [lx, ly0] = pt(tm, 28 + (anchor === 'middle' ? 16 : 0));
    const here = locLabel(m, r), loc = zones && here && here !== main ? [here] : [];
    const es = statusOf('e:' + r.id), it = items['e:' + r.id];
    s += enzLabel(lx, ly0, it, es, anchor, 20, 'center', loc);
    const cs = cofSt(m, statusOf, r);
    if (cs !== 'none' && cs !== 'hide') {
      const lines = es === 'hide' ? 0 : hidden(es) ? 1.8 : wrap(it.name, 20).length + (r.tags || []).filter(t => t !== 'irreversible').length + loc.length;
      const ly = ly0 + Math.max(lines * 7.5, 0) + 14;
      if (hidden(cs)) s += cofBlank(lx, ly + 6, cs, anchor);
      else {
        const ct = cofText(m, r.cofactors);
        s += `<text class="coft" x="${lx}" y="${ly + 4}" text-anchor="${anchor}">${esc(ct)}</text>`;
        s += cofMark(anchor === 'end' ? lx + 12 : anchor === 'start' ? lx - 12 : lx - ct.length * 3.3 - 12, ly, cs);
      }
    }
  });
  branches.forEach(r => { if (pos[r.from] && pos[r.to]) s += drawEdge(m, statusOf, r, pos[r.from], pos[r.to], w, w); });
  for (const [id, q] of Object.entries(pos)) s += metBox(q.cx, q.cy - BH / 2, items['m:' + id], statusOf('m:' + id), w);
  const xs = Object.values(pos).map(q => q.cx), ys = Object.values(pos).map(q => q.cy);
  const W = Math.max(cx * 2, Math.max(...xs) + w / 2 + 20), H = Math.max(...ys) + BH / 2 + 80;
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} cycle diagram">${s}</svg>`;
}

// Grids (steroidogenesis): every metabolite sets pos: [column, row]; optional grid_columns headers.
function gridSVG(m, statusOf) {
  const { p, items } = m, COLW = BW + 200, ROWH = BH + 96, X0 = 24 + BW / 2 + 130, Y0 = TOP + (p.grid_columns ? 34 : 0);
  const pos = {};
  for (const [id, x] of Object.entries(p.metabolites)) { const [c, r] = x.pos || [0, 0]; pos[id] = { cx: X0 + c * COLW, cy: Y0 + r * ROWH + BH / 2 }; }
  let s = '';
  (p.grid_columns || []).forEach((label, c) => { s += `<text class="zonet" x="${X0 + c * COLW}" y="${TOP + 8}" text-anchor="middle">${esc(label)}</text>`; });
  p.reactions.forEach(r => { s += drawEdge(m, statusOf, r, pos[r.from], pos[r.to]); });
  for (const [id, q] of Object.entries(pos)) s += metBox(q.cx, q.cy - BH / 2, items['m:' + id], statusOf('m:' + id));
  const W = Math.max(...Object.values(pos).map(q => q.cx)) + BW / 2 + 24, H = Math.max(...Object.values(pos).map(q => q.cy)) + BH / 2 + 24;
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(p.name)} diagram">${s}</svg>`;
}

/* ---------- list view ---------- */
function chip(item, st) {
  const cls = st === 'peek' ? 'shown' : st;
  const ic = st === 'right' ? icon('ok') : st === 'missed' ? icon('no') : '';
  const badge = st === 'start' ? '<span class="badge">START</span>' : '';
  if (st === 'target' && INLINE) return `<form class="chip target inl" data-q="0">${inlineInput()}</form>`;
  return `<div class="chip ${cls}">${badge}${hidden(st) ? '?' : esc(item.name)}${ic}</div>`;
}
function conn(m, item, st, horiz, statusOf) {
  const r = item.rxn;
  const arr = horiz ? (r.reversible ? '⇌' : '→') : (r.reversible ? '⇅' : '↓');
  const cls = st === 'peek' ? 'shown' : st;
  const ic = st === 'right' ? icon('ok') : st === 'missed' ? icon('no') : '';
  const badge = st === 'start' ? '<span class="badge">START</span> ' : '';
  const name = st === 'target' && INLINE ? `<form class="inl" data-q="0">${inlineInput()}</form>` : hidden(st) ? '?' : esc(item.name);
  const tags = hidden(st) ? [] : (r.tags || []).filter(t => t !== 'irreversible');
  const cs = cofSt(m, statusOf, r);
  const cic = cs === 'right' ? icon('ok') : cs === 'missed' ? icon('no') : '';
  const ct = cofVisible(cs) ? esc(cofText(m, r.cofactors)) + cic
    : cs === 'target' && INLINE ? `<form class="inl" data-q="0">${inlineInput()}</form>`
    : hidden(cs) ? `<span class="ename ${cs}">?</span>` : '';
  const extra = [ct, (r.also_to || []).length ? 'splits in two' : '', (r.also_from || []).length ? 'joins two' : '', r.branch ? 'side step' : '', r.transport ? 'transport' : '', ...tags].filter(Boolean).join(' · ');
  return `<div class="conn"><span class="arr" aria-label="${r.reversible ? 'reversible' : 'one-way'}">${arr}</span><div class="meta"><span class="ename ${cls}">${badge}${name} ${ic}</span>${extra ? `<span class="cofs">${extra}</span>` : ''}</div></div>`;
}
function listHTML(m, statusOf, { horiz = false, zones = true } = {}) {
  let lastLoc = null;
  const parts = m.seq.map(k => {
    const it = m.items[k], st = statusOf(k);
    if (it.kind === 'cof') return '';
    let row = '';
    if (zones && it.rxn) { const l = locLabel(m, it.rxn); if (l && l !== lastLoc) row = `<div class="locrow">${esc(l)}</div>`; lastLoc = l || lastLoc; }
    return row + listPart(m, it, st, horiz, statusOf);
  });
  if (m.p.circular) parts.push(`<div class="conn"><span class="arr">↺</span><div class="meta"><span class="cofs">back to the start</span></div></div>`);
  return `<div class="list ${horiz ? 'h' : 'v'}">${parts.join('')}</div>`;
}
function listPart(m, it, st, horiz, statusOf) {
  {
    if (it.kind !== 'met' && st === 'hide') return conn(m, { ...it, name: '' }, 'shown', horiz, statusOf);
    return it.kind === 'met' ? chip(it, st) : conn(m, it, st, horiz, statusOf);
  }
}

<script>
/* Per-item answer history, keyed per pathway:
   m:<met>  e:<reaction> (enzyme)  c:<reaction> (cofactors)  d:<reaction> (direction)
   r:/p:<reaction> (reactants / products, enzyme-given)  w:<reaction> (which pathway) */
'use strict';

const Stats = {
  of(pid) { return (Store.data.stats[pid] = Store.data.stats[pid] || {}); },
  record(pid, key, ok) {
    const s = this.of(pid), e = (s[key] = s[key] || { n: 0, miss: 0 });
    e.n++; if (!ok) e.miss++; e.last = Date.now();
    Store.save();
  },
  // Smoothed miss rate: unseen items sit at 0.5 so new material still comes up.
  rate(pid, key) { const e = Store.data.stats[pid]?.[key]; return e ? (e.miss + 0.5) / (e.n + 1) : 0.5; },
  reset(pid) { if (pid) delete Store.data.stats[pid]; else Store.data.stats = {}; Store.save(); },
  // First-try accuracy over everything answered in a pathway, or null if nothing yet.
  accuracy(pid) {
    const s = Store.data.stats[pid];
    if (!s) return null;
    let n = 0, miss = 0;
    for (const e of Object.values(s)) { n += e.n; miss += e.miss; }
    return n ? { n, pct: Math.round(100 * (n - miss) / n) } : null;
  },
  rows(p) {
    const s = Store.data.stats[p.id] || {}, out = [];
    const mn = id => p.metabolites[id]?.short || p.metabolites[id]?.name || id;
    for (const [key, e] of Object.entries(s)) {
      const [t, id] = key.split(':');
      let label, kind;
      if (t === 'm') { if (!p.metabolites[id]) continue; label = p.metabolites[id].name; kind = 'Metabolite'; }
      else {
        const r = p.reactions.find(x => x.id === id); if (!r) continue;
        const en = p.enzymes[r.enzyme]?.name || r.enzyme, pair = `${mn(r.from)} → ${mn(r.to)}`;
        ({ e: () => { label = en; kind = 'Enzyme'; },
          c: () => { label = `${en}: cofactors`; kind = 'Cofactors'; },
          d: () => { label = `${pair}: direction`; kind = 'Direction'; },
          r: () => { label = `${en}: reactants`; kind = 'Reactants'; },
          p: () => { label = `${en}: products`; kind = 'Products'; },
          w: () => { label = `${en}: pathway`; kind = 'Pathway'; },
          l: () => { label = `${en}: location`; kind = 'Location'; } })[t]?.();
        if (!label) continue;
      }
      out.push({ pid: p.id, pname: p.name, key, label, kind, n: e.n, miss: e.miss, rate: e.miss / e.n, last: e.last || 0 });
    }
    return out.sort((a, b) => b.rate - a.rate || b.miss - a.miss || a.label.localeCompare(b.label));
  },
  worst(limit = 8) {
    return Object.values(Library.all()).flatMap(p => this.rows(p)).filter(r => r.miss > 0)
      .sort((a, b) => b.rate - a.rate || b.miss - a.miss || b.last - a.last).slice(0, limit);
  },
};

function statsTableHTML(rows, { showPathway = false } = {}) {
  if (!rows.length) return '<p class="muted">Nothing missed yet. Answers you miss or reveal show up here.</p>';
  return `<div class="tablewrap"><table class="stats"><thead><tr><th>Item</th>${showPathway ? '<th>Pathway</th>' : ''}<th>Type</th><th class="num">Missed</th><th>Miss rate</th></tr></thead><tbody>${rows.map(r => `
    <tr><td>${esc(r.label)}</td>${showPathway ? `<td class="muted">${esc(r.pname)}</td>` : ''}<td class="muted">${r.kind}</td><td class="num">${r.miss} / ${r.n}</td>
    <td><span class="bar" role="img" aria-label="${Math.round(r.rate * 100)} percent missed"><span style="width:${Math.round(r.rate * 100)}%"></span></span><span class="pct">${Math.round(r.rate * 100)}%</span></td></tr>`).join('')}</tbody></table></div>`;
}

<script>
/* Pathway editor: build or change a pathway with a live diagram preview.
   Built-in pathways are never overwritten — saving one stores an edited copy under the same id ("Reset" removes it).
   Export / Import move a pathway between people as a .json file. */
'use strict';

const LOCS = ['cytosol', 'mitochondria', 'mitochondrial matrix', 'ER', 'peroxisome', 'lysosome', 'nucleus'];
const E = { draft: null, origId: null, json: false, err: '' };

function blankPathway() {
  return { id: '', name: 'New pathway', group: 'Mine', summary: '', circular: false, multiplier_label: '',
    metabolites: {}, enzymes: {}, reactions: [], cofactors: {}, distractors: { metabolites: [], enzymes: [] } };
}
function openEditor(id, draft) {
  if (id && !Library.get(id)) { location.replace('#/pathways'); return; }
  E.draft = draft || (id ? clone(Library.get(id)) : blankPathway());
  E.draft.cofactors = E.draft.cofactors || {};
  E.draft.distractors = Object.assign({ metabolites: [], enzymes: [] }, E.draft.distractors);
  E.origId = draft ? null : id;
  E.json = false;
  E.pending = null;
  $('#view').innerHTML = '<section id="editor" class="editor page"></section>';
  renderEditor();
}
// Leave the editor for a page: the pathway itself, or the library when there is none.
function closeEditor(id = E.origId) {
  E.draft = null;
  location.hash = id && Library.get(id) ? `#/pathways/${encodeURIComponent(id)}` : '#/pathways';
}
function exportPathway(p) {
  // Downloads are blocked inside shared artifacts, so Export shows the JSON to copy, with a file download as the extra.
  const name = (p.id || slug(p.name)) + '.json', text = JSON.stringify(p, null, 2), canSave = !window.PATHWAYS_ARTIFACT;
  ask({ title: `Export ${p.name}`, text: `Copy this and send it${canSave ? ` (or save it as ${name})` : ''}. To add it, open Pathways → Import, or New pathway → JSON and paste.`, input: 'area', value: text, ok: canSave ? 'Download file' : 'Done', cancel: canSave ? 'Close' : null, copy: true })
    .then(v => v && canSave && download(name, text));
}

/* ---------- helpers ---------- */
const edCof = () => Object.assign({}, Library.sharedCof(), E.draft.cofactors);
const metOpts = (sel, blank = '— choose —') => `<option value="">${blank}</option>` + Object.entries(E.draft.metabolites).map(([id, m]) =>
  `<option value="${esc(id)}"${id === sel ? ' selected' : ''}>${esc(m.name || id)}</option>`).join('') + '<option value="__new">+ New metabolite…</option>';
const enzOpts = sel => '<option value="">— choose —</option>' + Object.entries(E.draft.enzymes).map(([id, e]) =>
  `<option value="${esc(id)}"${id === sel ? ' selected' : ''}>${esc(e.name || id)}</option>`).join('') + '<option value="__new">+ New enzyme…</option>';
const listStr = a => (a || []).join(', ');
const parseList = v => v.split(',').map(x => x.trim()).filter(Boolean);
function cofStr(ids) { const c = edCof(); return (ids || []).map(id => c[id]?.name || id).join(', '); }
function parseCof(v) {
  const { map } = cofLookup(edCof()), out = [];
  for (const t of parseList(v)) {
    let id = map[norm(t)];
    if (!id) { id = uniqueId(slug(t), new Set(Object.keys(edCof()))); E.draft.cofactors[id] = { name: t, aliases: [] }; }
    out.push(id);
  }
  return out;
}
function pruneCof(p) {
  const used = new Set(p.reactions.flatMap(r => [...(r.cofactors?.in || []), ...(r.cofactors?.out || [])]));
  for (const id of Object.keys(p.cofactors || {})) if (!used.has(id)) delete p.cofactors[id];
}
function newItem(kind, name) {
  const coll = kind === 'met' ? E.draft.metabolites : E.draft.enzymes;
  const id = uniqueId(slug(name).slice(0, 24), new Set(Object.keys(coll)));
  coll[id] = { name, short: '', aliases: [], notes: '' };
  return id;
}
function newReactionId() { return uniqueId('r' + (E.draft.reactions.length + 1), new Set(E.draft.reactions.map(r => r.id))); }

/* ---------- render ---------- */
function itemRows(kind) {
  const coll = kind === 'met' ? E.draft.metabolites : E.draft.enzymes, base = kind === 'met' ? 'metabolites' : 'enzymes';
  const rows = Object.entries(coll).map(([id, it]) => `
    <div class="ed-item">
      <label>Name<input data-path="${base}.${esc(id)}.name" value="${esc(it.name)}"></label>
      <label>Abbreviation<input data-path="${base}.${esc(id)}.short" value="${esc(it.short)}"></label>
      <label class="wide">Also accept (comma-separated)<input data-path="${base}.${esc(id)}.aliases" data-list value="${esc(listStr(it.aliases))}"></label>
      ${kind === 'met' && E.draft.layout === 'grid' ? `<label>Column<input type="number" min="0" data-gridpos="${esc(id)}" data-axis="0" value="${esc(it.pos?.[0] ?? 0)}"></label><label>Row<input type="number" min="0" data-gridpos="${esc(id)}" data-axis="1" value="${esc(it.pos?.[1] ?? 0)}"></label>` : ''}
      <label class="full">Facts shown after answering<textarea rows="2" data-path="${base}.${esc(id)}.notes">${esc(it.notes)}</textarea></label>
      <button class="btn ghost small" data-ed="del-${kind}" data-id="${esc(id)}">Remove</button>
    </div>`).join('');
  return rows || `<p class="muted">None yet — add one here or from a step's menus.</p>`;
}
function sideChips(r, i, key) {
  const chips = (r[key] || []).map(s => `<span class="pillx">${esc(E.draft.metabolites[s]?.name || s)}<button data-ed="unside" data-i="${i}" data-key="${key}" data-id="${esc(s)}" aria-label="Remove">×</button></span>`).join('');
  return `${chips}<select data-ed-add="${key}" data-i="${i}" class="small">${metOpts('', key === 'also_to' ? '+ side product' : '+ side input')}</select>`;
}
function stepCards() {
  const n = E.draft.reactions.length;
  return E.draft.reactions.map((r, i) => `
    <div class="ed-step${r.branch ? ' branch' : ''}">
      <div class="ed-step-h"><b>${r.branch ? 'Side step' : 'Step'} ${i + 1}</b>
        <span><button class="btn ghost small" data-ed="up" data-i="${i}" ${i ? '' : 'disabled'} aria-label="Move up">↑</button><button class="btn ghost small" data-ed="down" data-i="${i}" ${i < n - 1 ? '' : 'disabled'} aria-label="Move down">↓</button><button class="btn ghost small" data-ed="del-step" data-i="${i}">Remove</button></span></div>
      <div class="ed-grid">
        <label>From<select data-path="reactions.${i}.from">${metOpts(r.from)}</select></label>
        <label>${r.transport ? 'Transporter' : 'Enzyme'}<select data-path="reactions.${i}.enzyme">${enzOpts(r.enzyme)}</select></label>
        <label>To<select data-path="reactions.${i}.to">${metOpts(r.to)}</select></label>
        <label class="cb"><input type="checkbox" data-path="reactions.${i}.reversible" ${r.reversible ? 'checked' : ''}> Reversible</label>
        <label class="cb"><input type="checkbox" data-path="reactions.${i}.branch" ${r.branch ? 'checked' : ''}> Side step (off the main line)</label>
        <label class="cb"><input type="checkbox" data-path="reactions.${i}.transport" ${r.transport ? 'checked' : ''}> Transport (crosses a membrane)</label>
        <label>Cofactors in<input data-cof="in" data-i="${i}" value="${esc(cofStr(r.cofactors?.in))}" placeholder="e.g. ATP"></label>
        <label>Cofactors out<input data-cof="out" data-i="${i}" value="${esc(cofStr(r.cofactors?.out))}" placeholder="e.g. ADP"></label>
        <label>Compartment<input data-path="reactions.${i}.loc" list="locList" value="${esc(r.loc || '')}" placeholder="e.g. mitochondria"></label>
        <label>Tissue (if not the pathway's)<input data-path="reactions.${i}.tissue" value="${esc(r.tissue || '')}" placeholder="e.g. small intestine"></label>
        <label>Runs ×<input type="number" min="1" max="9" data-path="reactions.${i}.multiplier" value="${esc(r.multiplier || 1)}"></label>
        <label>Tags<input data-path="reactions.${i}.tags" data-list value="${esc(listStr(r.tags))}" placeholder="rate-limiting, irreversible"></label>
        <label>Requires<input data-path="reactions.${i}.requires" data-list value="${esc(listStr(r.requires))}" placeholder="e.g. B6 (PLP)"></label>
        <div class="full side"><span class="muted">Side products:</span> ${sideChips(r, i, 'also_to')}</div>
        <div class="full side"><span class="muted">Side inputs:</span> ${sideChips(r, i, 'also_from')}</div>
      </div>
    </div>`).join('') || '<p class="muted">No steps yet.</p>';
}
// A combined pathway only names its parts; everything else is merged from them (see composePathway).
function composeForm(p) {
  const groups = {};
  for (const x of Library.atomic()) (groups[x.group || 'Other'] = groups[x.group || 'Other'] || []).push(x);
  return `<section class="card ed-sec"><h3>Basics</h3><div class="ed-grid">
      <label class="wide">Name<input data-path="name" value="${esc(p.name)}"></label>
      <label>Group<input data-path="group" value="${esc(p.group || '')}" list="groupList"></label>
      <label class="full">Summary<textarea rows="3" data-path="summary">${esc(p.summary || '')}</textarea></label></div></section>
    <section class="card ed-sec"><h3>Combine these pathways</h3>
      <p class="muted">The first one you tick is the main line; matching steps are drawn once, and the others' own steps are added alongside. Edits to the parts show up here automatically.</p>
      ${p.compose.length ? `<p><b>Order:</b> ${p.compose.map(id => esc(Library.get(id)?.name || id)).join(' → ')}</p>` : ''}
      ${Object.entries(groups).map(([g, ps]) => `<div class="pgroup"><span class="glabel">${esc(g)}</span><div class="chips">${ps.map(x =>
        `<label class="cb"><input type="checkbox" data-compose="${esc(x.id)}" ${p.compose.includes(x.id) ? 'checked' : ''}> ${esc(x.name)}</label>`).join('')}</div></div>`).join('')}
    </section>`;
}
function renderEditor() {
  const p = E.draft, st = E.origId ? Library.status(E.origId) : 'new';
  if (!$('#editor')) return;
  const focus = document.activeElement && $('#editor').contains(document.activeElement)
    ? { path: document.activeElement.dataset.path, cof: document.activeElement.dataset.cof, i: document.activeElement.dataset.i, pos: document.activeElement.selectionStart } : null;
  $('#editor').innerHTML = `
  <div class="ed-bar">
    <h2>${st === 'new' ? 'New pathway' : 'Edit · ' + esc(p.name)}</h2>
    <div class="actions" style="margin:0">
      <button class="btn primary" data-ed="save">Save</button>
      <button class="btn" data-ed="cancel">Cancel</button>
      <button class="btn ghost" data-ed="export">Export</button>
      <button class="btn ghost" data-ed="import">Import</button>
      <button class="btn ghost" data-ed="json" aria-pressed="${E.json}">JSON</button>
      ${st === 'edited' ? '<button class="btn ghost" data-ed="reset">Reset to built-in</button>' : ''}
      ${st === 'custom' ? '<button class="btn ghost" data-ed="delete">Delete</button>' : ''}
    </div>
  </div>
  <p class="muted">${Store.mode === 'server' ? 'Saves to the Pathways server.' : 'Saves in this browser. Export to keep a copy or send it to someone — they Import it.'} ${st === 'builtin' ? 'This is a built-in pathway: saving keeps your copy alongside it, and Reset brings the original back.' : ''}</p>
  <div class="ed-cols">
    <div class="ed-form">
      ${p.compose ? composeForm(p) : E.json ? `<section class="card ed-sec"><h3>Pathway JSON</h3><textarea id="edJson" rows="30" spellcheck="false">${esc(JSON.stringify(p, null, 2))}</textarea>
        <div class="actions"><button class="btn primary" data-ed="apply-json">Apply</button></div></section>` : `
      <section class="card ed-sec"><h3>Basics</h3>
        <div class="ed-grid">
          <label class="wide">Name<input data-path="name" value="${esc(p.name)}"></label>
          <label>Group<input data-path="group" value="${esc(p.group || '')}" list="groupList"></label>
          <label class="full">Summary (shown above the diagram)<textarea rows="2" data-path="summary">${esc(p.summary)}</textarea></label>
          <label>Layout<select data-layout>${[['line', 'Line'], ['cycle', 'Cycle (last step returns to the start)'], ['grid', 'Grid (place each metabolite)']].map(([v, l]) => `<option value="${v}"${(p.layout === 'grid' ? 'grid' : p.circular ? 'cycle' : 'line') === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label>
          <label class="wide">Where it runs<input data-path="tissue" value="${esc(p.tissue || '')}" placeholder="e.g. liver, kidney"></label>
          <label>“Runs ×” label<input data-path="multiplier_label" value="${esc(p.multiplier_label || '')}" placeholder="per glucose"></label>
          ${p.layout === 'grid' ? `<label class="full">Column headings (comma-separated)<input data-path="grid_columns" data-list value="${esc(listStr(p.grid_columns))}"></label>` : ''}
        </div></section>
      <section class="card ed-sec"><div class="ed-sec-h"><h3>Steps, in order</h3><button class="btn small" data-ed="add-step">+ Add step</button></div>${stepCards()}
        ${E.draft.reactions.length ? '<div class="actions"><button class="btn small" data-ed="add-step">+ Add step</button></div>' : ''}</section>
      <section class="card ed-sec"><div class="ed-sec-h"><h3>Metabolites</h3><button class="btn small" data-ed="add-met">+ Add</button></div>${itemRows('met')}</section>

<script>
/* The quiz page (#/quiz): one focused screen per quiz.

'use strict';

/* ---------- elements: show / quiz / hide ---------- */
function modeKeyOf(cfg) { return cfg.mode === 'step' ? (cfg.given === 'enz' ? 'stepE' : 'stepM') : 'occ'; }
function elSpecFor(cfg) {
  return {
    occ: [['met', 'Metabolites', ['show', 'quiz']], ['enz', 'Enzymes', ['show', 'quiz', 'hide']], ['trn', 'Transporters', ['show', 'quiz', 'hide']], ['cof', 'Cofactors', ['show', 'quiz', 'hide']], ['loc', 'Locations', ['show', 'hide']]],
    stepM: [['enz', 'Enzyme or transporter', ['show', 'quiz', 'hide']], ['cof', 'Cofactors', ['show', 'quiz', 'hide']], ['dir', 'Direction', ['show', 'quiz']], ['loc', 'Location', ['show', 'quiz', 'hide']]],
    stepE: [['met', 'Reactants & products', ['show', 'quiz']], ['cof', 'Cofactors', ['show', 'quiz', 'hide']], ['loc', 'Location', ['show', 'quiz', 'hide']], ['path', 'Pathway', ['show', 'quiz', 'hide']]],
  }[modeKeyOf(cfg)];
}
function elOf(cfg, k) {

// Enzyme slots ('e:<reaction>') are transporters when the step moves something across a membrane.
const kindOf = (key, m = Q.m) => (key[0] === 'e' ? m?.items[key]?.kind || 'enz' : { m: 'met', c: 'cof' }[key[0]]);

const viewStyle = () => Q.cfg.view || Store.settings.view;
function quizSummary(cfg) {

/* ---------- questions ---------- */
function mcOptions(item, m) {

function cofOptions(r, m) {

    { v: 'up', label: `${B} → ${A}`, sub: 'one-way, bottom to top' },

}
function metSetQ(r, m, side) {

  const t = metNames(m, want);

    placeholder: 'e.g. mitochondria',

function newRound() {

/* ---------- grading ---------- */

/* ---------- diagram status ---------- */

    return R.q.status === 'open' ? 'target' : R.q.status;

  const a = y1 + BH + 4, b = y2 - 4, mid = (a + b) / 2;

  else s += r.reversible ? arrow(cx, a, cx, b, true) : down ? arrow(cx, a, cx, b, false) : arrow(cx, b, cx, a, false);

function renderQuiz() {
  const V = $('#view');
  if (!Q.cfg) { location.hash = '#/'; return; }
  const R = Q.round;
  const occ = R.type === 'single' || R.type === 'total';
  const cq = occ && R.q;
  INLINE = cq && ['type', 'along'].includes(answerStyle()) && cq.status === 'open' ? { draft: cq.draft, bad: cq.justWrong, along: cq.along } : null;
  if (cq) cq.inline = !!INLINE;
  const flow = viewStyle() === 'flow', horiz = Store.settings.dir === 'h';
  const sub = R.type === 'stepE' && el('path') !== 'show' && Q.models.length > 1 ? `${Q.models.length} pathways` : esc(Q.m.p.name) + (Q.models.length > 1 && R.type !== 'stepE' ? ` <span class="muted">· ${Q.models.length} in this quiz</span>` : '');
  const progress = R.type === 'total' && !R.done ? `<span class="prog">${R.pos + 1} / ${R.order.length}</span>` : '';

  let stage = '', dock = '', below = '';
  if (R.type === 'none') {
    stage = `<div class="empty">${mi('tune')}<p>Nothing is set to <b>Quiz</b>. Go back and pick at least one element to quiz.</p><a class="btn primary" href="#/">Back to setup</a></div>`;
  } else if (occ) {
    const zones = el('loc') !== 'hide';
    stage = flow ? flowSVG(Q.m, statusOf, { zones }) : listHTML(Q.m, statusOf, { horiz, zones });
    dock = occDock();
  } else {
    stage = R.type === 'step' ? (flow ? stepFlow() : stepList()) : (flow ? stepEFlow() : stepEList());
    below = stepPanel();
  }
  V.innerHTML = `<div class="quiz ${occ ? 'occ' : 'steps'}">
    <header class="qbar">
      <a class="iconbtn" href="#/" title="Back to home" aria-label="Back to home">${mi('arrow_back')}</a>
      <div class="qtitle"><div class="qname">${esc(Q.cfg.name)}</div><div class="qsub">${sub}</div></div>
      ${progress}
      <span class="qscore" title="Right on the first try">${mi('check', 'sm')} ${Q.score.right}<span class="muted"> / ${Q.score.total}</span></span>
      <div class="qtools">${R.type !== 'none' && flow ? zoomBarHTML() : ''}${optionsHTML()}</div>
    </header>
    <div class="stage" id="stage">${stage}</div>
    ${below}${dock}
  </div>`;
  if (INLINE && cq.justWrong) $('#stage form.inl input')?.classList.add('shake');
  applyZoom();
  followTarget();
  const inp = $('#stage input.ans') || $('#view .ansform input');
  if (inp && (!matchMedia('(hover: none)').matches || inp.closest('#stage'))) { inp.focus({ preventScroll: true }); inp.select(); }

}

      <div class="dock-actions">${more ? `<button class="btn primary" data-act="nextpath">${mi('skip_next')} Next: ${esc(R.queue[0].p.name)}</button>` : ''}

  }
