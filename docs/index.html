 fructose-1,6-bisphosphatase (rate-limiting), glucose-6-phosphatase. Muscle can't release glucose (no glucose-6-phosphatase).", "metabolites": {"pyruvate": {"name": "Pyruvate", "short": "Pyr", "aliases": ["pyruvic acid"], "notes": "Comes from lactate (Cori cycle, LDH) and alanine (ALT)."}, "oaa": {"name": "Oxaloacetate", "short": "OAA", "aliases": ["oxaloacetic acid"], "notes": "Made in mitochondria; leaves as malate (or aspartate) and is re-formed in the cytosol."}, "pep": {"name": "Phosphoenolpyruvate", "short": "PEP", "aliases": []}, "pg2": {"name": "2-Phosphoglycerate", "short": "2-PG", "aliases": [], "nicknames": ["2PGA"]}, "pg3": {"name": "3-Phosphoglycerate", "short": "3-PG", "aliases": [], "nicknames": ["3PGA"]}, "bpg13": {"name": "1,3-Bisphosphoglycerate", "short": "1,3-BPG", "aliases": ["1,3-diphosphoglycerate"]}, "g3p": {"name": "Glyceraldehyde-3-phosphate", "short": "G3P", "aliases": [], "nicknames": ["GAP", "GA3P"]}, "dhap": {"name": "Dihydroxyacetone phosphate", "short": "DHAP", "aliases": [], "notes": "Glycerol (from triglycerides) enters here: glycerol → glycerol-3-phosphate → DHAP."}, "f16bp": {"name": "Fructose-1,6-bisphosphate", "short": "F1,6BP", "aliases": ["fructose-1,6-diphosphate"], "nicknames": ["FBP"]}, "f6p": {"name": "Fructose-6-phosphate", "short": "F6P", "aliases": []}, "g6p": {"name": "Glucose-6-phosphate", "short": "G6P", "aliases": []}, "glucose": {"name": "Glucose", "short": "Glc", "aliases": ["D-glucose"]}}, "enzymes": {"pc": {"name": "Pyruvate carboxylase", "short": "PC", "aliases": [], "notes": "Mitochondrial; needs biotin. Activated by acetyl-CoA (fatty acid oxidation signals 'make glucose'). First bypass of pyruvate kinase."}, "pepck": {"name": "PEP carboxykinase", "short": "PEPCK", "aliases": ["phosphoenolpyruvate carboxykinase"], "nicknames": ["PEP carboxykinase"], "notes": "Uses GTP. Induced by glucagon and cortisol. Second half of the pyruvate kinase bypass."}, "enolase": {"name": "Enolase", "short": "", "aliases": [], "notes": "Shared with glycolysis; runs in reverse here."}, "pgm": {"name": "Phosphoglycerate mutase", "short": "PGM", "aliases": [], "nicknames": ["PGAM"], "notes": "Shared with glycolysis."}, "pgk": {"name": "Phosphoglycerate kinase", "short": "PGK", "aliases": [], "notes": "Shared with glycolysis; consumes ATP in this direction."}, "gapdh": {"name": "Glyceraldehyde-3-phosphate dehydrogenase", "short": "GAPDH", "aliases": [], "nicknames": ["G3PDH"], "notes": "Shared with glycolysis; consumes NADH in this direction."}, "tpi": {"name": "Triose phosphate isomerase", "short": "TPI", "aliases": ["triosephosphate isomerase"], "nicknames": ["TIM"], "notes": "Makes the DHAP that aldolase joins to G3P."}, "aldolase": {"name": "Aldolase", "short": "", "aliases": ["aldolase A", "aldolase B", "fructose-bisphosphate aldolase"], "notes": "Joins DHAP + G3P into fructose-1,6-bisphosphate."}, "fbp1": {"name": "Fructose-1,6-bisphosphatase", "short": "F-1,6-BPase", "aliases": ["fructose 1,6-bisphosphatase", "fructose bisphosphatase"], "nicknames": ["FBPase", "FBPase-1"], "notes": "Rate-limiting. Inhibited by AMP and fructose-2,6-bisphosphate; activated by citrate. Bypass of PFK-1."}, "pgi": {"name": "Phosphoglucose isomerase", "short": "PGI", "aliases": ["glucose-6-phosphate isomerase", "phosphohexose isomerase"], "nicknames": ["GPI"], "notes": "Shared with glycolysis."}, "g6pase": {"name": "Glucose-6-phosphatase", "short": "G6Pase", "aliases": ["glucose 6-phosphatase"], "notes": "In the ER lumen of liver and kidney (not muscle). Deficiency = von Gierke disease (type I glycogen storage): severe fasting hypoglycemia, lactic acidosis, hepatomegaly, hyperuricemia, hypertriglyceridemia."}}, "reactions": [{"id": "r1", "enzyme": "pc", "from": "pyruvate", "to": "oaa", "reversible": false, "cofactors": {"in": ["atp", "hco3"], "out": ["adp", "pi"]}, "multiplier": 2, "loc": "mitochondria", "tags": ["irreversible"], "requires": ["Biotin (B7)"]}, {"id": "r2", "enzyme": "pepck", "from": "oaa", "to": "pep", "reversible": false, "cofactors": {"in": ["gtp"], "out": ["gdp", "co2"]}, "multiplier": 2, "loc": "cytosol", "tags": ["irreversible"]}, {"id": "r3", "enzyme": "enolase", "from": "pep", "to": "pg2", "reversible": true, "cofactors": {"in": ["h2o"], "out": []}, "multiplier": 2, "loc": "cytosol"}, {"id": "r4", "enzyme": "pgm", "from": "pg2", "to": "pg3", "reversible": true, "cofactors": {"in": [], "out": []}, "multiplier": 2, "loc": "cytosol"}, {"id": "r5", "enzyme": "pgk", "from": "pg3", "to": "bpg13", "reversible": true, "cofactors": {"in": ["atp"], "out": ["adp"]}, "multiplier": 2, "loc": "cytosol"}, {"id": "r6", "enzyme": "gapdh", "from": "bpg13", "to": "g3p", "reversible": true, "cofactors": {"in": ["nadh"], "out": ["nad", "pi"]}, "multiplier": 2, "loc": "cytosol"}, {"id": "r7", "enzyme": "tpi", "from": "g3p", "to": "dhap", "reversible": true, "cofactors": {"in": [], "out": []}, "branch": true, "loc": "cytosol"}, {"id": "r8", "enzyme": "aldolase", "from": "g3p", "to": "f16bp", "reversible": true, "cofactors": {"in": [], "out": []}, "also_from": ["dhap"], "loc": "cytosol"}, {"id": "r9", "enzyme": "fbp1", "from": "f16bp", "to": "f6p", "reversible": false, "cofactors": {"in": ["h2o"], "out": ["pi"]}, "loc": "cytosol", "tags": ["rate-limiting", "irreversible"]}, {"id": "r10", "enzyme": "pgi", "from": "f6p", "to": "g6p", "reversible": true, "cofactors": {"in": [], "out": []}, "loc": "cytosol"}, {"id": "r11", "enzyme": "g6pase", "from": "g6p", "to": "glucose", "reversible": false, "cofactors": {"in": ["h2o"], "out": ["pi"]}, "loc": "ER lumen", "tags": ["irreversible"], "tissue": "liver, kidney (not muscle)"}], "distractors": {"metabolites": ["Lactate", "Alanine", "Malate", "Glycerol-3-phosphate", "Glucose-1-phosphate", "Fructose-2,6-bisphosphate", "Acetyl-CoA"], "enzymes": ["Pyruvate kinase", "Phosphofructokinase-1", "Hexokinase", "Glucokinase", "Pyruvate dehydrogenase", "Lactate dehydrogenase", "Phosphofructokinase-2", "Malate dehydrogenase", "Glycerol kinase"]}, "tissue": "liver (also kidney, small intestine)", "icon": "no_meals", "color": "blue", "links": [{"at": "oaa", "to": "tca", "dir": "in"}], "lanes": ["mitochondria", "cytosol", "er"]}, "glycogen-synthesis": {"id": "glycogen-synthesis", "name": "Glycogen synthesis", "group": "Carbohydrates", "systems": ["Fundamentals", "GI"], "tags": ["Fed state", "Storage"], "aliases": ["glycogenesis"], "summary": "Liver and skeletal muscle in the fed state (insulin). Glucose-6-phosphate → glucose-1-phosphate → UDP-glucose, which glycogen synthase (rate-limiting) adds to a growing α-1,4 chain on a glycogenin primer; branching enzyme moves chain segments onto α-1,6 links. Insulin activates glycogen synthase by dephosphorylation (protein phosphatase 1); glucagon (liver) and epinephrine inactivate it by PKA phosphorylation. Branching enzyme deficiency = Andersen disease (GSD IV).", "metabolites": {"g6p": {"name": "Glucose-6-phosphate", "short": "G6P", "aliases": [], "notes": "From glucose via hexokinase (muscle) or glucokinase (liver). Also allosterically activates glycogen synthase."}, "g1p": {"name": "Glucose-1-phosphate", "short": "G1P", "aliases": []}, "udpglc": {"name": "UDP-glucose", "short": "UDP-Glc", "aliases": ["UDP glucose"], "nicknames": ["UDPG"], "notes": "The activated glucose donor; also feeds galactose metabolism and glucuronidation."}, "glycogen": {"name": "Glycogen", "short": "", "aliases": ["glycogen (n+1)", "α-1,4 glucan", "linear glycogen"], "notes": "Each UDP-glucose adds one residue by an α-1,4 bond. A new molecule needs the primer protein glycogenin."}, "branched": {"name": "Branched glycogen", "short": "", "aliases": ["α-1,6 branched glycogen", "branch point"], "notes": "Branches (α-1,6) every ~8–10 residues make glycogen compact and give many ends for fast release."}}, "enzymes": {"pgm": {"name": "Phosphoglucomutase", "short": "PGM", "aliases": [], "notes": "Reversible; the same enzyme works in glycogenolysis."}, "ugp": {"name": "UDP-glucose pyrophosphorylase", "short": "UGP", "aliases": ["glucose-1-phosphate uridylyltransferase", "UTP-glucose-1-phosphate uridylyltransferase"], "notes": "PPi is hydrolyzed by pyrophosphatase, which pulls the reaction forward."}, "gys": {"name": "Glycogen synthase", "short": "GS", "aliases": [], "notes": "Rate-limiting. Activated by insulin (dephosphorylation via PP1), G6P; inhibited by glucagon and epinephrine (PKA phosphorylation). Makes α-1,4 bonds only."}, "gbe": {"name": "Branching enzyme", "short": "", "aliases": ["glycogen branching enzyme", "glucan transferase", "1,4-α-glucan branching enzyme", "amylo-(1,4→1,6)-transglycosylase"], "notes": "Moves a block of ~6–7 residues from an α-1,4 chain onto an α-1,6 link. Deficiency = Andersen disease (GSD IV): hepatosplenomegaly, failure to thrive, early cirrhosis and death in early childhood."}}, "reactions": [{"id": "r1", "enzyme": "pgm", "from": "g6p", "to": "g1p", "reversible": true, "cofactors": {"in": [], "out": []}, "loc": "cytosol"}, {"id": "r2", "enzyme": "ugp", "from": "g1p", "to": "udpglc", "reversible": true, "cofactors": {"in": ["utp"], "out": ["ppi"]}, "loc": "cytosol"}, {"id": "r3", "enzyme": "gys", "from": "udpglc", "to": "glycogen", "reversible": false, "cofactors": {"in": [], "out": ["udp"]}, "loc": "cytosol", "tags": ["rate-limiting", "irreversible"]}, {"id": "r4", "enzyme": "gbe", "from": "glycogen", "to": "branched", "reversible": false, "cofactors": {"in": [], "out": []}, "branch": true, "loc": "cytosol"}], "distractors": {"metabolites": ["Glucose", "Fructose-6-phosphate", "UDP-galactose", "Limit dextrin", "Maltose", "Galactose-1-phosphate"], "enzymes": ["Glycogen phosphorylase", "Debranching enzyme", "Glucose-6-phosphatase", "Hexokinase", "Galactose-1-phosphate uridylyltransferase", "UDP-galactose 4-epimerase", "Phosphorylase kinase"]}, "tissue": "liver and skeletal muscle", "icon": "inventory_2", "color": "blue", "links": [{"at": "g6p", "to": "glycolysis", "dir": "in"}]}, "glycogenolysis": {"id": "glycogenolysis", "name": "Glycogenolysis", "group": "Carbohydrates", "systems": ["Fundamentals", "MSK", "GI"], "tags": ["Fasting", "Storage"], "aliases": ["glycogen breakdown", "glycogen degradation"], "summary": "Fasting (glucagon, liver) and exercise (epinephrine, AMP, Ca²⁺ in muscle). Glycogen phosphorylase (rate-limiting, needs B6) cleaves α-1,4 bonds with Pi to release glucose-1-phosphate until 4 residues from a branch (limit dextrin); debranching enzyme moves 3 of them and frees the last as glucose. Liver uses glucose-6-phosphatase to export glucose; muscle keeps G6P for glycolysis. Glycogen storage diseases: von Gierke (I, glucose-6-phosphatase), Pompe (II, lysosomal acid α-glucosidase), Cori (III, debranching enzyme), Andersen (IV, branching enzyme), McArdle (V, muscle phosphorylase), Hers (VI, liver phosphorylase).", "metabolites": {"glycogen": {"name": "Glycogen", "short": "", "aliases": [], "notes": "Pompe disease (GSD II): lysosomal acid α-glucosidase (acid maltase) deficiency — glycogen builds up in lysosomes; cardiomegaly, hypotonia, early death in the infantile form. Not part of the cytosolic pathway."}, "limit": {"name": "Limit dextrin", "short": "", "aliases": ["limit dextrins", "phosphorylase limit dextrin"], "notes": "Glycogen trimmed to 4 residues from each branch point — phosphorylase can go no closer. Accumulates in Cori disease."}, "g1p": {"name": "Glucose-1-phosphate", "short": "G1P", "aliases": []}, "g6p": {"name": "Glucose-6-phosphate", "short": "G6P", "aliases": [], "notes": "Muscle sends it into glycolysis (no glucose-6-phosphatase)."}, "glucose": {"name": "Glucose", "short": "Glc", "aliases": ["D-glucose"], "notes": "Made in the ER lumen by glucose-6-phosphatase (liver and kidney) and exported to the blood. Muscle lacks this enzyme, so its glycogen only feeds its own glycolysis."}, "glucosec": {"name": "Glucose (cytosol)", "short": "Glc", "aliases": ["free glucose", "cytosolic glucose"], "loc": "cytosol", "notes": "About 8–10% of the glucose from glycogen: the debranching enzyme frees each α-1,6 branch point as glucose, not G1P."}}, "enzymes": {"gp": {"name": "Glycogen phosphorylase", "short": "GP", "aliases": ["phosphorylase"], "notes": "Rate-limiting; needs pyridoxal phosphate (B6). Activated by phosphorylation (phosphorylase kinase ← PKA; glucagon, epinephrine), AMP and Ca²⁺ (muscle); inhibited by insulin, ATP, G6P and glucose (liver). McArdle disease (GSD V) = muscle isoform (myophosphorylase): exercise cramps, myoglobinuria, no lactate rise, second-wind phenomenon. Hers disease (GSD VI) = liver isoform: mild fasting hypoglycemia, hepatomegaly."}, "gde": {"name": "Debranching enzyme", "short": "", "aliases": ["glycogen debranching enzyme", "α-1,6-glucosidase", "alpha-1,6-glucosidase", "4-α-glucanotransferase", "amylo-α-1,6-glucosidase", "amylo-1,6-glucosidase"], "notes": "Two activities: 4-α-glucanotransferase moves 3 residues to another chain, then α-1,6-glucosidase releases the branch residue as free glucose. Deficiency = Cori disease (GSD III): like a milder von Gierke with normal lactate; limit dextrin–like structures accumulate."}, "pgm": {"name": "Phosphoglucomutase", "short": "PGM", "aliases": [], "notes": "Reversible; shared with glycogen synthesis."}, "g6pase": {"name": "Glucose-6-phosphatase", "short": "G6Pase", "aliases": ["glucose 6-phosphatase"], "notes": "ER lumen of liver and kidney, not muscle. Deficiency = von Gierke disease (GSD I): severe fasting hypoglycemia, lactic acidosis, hepatomegaly, hyperuricemia, hypertriglyceridemia, doll-like face."}}, "reactions": [{"id": "r1", "enzyme": "gp", "from": "glycogen", "to": "g1p", "reversible": false, "cofactors": {"in": ["pi"], "out": []}, "also_to": ["limit"], "loc": "cytosol", "tags": ["rate-limiting", "irreversible"], "requires": ["B6 (pyridoxal phosphate)"]}, {"id": "r2", "enzyme": "gde", "from": "limit", "to": "glucosec", "reversible": false, "cofactors": {"in": ["h2o"], "out": []}, "branch": true, "loc": "cytosol"}, {"id": "r3", "enzyme": "pgm", "from": "g1p", "to": "g6p", "reversible": true, "cofactors": {"in": [], "out": []}, "loc": "cytosol"}, {"id": "r4", "enzyme": "g6pase", "from": "g6p", "to": "glucose", "reversible": false, "cofactors": {"in": ["h2o"], "out": ["pi"]}, "loc": "ER lumen", "tags": ["irreversible"]}], "distractors": {"metabolites": ["UDP-glucose", "Fructose-6-phosphate", "Maltose", "Fructose-1-phosphate", "Lactate", "Galactose-1-phosphate"], "enzymes": ["Glycogen synthase", "Branching enzyme", "Hexokinase", "Glucokinase", "UDP-glucose pyrophosphorylase", "Lysosomal acid α-glucosidase", "Phosphofructokinase-1"]}, "tissue": "liver and skeletal muscle", "icon": "fitness_center", "color": "orange", "links": [{"at": "g6p", "to": "glycolysis", "dir": "out"}]}, "glycolysis-gluconeogenesis": {"id": "glycolysis-gluconeogenesis", "name": "Glycolysis + gluconeogenesis", "group": "Combined", "systems": ["Fundamentals"], "aliases": [], "compose": ["glycolysis", "gluconeogenesis"], "summary": "Both directions on one diagram. Shared, reversible steps are drawn once; the gluconeogenic bypasses (pyruvate carboxylase + PEPCK, fructose-1,6-bisphosphatase, glucose-6-phosphatase) curve alongside the three irreversible glycolytic steps they get around. Reciprocal regulation: fructose-2,6-bisphosphate activates PFK-1 and inhibits F-1,6-BPase; insulin favors glycolysis, glucagon gluconeogenesis.", "icon": "sync_alt", "color": "slate"}, "glycolysis": {"id": "glycolysis", "name": "Glycolysis", "group": "Carbohydrates", "systems": ["Fundamentals", "Heme"], "tags": ["Fed state", "Energy"], "aliases": ["Embden–Meyerhof pathway", "Embden-Meyerhof-Parnas pathway", "EMP"], "multiplier_label": "per glucose", "summary": "Cytosol, every cell. Glucose → 2 pyruvate, net 2 ATP + 2 NADH. Everything from glyceraldehyde-3-phosphate on runs twice per glucose. Irreversible (and regulated): hexokinase/glucokinase, PFK-1, pyruvate kinase.", "circular": false, "metabolites": {"glucose": {"name": "Glucose", "short": "Glc", "aliases": ["D-glucose"]}, "g6p": {"name": "Glucose-6-phosphate", "short": "G6P", "aliases": [], "notes": "Branch point: → pentose phosphate pathway (G6PD), → glycogen (via phosphoglucomutase to G1P), → free glucose in liver (glucose-6-phosphatase). Inhibits hexokinase."}, "f6p": {"name": "Fructose-6-phosphate", "short": "F6P", "aliases": [], "notes": "Also the substrate for PFK-2, which makes fructose-2,6-bisphosphate (the main activator of PFK-1)."}, "f16bp": {"name": "Fructose-1,6-bisphosphate", "short": "F1,6BP", "aliases": ["fructose-1,6-diphosphate"], "nicknames": ["FBP"], "notes": "Feed-forward activator of pyruvate kinase."}, "dhap": {"name": "Dihydroxyacetone phosphate", "short": "DHAP", "aliases": [], "notes": "Also reduced to glycerol-3-phosphate for triglyceride and phospholipid synthesis."}, "g3p": {"name": "Glyceraldehyde-3-phosphate", "short": "G3P", "aliases": [], "nicknames": ["GAP", "GA3P"], "notes": "Two per glucose (one from aldolase, one via TPI), so every later step runs twice."}, "bpg13": {"name": "1,3-Bisphosphoglycerate", "short": "1,3-BPG", "aliases": ["1,3-diphosphoglycerate"], "nicknames": ["1,3-DPG"], "notes": "High-energy acyl phosphate. In RBCs, bisphosphoglycerate mutase diverts it to 2,3-BPG (shifts the O₂ curve right), skipping the PGK ATP."}, "pg3": {"name": "3-Phosphoglycerate", "short": "3-PG", "aliases": ["3-phosphoglyceric acid"], "nicknames": ["3PGA"], "notes": "Precursor for serine (and from it glycine, cysteine)."}, "pg2": {"name": "2-Phosphoglycerate", "short": "2-PG", "aliases": ["2-phosphoglyceric acid"], "nicknames": ["2PGA"]}, "pep": {"name": "Phosphoenolpyruvate", "short": "PEP", "aliases": [], "notes": "Highest-energy phosphate compound in glycolysis."}, "pyruvate": {"name": "Pyruvate", "short": "Pyr", "aliases": ["pyruvic acid"], "notes": "Fates: lactate (LDH, regenerates NAD⁺), acetyl-CoA (PDH), oxaloacetate (pyruvate carboxylase), alanine (ALT)."}, "glcb": {"name": "Glucose (blood)", "short": "", "aliases": ["glucose", "blood glucose"], "notes": "Plasma glucose crosses the membrane by facilitated diffusion (GLUT) — or, in gut and kidney, by Na⁺ co-transport (SGLT)."}}, "enzymes": {"hk": {"name": "Hexokinase / Glucokinase", "short": "HK / GK", "aliases": ["hexokinase", "glucokinase", "hexokinase glucokinase", "glucokinase hexokinase"], "nicknames": ["HK", "GK"], "notes": "Hexokinase: most tissues, low Km / low Vmax, inhibited by G6P. Glucokinase: liver and pancreatic β cells, high Km / high Vmax, induced by insulin, held in the nucleus by GKRP (F6P promotes binding). Glucokinase mutations → MODY2. Gluconeogenic bypass: glucose-6-phosphatase."}, "pgi": {"name": "Phosphoglucose isomerase", "short": "PGI", "aliases": ["glucose-6-phosphate isomerase", "phosphohexose isomerase", "phosphoglucoisomerase", "glucose phosphate isomerase"], "nicknames": ["GPI"], "notes": "Aldose → ketose isomerization. Reversible."}, "pfk1": {"name": "Phosphofructokinase-1", "short": "PFK-1", "aliases": ["phosphofructokinase", "phosphofructokinase 1"], "nicknames": ["PFK"], "notes": "Rate-limiting, committed step. Activated by AMP and fructose-2,6-bisphosphate; inhibited by ATP and citrate. Gluconeogenic bypass: fructose-1,6-bisphosphatase."}, "aldolase": {"name": "Aldolase", "short": "Aldolase", "aliases": ["aldolase A", "aldolase B", "fructose-bisphosphate aldolase", "fructose bisphosphate aldolase"], "notes": "Splits one 6-carbon sugar into two trioses: DHAP + G3P. Aldolase B (liver) also cleaves fructose-1-phosphate — its deficiency is hereditary fructose intolerance."}, "tpi": {"name": "Triose phosphate isomerase", "short": "TPI", "aliases": ["triosephosphate isomerase"], "nicknames": ["TIM"], "notes": "Converts DHAP to G3P so both halves of glucose continue down the pathway. Reversible."}, "gapdh": {"name": "Glyceraldehyde-3-phosphate dehydrogenase", "short": "GAPDH", "aliases": ["glyceraldehyde phosphate dehydrogenase", "G3P dehydrogenase"], "nicknames": ["G3PDH"], "notes": "The only oxidation in glycolysis: makes NADH and adds inorganic phosphate (not from ATP) to form high-energy 1,3-BPG. Arsenate substitutes for Pi and bypasses the PGK ATP."}, "pgk": {"name": "Phosphoglycerate kinase", "short": "PGK", "aliases": [], "notes": "First substrate-level phosphorylation (2 ATP per glucose). Reversible despite the name 'kinase'."}, "pgm": {"name": "Phosphoglycerate mutase", "short": "PGM", "aliases": [], "nicknames": ["PGAM"], "notes": "Moves the phosphate from C3 to C2. Not to be confused with phosphoglucomutase (G6P ⇌ G1P, glycogen)."}, "enolase": {"name": "Enolase", "short": "Enolase", "aliases": ["phosphopyruvate hydratase"], "notes": "Dehydration (releases H₂O) creating the enol phosphate. Inhibited by fluoride."}, "pk": {"name": "Pyruvate kinase", "short": "PK", "aliases": [], "notes": "Second substrate-level phosphorylation. Activated by F1,6BP (feed-forward); inhibited by ATP and alanine; liver isoform inactivated by glucagon (PKA phosphorylation). Deficiency → hemolytic anemia (most common glycolytic enzyme defect). Gluconeogenic bypass: pyruvate carboxylase + PEPCK."}, "glut": {"name": "GLUT transporters", "short": "GLUT", "aliases": ["glucose transporter", "glucose transporters", "facilitated diffusion"], "nicknames": ["GLUT1", "GLUT2", "GLUT3", "GLUT4", "GLUT transporters"], "notes": "GLUT1: RBCs, brain, blood–brain barrier (insulin-independent). GLUT2: liver, β cells, kidney, small intestine (bidirectional, high capacity). GLUT3: neurons, placenta. GLUT4: skeletal muscle and adipose — insulin moves it to the membrane. GLUT5: fructose (intestine, sperm)."}}, "reactions": [{"id": "r0", "enzyme": "glut", "from": "glcb", "to": "glucose", "reversible": true, "branch": true, "transport": true, "cofactors": {"in": [], "out": []}, "loc": "plasma membrane"}, {"id": "r1", "enzyme": "hk", "from": "glucose", "to": "g6p", "reversible": false, "cofactors": {"in": ["atp"], "out": ["adp"]}, "tags": ["irreversible"], "loc": "cytosol"}, {"id": "r2", "enzyme": "pgi", "from": "g6p", "to": "f6p", "reversible": true, "cofactors": {"in": [], "out": []}, "loc": "cytosol"}, {"id": "r3", "enzyme": "pfk1", "from": "f6p", "to": "f16bp", "reversible": false, "cofactors": {"in": ["atp"], "out": ["adp"]}, "tags": ["rate-limiting", "irreversible"], "loc": "cytosol"}, {"id": "r4", "enzyme": "aldolase", "from": "f16bp", "to": "g3p", "also_to": ["dhap"], "reversible": true, "cofactors": {"in": [], "out": []}, "loc": "cytosol"}, {"id": "r5", "enzyme": "tpi", "from": "dhap", "to": "g3p", "reversible": true, "branch": true, "cofactors": {"in": [], "out": []}, "loc": "cytosol"}, {"id": "r6", "enzyme": "gapdh", "from": "g3p", "to": "bpg13", "reversible": true, "multiplier": 2, "cofactors": {"in": ["nad", "pi"], "out": ["nadh"]}, "loc": "cytosol"}, {"id": "r7", "enzyme": "pgk", "from": "bpg13", "to": "pg3", "reversible": true, "multiplier": 2, "cofactors": {"in": ["adp"], "out": ["atp"]}, "loc": "cytosol"}, {"id": "r8", "enzyme": "pgm", "from": "pg3", "to": "pg2", "reversible": true, "multiplier": 2, "cofactors": {"in": [], "out": []}, "loc": "cytosol"}, {"id": "r9", "enzyme": "enolase", "from": "pg2", "to": "pep", "reversible": true, "multiplier": 2, "cofactors": {"in": [], "out": ["h2o"]}, "loc": "cytosol"}, {"id": "r10", "enzyme": "pk", "from": "pep", "to": "pyruvate", "reversible": false, "multiplier": 2, "cofactors": {"in": ["adp"], "out": ["atp"]}, "tags": ["irreversible"], "loc": "cytosol"}], "distractors": {"metabolites": ["Glucose-1-phosphate", "Fructose-2,6-bisphosphate", "Fructose-1-phosphate", "2,3-Bisphosphoglycerate", "Glycerol-3-phosphate", "Lactate", "Oxaloacetate", "Acetyl-CoA", "Ribulose-5-phosphate", "Glyceraldehyde"], "enzymes": ["Glucose-6-phosphatase", "Fructose-1,6-bisphosphatase", "Phosphofructokinase-2", "Phosphoglucomutase", "Bisphosphoglycerate mutase", "Pyruvate carboxylase", "PEP carboxykinase", "Pyruvate dehydrogenase", "Lactate dehydrogenase", "Glucose-6-phosphate dehydrogenase", "Glycerol-3-phosphate dehydrogenase", "Fructokinase", "SGLT1", "GLUT5"]}, "tissue": "every cell", "icon": "call_split", "color": "orange", "links": [{"at": "pyruvate", "to": "tca", "dir": "out", "via": "as acetyl-CoA"}, {"at": "g6p", "to": "ppp", "dir": "out"}, {"at": "g6p", "to": "glycogen-synthesis", "dir": "out"}]}, "heme": {"id": "heme", "name": "Heme synthesis", "group": "Heme", "systems": ["Heme", "Skin"], "tags": ["Vitamins"], "aliases": ["porphyrin synthesis", "heme biosynthesis"], "summary": "Bone marrow (erythroid precursors) and liver. Starts and ends in mitochondria; the middle steps are cytosolic. ALA synthase is rate-limiting and repressed by heme. Lead inhibits ALA dehydratase and ferrochelatase. Each enzyme deficiency past ALA dehydratase is a porphyria.", "metabolites": {"glycine": {"name": "Glycine", "short": "Gly", "aliases": [], "notes": "Condenses with succinyl-CoA (from the TCA cycle)."}, "ala": {"name": "δ-Aminolevulinic acid", "short": "δ-ALA", "aliases": ["aminolevulinic acid", "delta-aminolevulinic acid", "5-aminolevulinate", "aminolevulinate"], "nicknames": ["ALA", "delta ALA"], "notes": "Exits the mitochondrion. Elevated in lead poisoning and acute intermittent porphyria."}, "pbg": {"name": "Porphobilinogen", "short": "PBG", "aliases": [], "notes": "Four PBG units build the tetrapyrrole. ↑ urinary PBG = acute intermittent porphyria."}, "hmb": {"name": "Hydroxymethylbilane", "short": "HMB", "aliases": ["preuroporphyrinogen"], "notes": "Linear tetrapyrrole; spontaneously cyclizes to uroporphyrinogen I without the next enzyme."}, "uro": {"name": "Uroporphyrinogen III", "short": "Uro III", "aliases": ["uroporphyrinogen", "uroporphyrinogen 3"], "notes": "↑ in porphyria cutanea tarda (urine looks tea-colored)."}, "copro": {"name": "Coproporphyrinogen III", "short": "Copro III", "aliases": ["coproporphyrinogen", "coproporphyrinogen 3"], "notes": "Re-enters the mitochondrion."}, "protogen": {"name": "Protoporphyrinogen IX", "short": "Protogen IX", "aliases": ["protoporphyrinogen", "protoporphyrinogen 9"]}, "proto": {"name": "Protoporphyrin IX", "short": "PPIX", "aliases": ["protoporphyrin", "protoporphyrin 9"], "notes": "↑ (as zinc protoporphyrin) in lead poisoning and iron deficiency."}, "heme": {"name": "Heme", "short": "Heme", "aliases": ["haem", "heme b"], "notes": "Represses ALA synthase (and hemin is given in acute porphyria attacks for that reason)."}}, "enzymes": {"alas": {"name": "ALA synthase", "short": "ALAS", "aliases": ["aminolevulinic acid synthase", "δ-aminolevulinate synthase", "delta-aminolevulinic acid synthase", "aminolevulinate synthase"], "nicknames": ["ALA synthetase", "ALA synthase"], "notes": "Rate-limiting; needs B6 (pyridoxal phosphate). Repressed by heme; induced by drugs that use cytochrome P450 (barbiturates, etc.). ALAS2 (erythroid) defects or B6 deficiency (isoniazid) → sideroblastic anemia."}, "alad": {"name": "ALA dehydratase", "short": "ALAD", "aliases": ["aminolevulinic acid dehydratase", "porphobilinogen synthase", "δ-aminolevulinate dehydratase", "delta-aminolevulinic acid dehydratase"], "nicknames": ["ALA dehydratase"], "notes": "Joins two ALA. Inhibited by lead (↑ ALA → neuro symptoms, basophilic stippling with ferrochelatase block)."}, "pbgd": {"name": "Porphobilinogen deaminase", "short": "PBGD", "aliases": ["hydroxymethylbilane synthase", "uroporphyrinogen I synthase"], "nicknames": ["PBG deaminase", "HMB synthase"], "notes": "Deficiency → acute intermittent porphyria (AD): painful abdomen, port-wine urine, polyneuropathy, psychological symptoms, precipitated by drugs/alcohol/starvation. No photosensitivity. Treat with glucose and hemin."}, "uros": {"name": "Uroporphyrinogen III synthase", "short": "UROS", "aliases": ["uroporphyrinogen III cosynthase", "uroporphyrinogen synthase", "uroporphyrinogen 3 synthase"], "notes": "Deficiency → congenital erythropoietic porphyria (Günther): severe photosensitivity, red urine and teeth."}, "urod": {"name": "Uroporphyrinogen decarboxylase", "short": "UROD", "aliases": [], "notes": "Deficiency → porphyria cutanea tarda, the most common porphyria: blistering photosensitivity, hyperpigmentation, hypertrichosis, tea-colored urine; triggered by alcohol, hepatitis C, iron overload, estrogens."}, "cpox": {"name": "Coproporphyrinogen oxidase", "short": "CPOX", "aliases": ["coproporphyrinogen III oxidase"], "notes": "Mitochondrial. Deficiency → hereditary coproporphyria."}, "ppox": {"name": "Protoporphyrinogen oxidase", "short": "PPOX", "aliases": ["protoporphyrinogen IX oxidase"], "notes": "Deficiency → variegate porphyria (acute attacks + photosensitivity)."}, "fech": {"name": "Ferrochelatase", "short": "FECH", "aliases": ["heme synthase"], "notes": "Inserts Fe²⁺. Inhibited by lead (→ ↑ zinc protoporphyrin). Deficiency → erythropoietic protoporphyria (painful, non-blistering photosensitivity)."}}, "reactions": [{"id": "r1", "enzyme": "alas", "from": "glycine", "to": "ala", "reversible": false, "cofactors": {"in": ["succoa"], "out": ["coa", "co2"]}, "loc": "mitochondria", "tags": ["rate-limiting", "irreversible"], "requires": ["B6 (pyridoxal phosphate)"]}, {"id": "r2", "enzyme": "alad", "from": "ala", "to": "pbg", "reversible": false, "cofactors": {"in": [], "out": ["h2o"]}, "loc": "cytosol", "tags": ["irreversible"], "notes": "2 ALA → PBG"}, {"id": "r3", "enzyme": "pbgd", "from": "pbg", "to": "hmb", "reversible": false, "cofactors": {"in": [], "out": ["nh3"]}, "loc": "cytosol", "tags": ["irreversible"]}, {"id": "r4", "enzyme": "uros", "from": "hmb", "to": "uro", "reversible": false, "cofactors": {"in": [], "out": ["h2o"]}, "loc": "cytosol", "tags": ["irreversible"]}, {"id": "r5", "enzyme": "urod", "from": "uro", "to": "copro", "reversible": false, "cofactors": {"in": [], "out": ["co2"]}, "loc": "cytosol", "tags": ["irreversible"]}, {"id": "r6", "enzyme": "cpox", "from": "copro", "to": "protogen", "reversible": false, "cofactors": {"in": ["o2"], "out": ["co2"]}, "loc": "mitochondria", "tags": ["irreversible"]}, {"id": "r7", "enzyme": "ppox", "from": "protogen", "to": "proto", "reversible": false, "cofactors": {"in": ["o2"], "out": []}, "loc": "mitochondria", "tags": ["irreversible"]}, {"id": "r8", "enzyme": "fech", "from": "proto", "to": "heme", "reversible": false, "cofactors": {"in": ["fe2"], "out": []}, "loc": "mitochondria", "tags": ["irreversible"]}], "distractors": {"metabolites": ["Succinyl-CoA", "Bilirubin", "Biliverdin", "Uroporphyrinogen I", "Zinc protoporphyrin", "Coproporphyrin", "Serine"], "enzymes": ["Heme oxygenase", "Biliverdin reductase", "UDP-glucuronosyltransferase", "Succinyl-CoA synthetase", "Transferrin", "Ferroportin"]}, "tissue": "bone marrow (erythroid) and liver", "icon": "bloodtype", "color": "pink", "links": [{"at": "glycine", "to": "tca", "dir": "in", "via": "succinyl-CoA joins here"}]}, "ketogenesis": {"id": "ketogenesis", "name": "Ketogenesis", "group": "Lipids", "systems": ["Fundamentals", "Endo/Repro"], "tags": ["Fasting"], "aliases": ["ketone body synthesis"], "summary": "Liver mitochondria — prolonged fasting, diabetic ketoacidosis, alcoholism (high NADH shunts OAA to malate, so acetyl-CoA piles up). The liver can't use ketones (no succinyl-CoA:3-ketoacid CoA transferase) and RBCs can't (no mitochondria). The urine nitroprusside test detects acetoacetate, not β-hydroxybutyrate.", "metabolites": {"acetylcoa": {"name": "Acetyl-CoA", "short": "AcCoA", "aliases": ["acetyl CoA"], "notes": "From β-oxidation of fatty acids. Two molecules condense in the first step."}, "aacoa": {"name": "Acetoacetyl-CoA", "short": "AcAc-CoA", "aliases": ["acetoacetyl CoA"]}, "hmgcoa": {"name": "HMG-CoA", "short": "HMG-CoA", "aliases": ["3-hydroxy-3-methylglutaryl-CoA", "β-hydroxy-β-methylglutaryl-CoA", "beta-hydroxy-beta-methylglutaryl-CoA", "hydroxymethylglutaryl-CoA"], "nicknames": ["HMG-CoA"], "notes": "Branch point: in the cytosol, HMG-CoA reductase turns it toward cholesterol."}, "acac": {"name": "Acetoacetate", "short": "AcAc", "aliases": ["acetoacetic acid"], "notes": "Detected by the nitroprusside urine test."}, "bhb": {"name": "β-Hydroxybutyrate", "short": "β-HB", "aliases": ["beta-hydroxybutyrate", "3-hydroxybutyrate", "beta hydroxybutyrate", "β-hydroxybutyric acid"], "nicknames": ["BHB"], "notes": "The main ketone in DKA (high NADH:NAD⁺ favors it) — missed by the nitroprusside test."}, "acetone": {"name": "Acetone", "short": "", "aliases": [], "notes": "Not used for fuel; exhaled → fruity breath."}}, "enzymes": {"thiolase": {"name": "Thiolase", "short": "", "aliases": ["acetoacetyl-CoA thiolase", "β-ketothiolase", "beta-ketothiolase", "acetyl-CoA acetyltransferase"], "notes": "Reversible; the last step of β-oxidation runs the other way."}, "hmgcs": {"name": "HMG-CoA synthase", "short": "HMGCS", "aliases": ["3-hydroxy-3-methylglutaryl-CoA synthase"], "nicknames": ["HMG CoA synthase"], "notes": "Rate-limiting for ketogenesis (mitochondrial isoform; a cytosolic isoform feeds cholesterol synthesis)."}, "hmgcl": {"name": "HMG-CoA lyase", "short": "HMGCL", "aliases": ["HMG CoA lyase"], "notes": "Releases acetoacetate and an acetyl-CoA."}, "bdh": {"name": "β-Hydroxybutyrate dehydrogenase", "short": "BDH", "aliases": ["beta-hydroxybutyrate dehydrogenase", "3-hydroxybutyrate dehydrogenase"], "nicknames": ["β-hydroxybutyrate DH"], "notes": "Reversible; in extrahepatic tissues it runs back to acetoacetate for use."}, "spont": {"name": "Spontaneous decarboxylation", "short": "", "aliases": ["spontaneous", "non-enzymatic", "nonenzymatic", "none", "no enzyme"], "notes": "Non-enzymatic loss of CO₂ from acetoacetate."}}, "reactions": [{"id": "r1", "enzyme": "thiolase", "from": "acetylcoa", "to": "aacoa", "reversible": true, "cofactors": {"in": ["acetylcoa"], "out": ["coa"]}, "loc": "mitochondria"}, {"id": "r2", "enzyme": "hmgcs", "from": "aacoa", "to": "hmgcoa", "reversible": false, "cofactors": {"in": ["acetylcoa", "h2o"], "out": ["coa"]}, "loc": "mitochondria", "tags": ["rate-limiting", "irreversible"]}, {"id": "r3", "enzyme": "hmgcl", "from": "hmgcoa", "to": "acac", "reversible": false, "cofactors": {"in": [], "out": ["acetylcoa"]}, "loc": "mitochondria", "tags": ["irreversible"]}, {"id": "r4", "enzyme": "bdh", "from": "acac", "to": "bhb", "reversible": true, "cofactors": {"in": ["nadh"], "out": ["nad"]}, "loc": "mitochondria"}, {"id": "r5", "enzyme": "spont", "from": "acac", "to": "acetone", "reversible": false, "cofactors": {"in": [], "out": ["co2"]}, "branch": true, "loc": "blood (spontaneous)"}], "distractors": {"metabolites": ["Malonyl-CoA", "Mevalonate", "Citrate", "Palmitoyl-CoA", "Succinyl-CoA", "Propionyl-CoA"], "enzymes": ["HMG-CoA reductase", "Acetyl-CoA carboxylase", "Carnitine acyltransferase I", "Succinyl-CoA:3-ketoacid CoA transferase", "Fatty acid synthase", "Malonyl-CoA decarboxylase"]}, "tissue": "liver", "icon": "psychology", "color": "teal", "links": [{"at": "acetylcoa", "to": "beta-oxidation", "dir": "in"}]}, "polyol": {"id": "polyol", "name": "Polyol pathway", "group": "Carbohydrates", "systems": ["Fundamentals", "Endo/Repro", "Neuro"], "aliases": ["sorbitol pathway"], "summary": "Glucose → sorbitol → fructose. Tissues with aldose reductase but little sorbitol dehydrogenase (lens, retina, Schwann cells, kidney) trap sorbitol in hyperglycemia → osmotic damage: cataracts, retinopathy, peripheral neuropathy. Liver, ovaries and seminal vesicles have both enzymes.", "metabolites": {"glucose": {"name": "Glucose", "short": "Glc", "aliases": ["D-glucose"]}, "sorbitol": {"name": "Sorbitol", "short": "", "aliases": ["glucitol"], "notes": "Osmotically active; can't cross membranes easily."}, "fructose": {"name": "Fructose", "short": "Fru", "aliases": ["D-fructose"], "notes": "Seminal vesicles use this route to supply sperm with fructose."}}, "enzymes": {"ar": {"name": "Aldose reductase", "short": "AR", "aliases": [], "notes": "High in lens, retina, Schwann cells, kidney. Also reduces galactose to galactitol."}, "sdh": {"name": "Sorbitol dehydrogenase", "short": "SORD", "aliases": ["polyol dehydrogenase"], "nickna , "short": "R5P", "aliases": [], "notes": "→ PRPP → nucleotide synthesis."}, "xu5p": {"name": "Xylulose-5-phosphate", "short": "Xu5P", "aliases": [], "notes": "Transketolase (needs thiamine/B1) moves two carbons from Xu5P to R5P → G3P + sedoheptulose-7-P; transaldolase continues to F6P. RBC transketolase activity tests for thiamine deficiency."}}, "enzymes": {"g6pd": {"name": "Glucose-6-phosphate dehydrogenase", "short": "G6PD", "aliases": ["glucose 6-phosphate dehydrogenase"], "notes": "Rate-limiting. Activated by NADP⁺ (and induced by insulin); inhibited by NADPH. G6PD deficiency (X-linked): RBCs can't regenerate reduced glutathione → hemolysis after oxidant stress (fava beans, sulfonamides, primaquine, dapsone, infection); Heinz bodies and bite cells; protects against malaria."}, "pgls": {"name": "6-Phosphogluconolactonase", "short": "6PGL", "aliases": ["lactonase", "phosphogluconolactonase", "6-phosphogluconolactonase"], "notes": "Hydrolyzes the lactone ring."}, "pgd": {"name": "6-Phosphogluconate dehydrogenase", "short": "6PGD", "aliases": ["phosphogluconate dehydrogenase"], "nicknames": ["6-phosphogluconate DH"], "notes": "Oxidative decarboxylation: the second NADPH and the CO₂."}, "rpi": {"name": "Ribose-5-phosphate isomerase", "short": "RPI", "aliases": ["phosphopentose isomerase", "ribose 5-phosphate isomerase"], "notes": "Non-oxidative, reversible."}, "rpe": {"name": "Ribulose-5-phosphate 3-epimerase", "short": "RPE", "aliases": ["ribulose 5-phosphate epimerase", "phosphopentose epimerase", "epimerase"], "notes": "Non-oxidative, reversible."}}, "reactions": [{"id": "r1", "enzyme": "g6pd", "from": "g6p", "to": "pgl", "reversible": false, "cofactors": {"in": ["nadp"], "out": ["nadph"]}, "loc": "cytosol", "tags": ["rate-limiting", "irreversible"]}, {"id": "r2", "enzyme": "pgls", "from": "pgl", "to": "pg6", "reversible": false, "cofactors": {"in": ["h2o"], "out": []}, "loc": "cytosol", "tags": ["irreversible"]}, {"id": "r3", "enzyme": "pgd", "from": "pg6", "to": "ru5p", "reversible": false, "cofactors": {"in": ["nadp"], "out": ["nadph", "co2"]}, "loc": "cytosol", "tags": ["irreversible"]}, {"id": "r4", "enzyme": "rpi", "from": "ru5p", "to": "r5p", "reversible": true, "cofactors": {"in": [], "out": []}, "loc": "cytosol"}, {"id": "r5", "enzyme": "rpe", "from": "ru5p", "to": "xu5p", "reversible": true, "cofactors": {"in": [], "out": []}, "branch": true, "loc": "cytosol"}], "distractors": {"metabolites": ["Sedoheptulose-7-phosphate", "Erythrose-4-phosphate", "Fructose-6-phosphate", "Glyceraldehyde-3-phosphate", "PRPP", "Glutathione", "Glucose-1-phosphate"], "enzymes": ["Transketolase", "Transaldolase", "Glutathione reductase", "Glutathione peroxidase", "PRPP synthetase", "Phosphoglucomutase", "Hexokinase"]}, "tissue": "liver, adrenal cortex, adipose, lactating breast, RBCs", "icon": "shield", "color": "pink", "links": [{"at": "g6p", "to": "glycolysis", "dir": "in"}, {"at": "r5p", "to": "purine-synthesis", "dir": "out", "via": "as PRPP"}]}, "propionyl-coa": {"id": "propionyl-coa", "name": "VOMIT pathway", "group": "Nitrogen & amino acids", "systems": ["Fundamentals", "Heme", "Neuro"], "tags": ["Amino acids", "Vitamins"], "aliases": ["propionyl-CoA metabolism", "propionate pathway", "propionyl-CoA to succinyl-CoA", "VOMIT"], "summary": "Mitochondria. Valine, Odd-chain fatty acids, Methionine, Isoleucine and Threonine (VOMIT) are broken down to propionyl-CoA, which is carboxylated (biotin) and rearranged (B12) into succinyl-CoA for the TCA cycle. Propionyl-CoA carboxylase deficiency → propionic acidemia; methylmalonyl-CoA mutase or B12 deficiency → methylmalonic acidemia / raised methylmalonic acid.", "metabolites": {"valine": {"name": "Valine", "short": "Val", "aliases": [], "nicknames": ["V"], "notes": "Branched-chain amino acid; its breakdown also needs branched-chain α-ketoacid dehydrogenase (deficient in maple syrup urine disease)."}, "oddfa": {"name": "Odd-chain fatty acids", "short": "", "aliases": ["odd chain fatty acids", "odd-chain fatty acid", "odd chain fatty acid", "odd-numbered fatty acids"], "nicknames": ["OCFA"], "notes": "β-oxidation of an odd-chain fatty acid ends with one propionyl-CoA (plus acetyl-CoAs)."}, "methionine": {"name": "Methionine", "short": "Met", "aliases": [], "notes": "Via SAM → homocysteine → cystathionine → α-ketobutyrate → propionyl-CoA."}, "isoleucine": {"name": "Isoleucine", "short": "Ile", "aliases": [], "notes": "Branched-chain amino acid; gives propionyl-CoA and acetyl-CoA (both glucogenic and ketogenic)."}, "threonine": {"name": "Threonine", "short": "Thr", "aliases": [], "notes": "Via α-ketobutyrate → propionyl-CoA."}, "propcoa": {"name": "Propionyl-CoA", "short": "", "aliases": ["propionyl coenzyme A", "propanoyl-CoA"], "notes": "Three-carbon acyl-CoA. Builds up in propionic acidemia."}, "dmmcoa": {"name": "D-Methylmalonyl-CoA", "short": "", "aliases": ["D methylmalonyl-CoA", "(S)-methylmalonyl-CoA", "S-methylmalonyl-CoA"], "nicknames": ["D-MM-CoA"], "notes": "The product of the carboxylase; must be converted to the L form before the mutase can use it."}, "lmmcoa": {"name": "L-Methylmalonyl-CoA", "short": "", "aliases": ["L methylmalonyl-CoA", "(R)-methylmalonyl-CoA", "R-methylmalonyl-CoA"], "nicknames": ["L-MM-CoA"], "notes": "Accumulates (and spills over as methylmalonic acid) when the mutase or B12 is lacking."}, "succoa": {"name": "Succinyl-CoA", "short": "", "aliases": ["succinyl coenzyme A"], "notes": "Enters the TCA cycle; also used for heme synthesis (with glycine)."}}, "enzymes": {"catab": {"name": "Catabolism (several steps)", "short": "", "aliases": ["catabolism", "breakdown", "degradation", "several steps", "β-oxidation and amino acid catabolism"], "notes": "Not one enzyme: each source has its own route to propionyl-CoA. Mnemonic: VOMIT."}, "pcc": {"name": "Propionyl-CoA carboxylase", "short": "PCC", "aliases": ["propionyl coenzyme A carboxylase"], "nicknames": ["propionyl-CoA carboxylase"], "notes": "Biotin-dependent (like pyruvate carboxylase and acetyl-CoA carboxylase). Deficiency → propionic acidemia: poor feeding, vomiting, hypotonia, anion gap metabolic acidosis, hyperammonemia."}, "mme": {"name": "Methylmalonyl-CoA epimerase", "short": "MCEE", "aliases": ["methylmalonyl-CoA racemase", "methylmalonyl coenzyme A epimerase", "methylmalonyl coenzyme A racemase"], "notes": "Flips D- to L-methylmalonyl-CoA."}, "mcm": {"name": "Methylmalonyl-CoA mutase", "short": "MUT", "aliases": ["methylmalonyl coenzyme A mutase"], "nicknames": ["MCM"], "notes": "Needs vitamin B12 (adenosylcobalamin). Deficiency of the enzyme or of B12 → methylmalonic acidemia; raised methylmalonic acid separates B12 deficiency from folate deficiency (both raise homocysteine)."}}, "reactions": [{"id": "r1", "enzyme": "catab", "from": "valine", "to": "propcoa", "reversible": false, "cofactors": {"in": [], "out": []}, "also_from": ["oddfa", "methionine", "isoleucine", "threonine"], "loc": "mitochondria"}, {"id": "r2", "enzyme": "pcc", "from": "propcoa", "to": "dmmcoa", "reversible": false, "cofactors": {"in": ["atp", "hco3"], "out": ["adp", "pi"]}, "requires": ["Biotin (B7)"], "tags": ["irreversible"], "loc": "mitochondria"}, {"id": "r3", "enzyme": "mme", "from": "dmmcoa", "to": "lmmcoa", "reversible": true, "cofactors": {"in": [], "out": []}, "loc": "mitochondria"}, {"id": "r4", "enzyme": "mcm", "from": "lmmcoa", "to": "succoa", "reversible": true, "cofactors": {"in": [], "out": []}, "requires": ["Vitamin B12 (adenosylcobalamin)"], "loc": "mitochondria"}], "distractors": {"metabolites": ["Malonyl-CoA", "Acetoacetyl-CoA", "Methylmalonic acid", "Leucine", "Lysine", "α-Ketoglutarate"], "enzymes": ["Pyruvate carboxylase", "Acetyl-CoA carboxylase", "Succinyl-CoA synthetase", "Branched-chain α-ketoacid dehydrogenase"]}, "tissue": "liver and most tissues", "icon": "call_split", "color": "gold", "links": [{"at": "succoa", "to": "tca", "dir": "out"}]}, "purine-synthesis": {"id": "purine-synthesis", "name": "Purine synthesis", "group": "Nucleotides", "systems": ["Fundamentals", "MSK", "Heme"], "tags": ["Drug targets"], "aliases": ["de novo purine synthesis", "purine biosynthesis", "IMP synthesis"], "summary": "Cytosol, mainly liver. The purine ring is built on ribose-5-phosphate (as PRPP): glutamine-PRPP amidotransferase is rate-limiting. Ring atoms come from glycine, aspartate, glutamine, CO₂ and two N¹⁰-formyl-THF — so folate antagonists (methotrexate, trimethoprim, sulfonamides) slow purine synthesis. IMP branches to AMP (needs GTP) and GMP (needs ATP), balancing the two. Drugs: 6-mercaptopurine/azathioprine (block de novo synthesis), mycophenolate and ribavirin (IMP dehydrogenase). Salvage by HGPRT recycles hypoxanthine and guanine; HGPRT deficiency = Lesch-Nyhan syndrome.", "metabolites": {"r5p": {"name": "Ribose-5-phosphate", "short": "R5P", "aliases": ["ribose 5-phosphate"], "notes": "From the pentose phosphate pathway."}, "prpp": {"name": "PRPP", "short": "PRPP", "aliases": ["5-phosphoribosyl-1-pyrophosphate", "phosphoribosyl pyrophosphate", "5-phosphoribosyl pyrophosphate"], "nicknames": ["PRPP"], "notes": "Shared by de novo purine and pyrimidine synthesis and by salvage (HGPRT, APRT). High PRPP drives purine overproduction and gout."}, "pra": {"name": "5-Phosphoribosylamine", "short": "PRA", "aliases": ["phosphoribosylamine", "5-phosphoribosyl-1-amine", "5-phospho-β-D-ribosylamine"], "notes": "Committed step product."}, "gar": {"name": "Glycinamide ribonucleotide", "short": "GAR", "aliases": ["glycinamide ribotide", "5′-phosphoribosylglycinamide"]}, "fgar": {"name": "Formylglycinamide ribonucleotide", "short": "FGAR", "aliases": ["formylglycinamide ribotide", "N-formylglycinamide ribonucleotide"]}, "fgam": {"name": "Formylglycinamidine ribonucleotide", "short": "FGAM", "aliases": ["formylglycinamidine ribotide"]}, "air": {"name": "5-Aminoimidazole ribonucleotide", "short": "AIR", "aliases": ["aminoimidazole ribotide", "aminoimidazole ribonucleotide"], "notes": "The five-membered (imidazole) ring is closed."}, "cair": {"name": "Carboxyaminoimidazole ribonucleotide", "short": "CAIR", "aliases": ["4-carboxy-5-aminoimidazole ribonucleotide", "carboxyaminoimidazole ribotide"]}, "saicar": {"name": "SAICAR", "short": "SAICAR", "aliases": ["succinylaminoimidazole carboxamide ribonucleotide", "N-succinylo-5-aminoimidazole-4-carboxamide ribonucleotide"], "nicknames": ["SAICAR"]}, "aicar": {"name": "AICAR", "short": "AICAR", "aliases": ["aminoimidazole carboxamide ribonucleotide", "5-aminoimidazole-4-carboxamide ribonucleotide"], "nicknames": ["ZMP", "AICAR"]}, "faicar": {"name": "FAICAR", "short": "FAICAR", "aliases": ["formamidoimidazole carboxamide ribonucleotide", "5-formamidoimidazole-4-carboxamide ribonucleotide"], "nicknames": ["FAICAR"]}, "imp": {"name": "Inosine monophosphate", "short": "IMP", "aliases": ["inosinate", "inosinic acid", "inosine 5′-monophosphate"], "notes": "First complete purine nucleotide (base: hypoxanthine). Branch point to AMP and GMP."}, "sAMP": {"name": "Adenylosuccinate", "short": "S-AMP", "aliases": ["succinyl-AMP", "adenylosuccinic acid"]}, "ampm": {"name": "Adenosine monophosphate", "short": "AMP", "aliases": ["adenylate", "adenylic acid"], "notes": "Feeds back on PRPP amidotransferase and adenylosuccinate synthetase. Degraded via adenosine deaminase (ADA deficiency → SCID) to inosine → hypoxanthine → uric acid."}, "xmp": {"name": "Xanthosine monophosphate", "short": "XMP", "aliases": ["xanthylate", "xanthylic acid"]}, "gmp": {"name": "Guanosine monophosphate", "short": "GMP", "aliases": ["guanylate", "guanylic acid"], "notes": "Feeds back on PRPP amidotransferase and IMP dehydrogenase. Degraded to guanine → xanthine → uric acid (xanthine oxidase; allopurinol, febuxostat)."}}, "enzymes": {"prps": {"name": "PRPP synthetase", "short": "PRPS", "aliases": ["ribose-phosphate pyrophosphokinase", "phosphoribosyl pyrophosphate synthetase", "ribose-phosphate diphosphokinase"], "nicknames": ["PRPP synthetase"], "notes": "Transfers pyrophosphate from ATP (ATP → AMP). Overactive PRPP synthetase (X-linked) causes uric acid overproduction and gout."}, "ppat": {"name": "Glutamine-PRPP amidotransferase", "short": "GPAT", "aliases": ["amidophosphoribosyltransferase", "glutamine phosphoribosylpyrophosphate amidotransferase"], "nicknames": ["PRPP amidotransferase", "glutamine PRPP amidotransferase"], "notes": "Rate-limiting, committed step. Inhibited by AMP, GMP and IMP; activated by PRPP. 6-Mercaptopurine (and azathioprine, its prodrug) inhibits it — 6-MP is activated by HGPRT and degraded by xanthine oxidase and TPMT, so allopurinol raises 6-MP toxicity."}, "gars": {"name": "GAR synthetase", "short": "GARS", "aliases": ["glycinamide ribonucleotide synthetase", "phosphoribosylamine-glycine ligase"], "nicknames": ["GAR synthetase"], "notes": "Adds the whole glycine molecule (C4, C5, N7)."}, "gart": {"name": "GAR transformylase", "short": "GART", "aliases": ["glycinamide ribonucleotide transformylase", "phosphoribosylglycinamide formyltransferase"], "nicknames": ["GAR transformylase"], "notes": "First of two folate-dependent steps (C8 from N¹⁰-formyl-THF). Pemetrexed inhibits it (and thymidylate synthase, DHFR)."}, "fgams": {"name": "FGAM synthetase", "short": "FGAMS", "aliases": ["formylglycinamidine ribonucleotide synthetase", "phosphoribosylformylglycinamidine synthase"], "nicknames": ["FGAM synthetase"], "notes": "Second glutamine nitrogen (N3)."}, "airs": {"name": "AIR synthetase", "short": "AIRS", "aliases": ["aminoimidazole ribonucleotide synthetase", "phosphoribosylformylglycinamidine cyclo-ligase"], "nicknames": ["AIR synthetase"], "notes": "Closes the imidazole ring."}, "airc": {"name": "AIR carboxylase", "short": "AIRC", "aliases": ["aminoimidazole ribonucleotide carboxylase", "phosphoribosylaminoimidazole carboxylase"], "nicknames": ["AIR carboxylase"], "notes": "Adds C6 from CO₂ (no biotin, unlike most carboxylases)."}, "saicars": {"name": "SAICAR synthetase", "short": "SAICARS", "aliases": ["phosphoribosylaminoimidazole-succinocarboxamide synthase"], "nicknames": ["SAICAR synthetase"], "notes": "Aspartate donates N1."}, "adsl": {"name": "Adenylosuccinate lyase", "short": "ADSL", "aliases": ["adenylosuccinase"], "notes": "Acts twice in purine synthesis (SAICAR → AICAR and adenylosuccinate → AMP), each time releasing fumarate — aspartate's nitrogen stays, its carbons leave."}, "aicart": {"name": "AICAR transformylase", "short": "AICART", "aliases": ["aminoimidazole carboxamide ribonucleotide transformylase", "phosphoribosylaminoimidazolecarboxamide formyltransferase"], "nicknames": ["AICAR transformylase"], "notes": "Second folate-dependent step (C2 from N¹⁰-formyl-THF). Methotrexate polyglutamates inhibit it."}, "impch": {"name": "IMP cyclohydrolase", "short": "", "aliases": ["inosine monophosphate cyclohydrolase"], "nicknames": ["IMP cyclohydrolase"], "notes": "Closes the six-membered ring to give IMP; bifunctional with AICAR transformylase (ATIC)."}, "adss": {"name": "Adenylosuccinate synthetase", "short": "ADSS", "aliases": ["adenylosuccinate synthase"], "notes": "Uses GTP — so GMP supply promotes AMP synthesis. Inhibited by AMP."}, "impdh": {"name": "IMP dehydrogenase", "short": "IMPDH", "aliases": ["inosine monophosphate dehydrogenase", "inosine-5′-monophosphate dehydrogenase"], "nicknames": ["IMP dehydrogenase"], "notes": "Rate-limiting for GMP. Inhibited by mycophenolate (lymphocytes depend on de novo synthesis) and ribavirin; inhibited by GMP."}, "gmps": {"name": "GMP synthetase", "short": "GMPS", "aliases": ["GMP synthase", "guanosine monophosphate synthetase"], "notes": "Uses ATP — so AMP supply promotes GMP synthesis. Glutamine donates the amino group."}}, "reactions": [{"id": "r1", "enzyme": "prps", "from": "r5p", "to": "prpp", "reversible": false, "cofactors": {"in": ["atp"], "out": ["amp"]}, "loc": "cytosol"}, {"id": "r2", "enzyme": "ppat", "from": "prpp", "to": "pra", "reversible": false, "cofactors": {"in": ["gln", "h2o"], "out": ["glu oc": "cytosol"}, {"id": "r15", "enzyme": "gmps", "from": "xmp", "to": "gmp", "reversible": false, "cofactors": {"in": ["gln", "atp", "h2o"], "out": ["glu", "amp", "ppi"]}, "branch": true, "loc": "cytosol"}], "distractors": {"metabolites": ["Orotate", "Carbamoyl phosphate", "Hypoxanthine", "Xanthine", "Uric acid", "Inosine", "Uridine monophosphate", "Dihydroorotate"], "enzymes": ["Hypoxanthine-guanine phosphoribosyltransferase", "Adenine phosphoribosyltransferase", "Xanthine oxidase", "Adenosine deaminase", "Carbamoyl phosphate synthetase II", "Ribonucleotide reductase", "Dihydrofolate reductase", "Thymidylate synthase", "Purine nucleoside phosphorylase"]}, "tissue": "liver (most cells salvage)", "icon": "genetics", "color": "blue", "links": [{"at": "r5p", "to": "ppp", "dir": "in"}]}, "pyrimidine-synthesis": {"id": "pyrimidine-synthesis", "name": "Pyrimidine synthesis", "group": "Nucleotides", "systems": ["Fundamentals", "Heme"], "tags": ["Drug targets"], "aliases": ["de novo pyrimidine synthesis", "pyrimidine biosynthesis", "UMP synthesis"], "summary": "Cytosol (one mitochondrial step). Unlike purines, the ring (orotate) is built first and then attached to PRPP. Carbamoyl phosphate synthetase II (rate-limiting, glutamine as N donor — vs CPS I in the urea cycle, which uses NH₃ and is mitochondrial) → carbamoyl aspartate → dihydroorotate → orotate (DHODH, leflunomide) → OMP → UMP (UMP synthase; deficiency = orotic aciduria). UMP → UDP → UTP → CTP; dTMP comes from dUMP via thymidylate synthase (5-FU) using methylene-THF, regenerated by DHFR (methotrexate, trimethoprim, pyrimethamine). Ribonucleotide reductase (hydroxyurea) makes the deoxy forms.", "metabolites": {"glutamine": {"name": "Glutamine", "short": "Gln", "aliases": [], "notes": "Donates the nitrogen for carbamoyl phosphate (CPS II), unlike CPS I which uses free NH₃."}, "carbp": {"name": "Carbamoyl phosphate", "short": "CP", "aliases": ["carbamoyl-P", "carbamoylphosphate"], "notes": "Also made by CPS I for the urea cycle. In OTC deficiency, mitochondrial carbamoyl phosphate spills into this pathway → orotic aciduria with hyperammonemia."}, "carbasp": {"name": "Carbamoyl aspartate", "short": "", "aliases": ["N-carbamoyl aspartate", "N-carbamoylaspartate", "carbamoylaspartate", "ureidosuccinate"]}, "dho": {"name": "Dihydroorotate", "short": "DHO", "aliases": ["dihydroorotic acid"], "notes": "The pyrimidine ring is closed."}, "orotate": {"name": "Orotate", "short": "", "aliases": ["orotic acid"], "notes": "Excreted in urine in orotic aciduria and in OTC deficiency.", "loc": "cytosol"}, "omp": {"name": "Orotidine monophosphate", "short": "OMP", "aliases": ["orotidine 5′-monophosphate", "orotidylate", "orotidylic acid"]}, "ump": {"name": "Uridine monophosphate", "short": "UMP", "aliases": ["uridylate", "uridylic acid"]}, "udpm": {"name": "Uridine diphosphate", "short": "UDP", "aliases": []}, "utpm": {"name": "Uridine triphosphate", "short": "UTP", "aliases": [], "notes": "Inhibits CPS II (feedback)."}, "ctp": {"name": "Cytidine triphosphate", "short": "CTP", "aliases": []}, "dudp": {"name": "Deoxyuridine diphosphate", "short": "dUDP", "aliases": []}, "dutp": {"name": "Deoxyuridine triphosphate", "short": "dUTP", "aliases": [], "notes": "Kept low by dUTPase so uracil isn't built into DNA."}, "dump": {"name": "Deoxyuridine monophosphate", "short": "dUMP", "aliases": ["deoxyuridylate"], "notes": "Also made from dCMP by deamination."}, "dtmp": {"name": "Deoxythymidine monophosphate", "short": "dTMP", "aliases": ["thymidylate", "thymidine monophosphate"], "nicknames": ["TMP"], "notes": "The only nucleotide made solely for DNA. Folate or B12 deficiency starves this step → megaloblastic anemia."}}, "enzymes": {"cps2": {"name": "Carbamoyl phosphate synthetase II", "short": "CPS II", "aliases": ["carbamoyl phosphate synthetase 2", "carbamoyl-phosphate synthase II"], "nicknames": ["CAD"], "notes": "Rate-limiting; cytosolic; uses glutamine and 2 ATP. Activated by PRPP and ATP; inhibited by UTP. First domain of the trifunctional CAD protein."}, "atcase": {"name": "Aspartate transcarbamoylase", "short": "ATCase", "aliases": ["aspartate carbamoyltransferase", "aspartate transcarbamylase"], "notes": "Second domain of CAD. (The rate-limiting step in bacteria, not humans.)"}, "dhoase": {"name": "Dihydroorotase", "short": "DHOase", "aliases": [], "notes": "Third domain of CAD; closes the ring."}, "dhodh": {"name": "Dihydroorotate dehydrogenase", "short": "DHODH", "aliases": [], "nicknames": ["dihydroorotate DH"], "notes": "The only mitochondrial step: inner membrane, passes electrons to CoQ. Inhibited by leflunomide/teriflunomide (RA, MS) — they block T-cell proliferation."}, "oprt": {"name": "Orotate phosphoribosyltransferase", "short": "OPRT", "aliases": ["orotate phosphoribosyl transferase", "UMP synthase", "uridine monophosphate synthase"], "notes": "First activity of the bifunctional UMP synthase; attaches the ring to PRPP. UMP synthase deficiency = hereditary orotic aciduria (autosomal recessive): orotic acid in urine, megaloblastic anemia that doesn't respond to B12 or folate, failure to thrive, no hyperammonemia. Treat with uridine."}, "odc": {"name": "OMP decarboxylase", "short": "ODC", "aliases": ["orotidine 5′-phosphate decarboxylase", "orotidine-5′-monophosphate decarboxylase", "orotidylate decarboxylase", "UMP synthase", "uridine monophosphate synthase"], "nicknames": ["OMP decarboxylase"], "notes": "Second activity of UMP synthase (see orotate phosphoribosyltransferase)."}, "umpk": {"name": "UMP/CMP kinase", "short": "UMPK", "aliases": ["uridylate kinase", "nucleoside monophosphate kinase", "UMP kinase", "cytidylate kinase"]}, "ndk": {"name": "Nucleoside diphosphate kinase", "short": "NDK", "aliases": ["nucleoside-diphosphate kinase"], "nicknames": ["NDP kinase"], "notes": "Swaps a phosphate from ATP onto any NDP or dNDP."}, "ctps": {"name": "CTP synthetase", "short": "CTPS", "aliases": ["CTP synthase", "cytidine triphosphate synthetase"], "notes": "Aminates UTP using glutamine and ATP. Inhibited by CTP."}, "rnr": {"name": "Ribonucleotide reductase", "short": "RNR", "aliases": ["ribonucleoside diphosphate reductase", "ribonucleotide diphosphate reductase"], "notes": "Makes all deoxyribonucleotides from NDPs, using thioredoxin (NADPH). Inhibited by hydroxyurea (sickle cell, myeloproliferative disorders); gemcitabine also inhibits it. dATP is the master inhibitor (why ADA deficiency kills lymphocytes)."}, "dutpase": {"name": "dUTPase", "short": "", "aliases": ["deoxyuridine triphosphatase", "dUTP diphosphatase", "dUTP pyrophosphatase"], "notes": "Hydrolyzes dUTP to dUMP + PPi."}, "ts": {"name": "Thymidylate synthase", "short": "TS", "aliases": ["thymidylate synthetase"], "notes": "Methylates dUMP with N⁵,N¹⁰-methylene-THF, which becomes DHF. Inhibited by 5-fluorouracil (as 5-FdUMP, a suicide inhibitor; capecitabine is its prodrug; leucovorin enhances it) and pemetrexed. DHF is recycled to THF by dihydrofolate reductase — inhibited by methotrexate (human), trimethoprim (bacterial) and pyrimethamine (protozoal); leucovorin (folinic acid) rescues methotrexate toxicity."}}, "reactions": [{"id": "r1", "enzyme": "cps2", "from": "glutamine", "to": "carbp", "reversible": false, "cofactors": {"in": ["hco3", "atp", "h2o"], "out": ["glu", "adp", "pi"]}, "loc": "cytosol", "tags": ["rate-limiting", "irreversible"]}, {"id": "r2", "enzyme": "atcase", "from": "carbp", "to": "carbasp", "reversible": false, "cofactors": {"in": ["asp"], "out": ["pi"]}, "loc": "cytosol"}, {"id": "r3", "enzyme": "dhoase", "from": "carbasp", "to": "dho", "reversible": true, "cofactors": {"in": [], "out": ["h2o"]}, "loc": "cytosol"}, {"id": "r4", "enzyme": "dhodh", "from": "dho", "to": "orotate", "reversible": false, "cofactors": {"in": ["coq"], "out": ["coqh2"]}, "loc": "inner mitochondrial membrane"}, {"id": "r5", "enzyme": "oprt", "from": "orotate", "to": "omp", "reversible": true, "cofactors": {"in": ["prpp"], "out": ["ppi"]}, "loc": "cytosol"}, {"id": "r6", "enzyme": "odc", "from": "omp", "to": "ump", "reversible": false, "cofactors": {"in": [], "out": ["co2"]}, "loc": "cytosol", "tags": ["irreversible"]}, {"id": "r7", "enzyme": "umpk", "from": "ump", "to": "udpm", "reversible": true, "cofactors": {"in": ["atp"], "out": ["adp"]}, "loc": "cytosol"}, {"id": "r8", "enzyme": "rnr", "from": "udpm", "to": "dudp", "reversible": false, "cofactors": {"in": ["nadph"], "out": ["nadp", "h2o"]}, "branch": true, "loc": "cytosol"}, {"id": "r9", "enzyme": "ndk", "from": "dudp", "to": "dutp", "reversible": true, "cofactors": {"in": ["atp"], "out": ["adp"]}, "branch": true, "loc": "cytosol"}, {"id": "r10", "enzyme": "dutpase", "from": "dutp", "to": "dump", "reversible": false, "cofactors": {"in": ["h2o"], "out": ["ppi"]}, "branch": true, "loc": "cytosol"}, {"id": "r11", "enzyme": "ts", "from": "dump", "to": "dtmp", "reversible": false, "cofactors": {"in": ["mthf"], "out": ["dhf"]}, "branch": true, "loc": "cytosol", "requires": ["Folate (B9)"]}, {"id": "r12", "enzyme": "ndk", "from": "udpm", "to": "utpm", "reversible": true, "cofactors": {"in": ["atp"], "out": ["adp"]}, "loc": "cytosol"}, {"id": "r13", "enzyme": "ctps", "from": "utpm", "to": "ctp", "reversible": false, "cofactors": {"in": ["gln", "atp", "h2o"], "out": ["glu", "adp", "pi"]}, "loc": "cytosol"}], "distractors": {"metabolites": ["Inosine monophosphate", "Citrulline", "Ornithine", "Uracil", "Thymine", "β-Alanine", "Dihydrouracil", "Argininosuccinate"], "enzymes": ["Carbamoyl phosphate synthetase I", "Ornithine transcarbamylase", "Glutamine-PRPP amidotransferase", "Dihydrofolate reductase", "Thymidine kinase", "Cytidine deaminase", "IMP dehydrogenase", "Hypoxanthine-guanine phosphoribosyltransferase"]}, "tissue": "most cells", "icon": "genetics", "color": "teal"}, "steroidogenesis": {"id": "steroidogenesis", "name": "Steroidogenesis", "group": "Lipids", "systems": ["Endo/Repro"], "aliases": ["steroid synthesis", "adrenal steroid synthesis", "steroid hormone synthesis"], "layout": "grid", "tissue": "adrenal cortex (and gonads)", "grid_columns": ["Mineralocorticoids", "Glucocorticoids", "Androgens", "Estrogens · DHT"], "summary": "Cholesterol → every steroid hormone. StAR moving cholesterol into the mitochondrion is the true rate-limiting event; desmolase (CYP11A1) is the rate-limiting enzyme, driven by ACTH (adrenal) and LH (gonads). Columns follow the adrenal zones: glomerulosa (salt — aldosterone, angiotensin II), fasciculata (sugar — cortisol, ACTH), reticularis (sex — androgens, ACTH). Most enzymes are cytochrome P450s (NADPH + O₂).", "metabolites": {"chol": {"name": "Cholesterol", "short": "", "aliases": [], "notes": "From LDL uptake (mainly) or made in place; stored as cholesteryl esters.", "pos": [0, 0]}, "cholm": {"name": "Cholesterol (mitochondria)", "short": "", "aliases": ["cholesterol"], "pos": [0, 1]}, "preg": {"name": "Pregnenolone", "short": "", "aliases": [], "notes": "Precursor to all steroid hormones.", "pos": [0, 2]}, "ohpreg": {"name": "17α-Hydroxypregnenolone", "short": "17-OH-pregnenolone", "aliases": ["17-hydroxypregnenolone", "17 alpha hydroxypregnenolone"], "pos": [1, 2]}, "dhea": {"name": "DHEA", "short": "DHEA", "aliases": ["dehydroepiandrosterone"], "nicknames": ["DHEA"], "notes": "Main adrenal androgen (with DHEA-S); weak on its own.", "pos": [2, 2]}, "prog": {"name": "Progesterone", "short": "", "aliases": [], "pos": [0, 3]}, "ohprog": {"name": "17α-Hydroxyprogesterone", "short": "17-OH-progesterone", "aliases": ["17-hydroxyprogesterone"], "nicknames": ["17-OHP"], "notes": "↑ in 21-hydroxylase deficiency — the newborn screening marker.", "pos": [1, 3]}, "andro": {"name": "Androstenedione", "short": "", "aliases": ["androstenedione"], "pos": [2, 3]}, "estrone": {"name": "Estrone", "short": "E1", "aliases": [], "notes": "Main estrogen after menopause (made in adipose).", "pos": [3, 3]}, "doc": {"name": "11-Deoxycorticosterone", "short": "DOC", "aliases": ["deoxycorticosterone", "11-deoxycorticosterone"], "notes": "A weak mineralocorticoid — in excess (11β-hydroxylase or 17α-hydroxylase deficiency) it causes hypertension and hypokalemia.", "pos": [0, 4]}, "deoxycortisol": {"name": "11-Deoxycortisol", "short": "", "aliases": ["deoxycortisol", "11-deoxycortisol"], "pos": [1, 4]}, "testo": {"name": "Testosterone", "short": "", "aliases": [], "pos": [2, 4]}, "estradiol": {"name": "Estradiol", "short": "E2", "aliases": ["17β-estradiol", "oestradiol"], "pos": [3, 4]}, "corticosterone": {"name": "Corticosterone", "short": "", "aliases": [], "pos": [0, 5]}, "cortisol": {"name": "Cortisol", "short": "", "aliases": ["hydrocortisone"], "notes": "Feeds back on ACTH. Low cortisol → ↑ ACTH → adrenal hyperplasia in CAH.", "pos": [1, 5]}, "dht": {"name": "Dihydrotestosterone", "short": "DHT", "aliases": ["dihydrotestosterone", "5α-dihydrotestosterone"], "notes": "Drives external male genitalia, prostate growth, male-pattern baldness.", "pos": [2, 5]}, "aldo": {"name": "Aldosterone", "short": "", "aliases": [], "notes": "Zona glomerulosa only; driven by angiotensin II and K⁺, not much by ACTH.", "pos": [0, 6]}}, "enzymes": {"star": {"name": "StAR protein", "short": "StAR", "aliases": ["steroidogenic acute regulatory protein"], "notes": "Moves cholesterol from the outer to the inner mitochondrial membrane — the acute, rate-limiting event. Mutations → congenital lipoid adrenal hyperplasia."}, "scc": {"name": "Desmolase", "short": "CYP11A1", "aliases": ["cholesterol desmolase", "cholesterol side-chain cleavage enzyme", "side-chain cleavage enzyme", "P450scc"], "notes": "Rate-limiting enzyme. Stimulated by ACTH (adrenal) and LH (gonads). Inhibited by ketoconazole (also blocks 17,20-lyase)."}, "hsd3b": {"name": "3β-Hydroxysteroid dehydrogenase", "short": "3β-HSD", "aliases": ["3-beta-hydroxysteroid dehydrogenase"], "nicknames": ["3 beta HSD"], "notes": "Acts at three spots (pregnenolone, 17-OH-pregnenolone, DHEA). Deficiency: ↓ all three classes, salt wasting; ambiguous genitalia in both sexes."}, "cyp17h": {"name": "17α-Hydroxylase", "short": "CYP17A1", "aliases": ["17-alpha-hydroxylase", "17 alpha hydroxylase", "17-hydroxylase"], "nicknames": ["CYP17"], "notes": "Deficiency: ↓ cortisol and sex hormones, ↑ DOC → hypertension, hypokalemia; XY undervirilized (female-appearing), XX lacks secondary sexual development. Abiraterone inhibits CYP17."}, "cyp17l": {"name": "17,20-Lyase", "short": "CYP17A1", "aliases": ["17,20 lyase", "17,20-desmolase", "17 20 lyase"], "notes": "Same CYP17A1 protein as 17α-hydroxylase. Inhibited by ketoconazole and abiraterone."}, "cyp21": {"name": "21-Hydroxylase", "short": "CYP21A2", "aliases": ["21-hydroxylase", "21 hydroxylase", "21-alpha-hydroxylase"], "nicknames": ["CYP21"], "notes": "Most common CAH (>90%): ↓ cortisol and aldosterone, ↑ 17-OH-progesterone and androgens → salt wasting, hypotension, hyperkalemia, ↑ renin; virilized XX, precocious puberty in XY."}, "cyp11b1": {"name": "11β-Hydroxylase", "short": "CYP11B1", "aliases": ["11-beta-hydroxylase", "11 beta hydroxylase"], "notes": "Deficiency: ↓ cortisol and aldosterone but ↑ 11-deoxycorticosterone → hypertension and hypokalemia (↓ renin), plus virilization."}, "cyp11b2": {"name": "Aldosterone synthase", "short": "CYP11B2", "aliases": ["aldosterone synthetase", "18-hydroxylase"], "notes": "Zona glomerulosa only; activated by angiotensin II and hyperkalemia."}, "hsd17b": {"name": "17β-Hydroxysteroid dehydrogenase", "short": "17β-HSD", "aliases": ["17-beta-hydroxysteroid dehydrogenase"], "nicknames": ["17 beta HSD"], "notes": "Testes (Leydig cells) and ovary. Deficiency → undervirilized XY."}, "arom": {"name": "Aromatase", "short": "CYP19A1", "aliases": ["estrogen synthase", "aromatase"], "nicknames": ["CYP19"], "notes": "Granulosa cells, adipose, placenta. Inhibitors (anastrozole, letrozole) treat ER+ breast cancer. Deficiency → maternal virilization in pregnancy."}, "srd5a": {"name": "5α-Reductase", "short": "SRD5A2", "aliases": ["5-alpha-reductase" esis", "dir": "out"}, {"at": "citrate", "to": "fatty-acid-synthesis", "dir": "out"}, {"at": "succoa", "to": "heme", "dir": "out"}, {"at": "succoa", "to": "propionyl-coa", "dir": "in"}, {"at": "fumarate", "to": "urea", "dir": "in"}]}, "urea": {"id": "urea", "name": "Urea cycle", "group": "Nitrogen & amino acids", "systems": ["Fundamentals", "GI", "Renal"], "tags": ["Amino acids"], "aliases": ["ornithine cycle", "Krebs–Henseleit cycle", "Krebs-Henseleit cycle"], "summary": "Liver. Starts in mitochondria — carbamoyl phosphate synthetase I (rate-limiting; NH₃ + HCO₃⁻ + 2 ATP → carbamoyl phosphate; needs N-acetylglutamate) and ornithine transcarbamylase — then finishes in the cytosol. Urea's two nitrogens: one from NH₃ (via carbamoyl phosphate), one from aspartate. “Ordinarily, Careless Crappers Are Also Frivolous About Urination.”", "circular": true, "metabolites": {"ornithine": {"name": "Ornithine", "short": "Orn", "aliases": [], "notes": "Carried back into the mitochondrion to take up the next carbamoyl phosphate."}, "citrulline": {"name": "Citrulline", "short": "Cit", "aliases": [], "notes": "Leaves the mitochondrion for the cytosolic steps."}, "argsucc": {"name": "Argininosuccinate", "short": "ASA", "aliases": ["argininosuccinic acid"]}, "arginine": {"name": "Arginine", "short": "Arg", "aliases": [], "notes": "Also the substrate for nitric oxide synthase (→ NO + citrulline)."}}, "enzymes": {"otc": {"name": "Ornithine transcarbamylase", "short": "OTC", "aliases": ["ornithine transcarbamoylase", "ornithine carbamoyltransferase"], "notes": "Mitochondrial. Takes carbamoyl phosphate from CPS I. OTC deficiency is the most common urea cycle disorder (X-linked): hyperammonemia and ↑ orotic acid (excess carbamoyl phosphate spills into pyrimidine synthesis) with NO megaloblastic anemia — unlike UMP synthase deficiency."}, "ass": {"name": "Argininosuccinate synthetase", "short": "ASS", "aliases": ["argininosuccinate synthase"], "notes": "Brings in the second nitrogen (aspartat <script>
/* Shared helpers. Plain scripts sharing one global scope, concatenated in order by build.py:
   util → store → model → draw → stats → editor → study. */
'use strict';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uniq = a => [...new Set(a)];
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
const uniqueId = (base, taken) => { let id = base, n = 2; while (taken.has(id)) id = `${base}-${n++}`; return id; };

const ICON = {
  ok: '<path d="M3.5 8.5l3 3 6-7"/>',
  no: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
};
const icon = k => `<svg class="ic ${k}" viewBox="0 0 16 16" aria-hidden="true">${ICON[k]}</svg>`;

// Greek letters fold to their Latin initial, whether typed as α, "alpha" or just "a": a-ketoglutarate ≡ α-ketoglutarate.
// Applied to both the answer and what was typed, so any word that happens to start "beta…" folds the same on both sides.
const GREEK = { α: 'a', β: 'b', γ: 'g', δ: 'd', ε: 'e', θ: 'th', κ: 'k', ω: 'o' };
const GREEK_WORDS = { alpha: 'a', beta: 'b', gamma: 'g', delta: 'd', epsilon: 'e', theta: 'th', kappa: 'k', omega: 'o' };
const foldGreek = s => String(s).replace(/[αβγδεθκω]/g, c => GREEK[c]);
// Case-, space- and punctuation-insensitive; "phosphate" ≡ "P", "bisphosphate"/"diphosphate" ≡ "BP"; Greek folded.
function norm(s) {
  return foldGreek(String(s).toLowerCase())
    .replace(/\b(alpha|beta|gamma|delta|epsilon|theta|kappa|omega)/g, w => GREEK_WORDS[w])
    .normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/\b(bis|di)phosphate\b/g, 'bp').replace(/\bphosphate\b/g, 'p')
    .replace(/[\s\-_,.'’()\/]/g, '');
}

function download(name, text) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return true;
  } catch { return false; }
}

/* In-page stand-ins for alert / confirm / prompt — the native ones are disabled inside shared artifacts.
   ask() resolves to the typed text (input), true (confirmed) or null (cancelled). */
function ask({ title, text = '', input = false, value = '', ok = 'OK', cancel = 'Cancel', copy = false, alt = '', allowEmpty = false, html = '' }) {
  const d = document.getElementById('askDialog');
  d.innerHTML = `<form method="dialog" class="dlg">
    <div class="dlg-h"><h2>${esc(title)}</h2></div>
    ${text ? `<p class="ask-text">${esc(text).replace(/\n/g, '<br>')}</p>` : ''}${html}
    ${input === 'area' ? `<textarea id="askInput" rows="14" spellcheck="false">${esc(value)}</textarea>` : input ? `<input id="askInput" value="${esc(value)}" autocomplete="off">` : ''}
    <div class="actions">
      <button class="btn primary" value="ok">${esc(ok)}</button>
      ${copy ? '<button class="btn" type="button" id="askCopy">Copy</button>' : ''}
      ${alt ? `<button class="btn" value="alt">${esc(alt)}</button>` : ''}
      ${cancel ? `<button class="btn ghost" value="cancel" formnovalidate>${esc(cancel)}</button>` : ''}
    </div></form>`;
  return new Promise(res => {
    const inp = d.querySelector('#askInput');
    d.querySelector('#askCopy')?.addEventListener('click', e => {
      navigator.clipboard?.writeText(inp.value).then(() => { e.target.textContent = 'Copied'; }, () => { inp.select(); e.target.textContent = 'Selected — press ⌘C'; });
    });
    d.addEventListener('close', () => {
      if (d.returnValue === 'alt') return res('alt');
      if (d.returnValue !== 'ok') return res(null);
      res(input ? (inp.value.trim() || (allowEmpty ? '' : null)) : true);
    }, { once: true });
    d.returnValue = '';
    d.showModal();
    if (inp) { inp.focus(); inp.select(); }
  });
}
const say = (title, text) => ask({ title, text, cancel: null });
// A short message at the bottom of the screen that goes away by itself.
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200);
}
</script>
<script>
/* Version + changelog. While working, add notes to the { v: 'next' } entry at the top of CHANGELOG (create it
   if it's missing). ./release.sh turns it into the next version number with today's date and publishes.

    'Every element now has full names and nicknames. The answer panel lists both (“Also called” and “Sometimes written as”), whatever your settings, and the editor has a field for each.',

const PENDING = CHANGELOG.filter(e => e.v === 'next'), RELEASED = CHANGELOG.filter(e => e.v !== 'next');
const isPreview = () => PENDING.some(e => e.items.length);
const cmpVer = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; };
function changelogHTML(entries) {
  return entries.map(e => `<div class="cl-entry"><div class="cl-h"><b>${e.v === 'next' ? 'Not released yet' : 'Version ' + esc(e.v)}</b><span class="muted small">${e.v === 'next' ? 'only on your copy' : new Date(e.date + 'T12:00').toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' })}</span></div>
    <ul>${e.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
}
function showChangelog(entries = RELEASED, title = 'What’s new') {
  return ask({ title, html: `<div class="changelog">${changelogHTML(entries)}</div>`, ok: 'Got it', cancel: null });
}
// Called once on boot (after the tour / data notice). hadData = this browser was used before versions existed.
async function announceUpdate(hadData) {
  const seen = local.get('pathways.seenVersion');
  local.set('pathways.seenVersion', APP_VERSION);
  if (!seen) { if (hadData) await showChangelog(RELEASED.slice(0, 1)); return; }
  const fresh = RELEASED.filter(e => cmpVer(e.v, seen) > 0);
  if (fresh.length) await showChangelog(fresh);
}
// The self-hosted copy runs whatever is on the dev branch; when that includes unreleased changes, say so.
function previewBadge() {
  const b = $('#previewBadge');
  if (!b) return;
  b.hidden = !(Store.mode === 'server' && isPreview());
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-preview]')) showChangelog(PENDING, 'Preview: not released yet');
  const c = e.target.closest('[data-copy-public]');
  if (c) navigator.clipboard.writeText(PUBLIC_SITE).then(() => toast('Link copied'), () => toast(PUBLIC_SITE));
});

/* Tooltips: any element with data-tip shows it in a small label on hover or keyboard focus (native title tooltips are slow
   to appear, and Safari often never shows them). One label for the whole page, kept on screen. */
(() => {
  let tip = null, on = null;
  const hide = () => { on = null; if (tip) tip.hidden = true; };
  const show = el => {
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'tooltip'); document.body.append(tip); }
    on = el; tip.textContent = el.dataset.tip; tip.hidden = false;
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect(), gap = 6;
    const below = r.bottom + gap + t.height <= innerHeight - 4;
    tip.style.top = (below ? r.bottom + gap : r.top - gap - t.height) + 'px';
    tip.style.left = Math.min(innerWidth - t.width - 6, Math.max(6, r.left + r.width / 2 - t.width / 2)) + 'px';
  };
  document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const el = e.target.closest?.('[data-tip]'); if (el && el !== on) show(el); else if (!el && on) hide(); });
  document.addEventListener('pointerout', e => { if (on && !on.contains(e.relatedTarget)) hide(); });

<script>

   Standalone (dist/pathways.html, GitHub Pages, any static host): this browser's localStorage — export to back up or share.

/* ---------- keeping saved data safe across updates ----------
   The rules (tools/test-data.js enforces them before every release):
   1. Saved data carries `schema`. Changing what gets saved means bumping SCHEMA and adding one step to MIGRATIONS
      (schema n → n+1). A step that has shipped is never edited; old data runs every step in order.
   2. Before upgrading, the old data is kept as a safety copy (this browser, or the server's daily backups).
   3. Data saved by a newer version is never overwritten by an older one: the app goes read-only and says why.
   4. Ids of built-in pathways, metabolites and reactions are what history, tags and favorites hang on. Renaming or

const SCHEMA = 1;

  d.presets = arr(d.presets).filter(x => x && typeof x === 'object');

  { id: 'b-random', name: 'Recall from anywhere', blurb: 'Random starting point; forward, then backward.',
    mode: 'total', start: 'random', el: { met: 'quiz', enz: 'quiz', cof: 'show' } },
  { id: 'b-enzyme', name: 'Name the enzyme', blurb: 'Two metabolites; which enzyme, which cofactors, which way.',

  { id: 'b-reaction', name: 'What does it do?', blurb: 'Given an enzyme: reactants, products, cofactors and pathway.',
