<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathways</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d5fa8'/%3E%3Cpath d='M16 6v8M16 18v8' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" class="brand-tile"/><path d="M16 6v8M16 18v8" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="3" fill="#fff"/></svg>
    <span>Pathways</span>
  </div>
  <label class="pick">
    <span class="sr">Pathway</span>
    <select id="pathway"></select>
  </label>
</header>

<section class="controls" aria-label="Study settings">
  <div class="group" role="radiogroup" aria-label="Mode" data-key="mode">
    <span class="glabel">Mode</span>
    <button data-v="single">Single blank</button>
    <button data-v="total">Full recall</button>
    <button data-v="step">Single step</button>
  </div>
  <div class="group" role="radiogroup" aria-label="View" data-key="view">
    <span class="glabel">View</span>
    <button data-v="flow">Flow</button>
    <button data-v="list">List</button>
  </div>
  <div class="group" role="radiogroup" aria-label="Answer" data-key="answer">
    <span class="glabel">Answer</span>
    <button data-v="type">Type</button>
    <button data-v="choice">Choice</button>
    <button data-v="self">Self-check</button>
  </div>
  <div class="group chips" id="incGroup" aria-label="Quiz on">
    <span class="glabel">Quiz on</span>
    <button data-inc="met" aria-pressed="true">Metabolites</button>
    <button data-inc="enz" aria-pressed="true">Enzymes</button>
  </div>
  <div class="group" role="radiogroup" aria-label="List direction" data-key="dir" id="dirGroup">
    <span class="glabel">List</span>
    <button data-v="v">Top–bottom</button>
    <button data-v="h">Left–right</button>
  </div>
</section>

<p class="summary" id="summary"></p>

<main class="layout">
  <section class="stage card" id="stageCard">
    <div id="stage"></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="panel card" id="panel" aria-live="polite"></aside>
</main>

<script src="app.js"></script>
</body>
</html>
